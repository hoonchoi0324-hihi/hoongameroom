<!DOCTYPE html>

<style>
:root{--ink:#2b1a10;--gold:#ffcf33;--bg:#2b1a10;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1a0f09;}}
:root[data-theme="dark"]{--bg:#1a0f09;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{margin:0;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
body{height:100%;}

<body>
<canvas id="c" aria-label="할아버지의 새로운 롤랙스 게임 화면"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

const FT="'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
const FB="'Gaegu','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
const INK='#2b1a10',GOLD='#ffcf33',PINK='#ff4fa3';
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function sc(){return clamp(Math.min(W/420,H/760),0.7,1.3);}

/* ---------- 소리 ---------- */
let AC=null;
function au(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();if(AC&&MUS.on&&!MUS.playing)musStart();}
function beep(f,d=0.1,type='square',v=0.07,delay=0){if(!AC)return;try{const t0=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+0.02);}catch(e){}}
function fanfare(){[523,659,784,1047].forEach((f,i)=>beep(f,0.25,'triangle',0.08,i*0.12));}
function sadTrombone(){[392,370,349,311].forEach((f,i)=>beep(f,i===3?0.7:0.3,'sawtooth',0.05,i*0.3));}

/* ---------- 입력 ---------- */
const P={x:0,y:0,down:false,tap:false,tx:-999,ty:-999,kb:false};
const K={l:false,r:false};
function pt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
cv.addEventListener('pointerdown',e=>{au();const[x,y]=pt(e);if(Math.hypot(x-(W-32),y-92)<26){musToggle();return;}P.x=x;P.y=y;P.tx=x;P.ty=y;P.down=true;P.tap=true;});
cv.addEventListener('pointermove',e=>{const[x,y]=pt(e);P.x=x;P.y=y;});
addEventListener('pointerup',()=>P.down=false);
addEventListener('pointercancel',()=>P.down=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{au();if(e.code==='KeyM')musToggle();if(e.code==='Space'||e.code==='Enter'){if(!e.repeat){P.tap=true;P.kb=true;P.tx=P.ty=-999;}e.preventDefault();}
 if(e.code==='ArrowLeft'||e.code==='KeyA')K.l=true;if(e.code==='ArrowRight'||e.code==='KeyD')K.r=true;});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')K.l=false;if(e.code==='ArrowRight'||e.code==='KeyD')K.r=false;});

/* ---------- 그리기 도구 ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(s,x,y,size,col,font=FB,al='center',stroke=false){ctx.font=`${size}px ${font}`;ctx.textAlign=al;ctx.textBaseline='middle';if(stroke){ctx.lineWidth=Math.max(3,size/6);ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillStyle=col;ctx.fillText(s,x,y);}
function wrap(s,maxW,size,font){ctx.font=`${size}px ${font}`;const out=[];for(const par of s.split('\n')){let line='';for(const w of par.split(' ')){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}out.push(line);}return out;}
function btn(label,x,y,w,h){const hit=(P.tap&&P.tx>x-w/2&&P.tx<x+w/2&&P.ty>y-h/2&&P.ty<y+h/2)||P.kb;
 ctx.fillStyle=INK;rr(x-w/2+4,y-h/2+6,w,h,16);ctx.fill();ctx.fillStyle=GOLD;rr(x-w/2,y-h/2,w,h,16);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
 txt(label,x,y+2,Math.min(26,h*0.46),INK,FT);if(hit)beep(660,0.08);return hit;}

let floats=[],bits=[];
function addF(t,x,y,c='#fff',s=24){floats.push({t,x,y,c,s,life:1.3});}
function updDrawFX(dt){
 bits.forEach(b=>{b.vy+=900*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.r+=b.vr*dt;b.life-=dt;spr(b.e,b.x,b.y,b.s,b.r);});
 bits=bits.filter(b=>b.life>0&&b.y<H+50);
 floats.forEach(f=>{f.y-=45*dt;f.life-=dt;ctx.globalAlpha=clamp(f.life*2,0,1);txt(f.t,f.x,f.y,f.s,f.c,FT,'center',true);});
 ctx.globalAlpha=1;floats=floats.filter(f=>f.life>0);}
function burst(x,y,arr,n=6){for(let i=0;i<n;i++)bits.push({x,y,vx:rand(-320,320),vy:rand(-520,-180),r:0,vr:rand(-8,8),e:arr[(Math.random()*arr.length)|0],s:rand(18,30),life:1.6});}

function room(wall,floor,hz=0.66){
 ctx.fillStyle=wall;ctx.fillRect(0,0,W,H*hz);
 ctx.fillStyle='rgba(255,255,255,.09)';for(let x=0;x<W;x+=38)ctx.fillRect(x,0,15,H*hz);
 ctx.fillStyle=floor;ctx.fillRect(0,H*hz,W,H*(1-hz));
 ctx.strokeStyle='rgba(120,60,10,.22)';ctx.lineWidth=2;
 for(let y=H*hz+34,k=0;y<H;y+=42,k++){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();for(let x=(k%2)*60;x<W;x+=120){ctx.beginPath();ctx.moveTo(x,y-42);ctx.lineTo(x,y);ctx.stroke();}}
 ctx.fillStyle='#6b4423';ctx.fillRect(0,H*hz-10,W,12);}

function hud(l,r,lives=0){const s=Math.min(22,W*0.05);ctx.fillStyle='rgba(43,26,16,.78)';rr(10,10,W-20,46,14);ctx.fill();txt(l,24,33,s,'#fff',FT,'left');let x=W-24;if(r){txt(r,x,33,s,GOLD,FT,'right');ctx.font=`${s}px ${FT}`;x-=ctx.measureText(r).width+14;}for(let i=0;i<lives;i++)spr('heart',x-11-i*26,34,22);}
function banner(name,sub,t){if(t>1.5)return;const a=t<0.2?t/0.2:t>1.2?(1.5-t)/0.3:1;ctx.globalAlpha=clamp(a,0,1);ctx.fillStyle='rgba(43,26,16,.85)';ctx.fillRect(0,H*0.36,W,H*0.22);
 txt(name,W/2,H*0.44,Math.min(46,W*0.1),GOLD,FT,'center',true);txt(sub,W/2,H*0.52,Math.min(26,W*0.06),'#fff',FB);ctx.globalAlpha=1;}

/* 롤랙스 */
function drawWatch(x,y,r,t,stopped=false,glow=1,rot=0){ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);
 if(glow>0){const g=ctx.createRadialGradient(0,0,r*0.4,0,0,r*2.6);g.addColorStop(0,`rgba(255,235,120,${0.65*glow})`);g.addColorStop(1,'rgba(255,235,120,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*2.6,0,7);ctx.fill();}
 ctx.fillStyle='#e0a91f';ctx.fillRect(-r*0.55,-r*1.9,r*1.1,r*3.8);ctx.strokeStyle='#8a5a00';ctx.lineWidth=Math.max(1,r*0.06);ctx.strokeRect(-r*0.55,-r*1.9,r*1.1,r*3.8);
 for(let i=-3;i<=3;i++){if(Math.abs(i)<2)continue;ctx.beginPath();ctx.moveTo(-r*0.55,i*r*0.5);ctx.lineTo(r*0.55,i*r*0.5);ctx.stroke();}
 ctx.fillStyle=GOLD;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.lineWidth=r*0.08;ctx.stroke();
 ctx.strokeStyle='#b07d00';ctx.lineWidth=Math.max(1,r*0.05);for(let i=0;i<24;i++){const a=i/24*6.283;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*0.86,Math.sin(a)*r*0.86);ctx.lineTo(Math.cos(a)*r*0.97,Math.sin(a)*r*0.97);ctx.stroke();}
 ctx.fillStyle='#fffbe8';ctx.beginPath();ctx.arc(0,0,r*0.78,0,7);ctx.fill();
 for(let i=0;i<12;i++){const a=i/12*6.283;ctx.fillStyle=i%3===0?PINK:(i%3===1?'#35d0ff':'#3ddc84');ctx.beginPath();ctx.arc(Math.cos(a)*r*0.64,Math.sin(a)*r*0.64,r*0.07,0,7);ctx.fill();}
 if(r>14)txt('롤랙스',0,-r*0.3,r*0.2,'#8a5a00',FT);
 const k=stopped?0:t;const hand=(len,w,a,c)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a-1.571)*len,Math.sin(a-1.571)*len);ctx.stroke();};
 hand(r*0.38,r*0.09,stopped?4.2:k*0.25,INK);hand(r*0.56,r*0.06,stopped?1.1:k*1.6,INK);hand(r*0.6,r*0.025,stopped?2.6:k*6.283,PINK);
 ctx.fillStyle=INK;ctx.beginPath();ctx.arc(0,0,r*0.06,0,7);ctx.fill();ctx.restore();}

/* ---------- 그래픽 모듈 (이모지 대신 직접 그린 그림) ---------- */
const SKIN='#f6cfa6';
function ol(w=3){ctx.lineWidth=w;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.lineCap='round';}
function circ(x,y,r,fill,stroke=true){ctx.beginPath();ctx.arc(x,y,r,0,7);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke)ctx.stroke();}
function starPath(x,y,R,n=5,ir=0.45,rot=-Math.PI/2){ctx.beginPath();for(let i=0;i<n*2;i++){const r=i%2?R*ir:R,a=rot+i*Math.PI/n;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();}
function heartPath(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*0.75);ctx.bezierCurveTo(x-s*1.3,y-s*0.1,x-s*0.6,y-s*1.05,x,y-s*0.35);ctx.bezierCurveTo(x+s*0.6,y-s*1.05,x+s*1.3,y-s*0.1,x,y+s*0.75);ctx.closePath();}

function spr(n,x,y,size,rot=0,flip=false,t=0){ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(flip)ctx.scale(-1,1);const s=size/2;ol(Math.max(1.5,size/14));
 switch(n){
 case 'sparkle':ctx.fillStyle='#fff6a8';starPath(0,0,s,4,0.28);ctx.fill();ctx.strokeStyle='#e0a91f';ctx.lineWidth=Math.max(1,size/22);ctx.stroke();break;
 case 'star':ctx.fillStyle=GOLD;starPath(0,0,s,5,0.45);ctx.fill();ctx.stroke();break;
 case 'heart':ctx.fillStyle=PINK;heartPath(0,0,s*0.8);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(-s*0.38,-s*0.28,s*0.14,s*0.09,-0.6,0,7);ctx.fill();break;
 case 'paper':ctx.fillStyle='#fff';ctx.fillRect(-s*0.7,-s*0.9,s*1.4,s*1.8);ctx.strokeRect(-s*0.7,-s*0.9,s*1.4,s*1.8);ctx.strokeStyle='#bbb';ctx.lineWidth=Math.max(1,s*0.08);for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-s*0.45,-s*0.5+i*s*0.35);ctx.lineTo(s*0.45,-s*0.5+i*s*0.35);ctx.stroke();}break;
 case 'news':ctx.fillStyle='#e8e3d3';ctx.fillRect(-s,-s*0.75,s*2,s*1.5);ctx.strokeRect(-s,-s*0.75,s*2,s*1.5);ctx.fillStyle='#555';ctx.fillRect(-s*0.8,-s*0.55,s*1.6,s*0.3);ctx.fillStyle='#999';for(let i=0;i<3;i++)ctx.fillRect(-s*0.8,-s*0.1+i*s*0.25,s*(i===2?0.9:1.6),s*0.1);break;
 case 'box':ctx.fillStyle='#c8935a';ctx.beginPath();ctx.moveTo(-s,-s*0.6);ctx.lineTo(s*0.7,-s*0.9);ctx.lineTo(s,s*0.4);ctx.lineTo(-s*0.5,s*0.8);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#e8d29a';ctx.fillRect(-s*0.2,-s*0.7,s*0.3,s*1.3);break;
 case 'bubble':ctx.fillStyle='rgba(200,240,255,.65)';ctx.strokeStyle='#7fb8d9';circ(0,0,s*0.8,'rgba(200,240,255,.65)');ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-s*0.3,-s*0.3,s*0.2,0,7);ctx.fill();break;
 case 'feather':ctx.fillStyle='#1d1d1d';ctx.beginPath();ctx.ellipse(0,0,s*0.35,s,0.4,0,7);ctx.fill();ctx.strokeStyle='#666';ctx.stroke();ctx.strokeStyle='#ddd';ctx.lineWidth=Math.max(1,s*0.08);ctx.beginPath();ctx.moveTo(-s*0.38,s*0.9);ctx.lineTo(s*0.38,-s*0.9);ctx.stroke();break;
 case 'burst':ctx.fillStyle='#ff6b3d';starPath(0,0,s,10,0.55,0);ctx.fill();ctx.stroke();ctx.fillStyle='#ffe14d';starPath(0,0,s*0.55,10,0.55,0.3);ctx.fill();break;
 case 'sponge':ctx.fillStyle='#ffd84d';rr(-s,-s*0.5,s*2,s*1.1,s*0.25);ctx.fill();ctx.stroke();ctx.fillStyle='#3fae5a';rr(-s,-s*0.75,s*2,s*0.38,s*0.15);ctx.fill();ctx.stroke();ctx.fillStyle='#e0b52f';[[-0.5,0.05],[0.1,0.25],[0.55,-0.05],[-0.15,-0.15]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(a*s,b*s,s*0.1,0,7);ctx.fill();});break;
 case 'bolt':ctx.fillStyle='#9aa3ad';ctx.fillRect(-s*0.22,-s*0.2,s*0.44,s*1.1);ctx.strokeRect(-s*0.22,-s*0.2,s*0.44,s*1.1);ctx.strokeStyle='#5c646d';ctx.lineWidth=Math.max(1,s*0.08);for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-s*0.22,s*0.05+i*s*0.22);ctx.lineTo(s*0.22,-s*0.05+i*s*0.22);ctx.stroke();}ol(Math.max(1.5,size/14));ctx.fillStyle='#c3cad1';ctx.beginPath();for(let i=0;i<6;i++){const a=i/6*6.283;ctx.lineTo(Math.cos(a)*s*0.55,-s*0.45+Math.sin(a)*s*0.3);}ctx.closePath();ctx.fill();ctx.stroke();break;
 case 'alarm':circ(-s*0.55,-s*0.65,s*0.28,'#ffcf33');circ(s*0.55,-s*0.65,s*0.28,'#ffcf33');ctx.beginPath();ctx.moveTo(-s*0.5,s*0.6);ctx.lineTo(-s*0.7,s*0.95);ctx.moveTo(s*0.5,s*0.6);ctx.lineTo(s*0.7,s*0.95);ctx.stroke();circ(0,0,s*0.8,'#e23b3b');circ(0,0,s*0.58,'#fff');ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-s*0.4);ctx.moveTo(0,0);ctx.lineTo(s*0.3,s*0.1);ctx.stroke();break;
 case 'anger':ctx.strokeStyle='#e23b3b';ctx.lineWidth=Math.max(2,s*0.22);for(let i=0;i<4;i++){ctx.save();ctx.rotate(i*Math.PI/2);ctx.beginPath();ctx.moveTo(s*0.2,-s*0.75);ctx.quadraticCurveTo(s*0.25,-s*0.25,s*0.75,-s*0.2);ctx.stroke();ctx.restore();}break;
 case 'zzz':{const f=FT;[0,1,2].forEach(i=>{const a=0.5+0.5*Math.sin(t*3-i);ctx.globalAlpha*=1;txt('Z',i*s*0.45,-i*s*0.5,s*(0.7+i*0.25),'#cfe8ff',f,'center',true);});break;}
 case 'flower':ctx.fillStyle='#ffb3c8';for(let i=0;i<5;i++){const a=i/5*6.283;ctx.beginPath();ctx.arc(Math.cos(a)*s*0.5,Math.sin(a)*s*0.5,s*0.42,0,7);ctx.fill();}ctx.fillStyle=GOLD;ctx.beginPath();ctx.arc(0,0,s*0.3,0,7);ctx.fill();break;
 case 'tree':ctx.fillStyle='#7a4a24';ctx.fillRect(-s*0.12,-s*0.9,s*0.24,s*0.9);ctx.strokeRect(-s*0.12,-s*0.9,s*0.24,s*0.9);
  [[0,-1.45,0.55],[-0.4,-1.1,0.42],[0.4,-1.1,0.42],[0,-1.0,0.45]].forEach(([a,b,c])=>circ(a*s,b*s,c*s,'#4caf50'));ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.arc(-s*0.15,-s*1.6,s*0.15,0,7);ctx.fill();break;
 }
 ctx.restore();}

function drawFace(ex,r,t,my=0.42){const L=Math.max(1.5,r*0.09);ctx.lineWidth=L;ctx.strokeStyle=INK;ctx.fillStyle=INK;ctx.lineCap='round';ctx.lineJoin='round';
 const X=r*0.36,Y=-r*0.06,M=r*my;
 const dot=(x,y,q)=>{ctx.beginPath();ctx.arc(x,y,q,0,7);ctx.fill();};
 const ln=(a,b,c,d)=>{ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();};
 const smile=(w=0.26,y=M)=>{ctx.beginPath();ctx.arc(0,y-r*w*0.6,r*w,0.2*Math.PI,0.8*Math.PI);ctx.stroke();};
 const blush=()=>{ctx.fillStyle='rgba(255,90,120,.35)';dot(-X-r*0.14,Y+r*0.3,r*0.14);dot(X+r*0.14,Y+r*0.3,r*0.14);ctx.fillStyle=INK;};
 const wavy=(w,y)=>{ctx.beginPath();for(let i=0;i<=6;i++)ctx.lineTo(-w+i*w/3,y+(i%2?-1:1)*r*0.05);ctx.stroke();};
 switch(ex){
 case 'giggle':[-X,X].forEach(x=>{ctx.beginPath();ctx.arc(x,Y+r*0.06,r*0.11,Math.PI,2*Math.PI);ctx.stroke();});blush();smile(0.16);break;
 case 'dizzy':[-X,X].forEach(x=>{ctx.beginPath();for(let a=0;a<12;a+=0.4){const q=a*r*0.013;ctx.lineTo(x+Math.cos(a+t*8)*q,Y+Math.sin(a+t*8)*q);}ctx.stroke();});wavy(r*0.3,M);break;

 if(P.tap){if(this.ch<c.l.length)this.ch=c.l.length;else{this.i++;this.ch=0;beep(520,0.05);if(this.i>=ENDC.length)go(CRED);}}
}};

const CRED={init(){this.off=0;},frame(dt){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 const L=['할아버지의 새로운 롤랙스',"Grandpa's New Rollacs",'','주연   할아버지','조연   90년 된 괘종시계','악역   동네 까치 연합','특별출연   박 여사의 안경','','받은 부러움   '+S.bureum+'번','다시 도전   '+S.tries+'번','','모티프   Henry Clay Work','배경음악   그 노래의 신나는 힙합 리믹스','「Grandfather\'s Clock」 (1876)','','이 게임에 나오는 시계 이름은','실제 브랜드와 아무 관계 없습니다','(9,900원이었으니까요)'];
 const lh=38,maxOff=H*0.58+20+L.length*lh+60;this.off=Math.min(maxOff,this.off+dt*(P.down?240:55));const by=H+20-this.off;
 L.forEach((l,i)=>{const y=by+i*lh;if(y>-30&&y<H+30)txt(l,W/2,y,i===0?Math.min(30,W*0.07):20,i===0?GOLD:'#ddd',i===0?FT:FB);});
 const ly=by+L.length*lh+80;drawLogo(W/2,ly,64);txt('Created by manamiwu',W/2,ly+78,24,'#fff',FT);
 if(this.off>=maxOff&&btn('처음으로',W/2,Math.min(H*0.88,ly+150),190,56))go(Title);
}};

/* ---------- 루프 ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;ctx.clearRect(0,0,W,H);
 if(scene){scene.t+=dt;scene.frame(dt);}updDrawFX(dt);drawSpeaker();P.tap=false;P.kb=false;requestAnimationFrame(loop);}
S2.bgm=100;S3.bgm=106;S4.bgm=0;S5.bgm=114;END.bgm=88;
go(Title);requestAnimationFrame(loop);
</script>
