<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유품정리사의 밤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --night:#050505;
  --paper:#d9cfb6;
  --paper-ink:#2b261f;
  --torch:#f3c98b;
  --moss:#4f5f45;
  --rust:#7c3b2a;
  --plate:#2a211a;
  --plate-ink:#d8c7a3;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#050505; } }
:root[data-theme="dark"]{ --night:#050505; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
body{height:100%;margin:0;background:var(--night);color:var(--plate-ink);font-family:"Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo",serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
*,*::before,*::after{box-sizing:border-box;}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
button{font-family:inherit;cursor:pointer;}
button:focus-visible{outline:2px solid var(--torch);outline-offset:2px;}

#hud{position:fixed;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5;}
#hud > *{pointer-events:auto;}
#noteBtn{background:var(--paper);color:var(--paper-ink);border:0;padding:8px 14px 9px;font-size:15px;transform:rotate(-1.5deg);box-shadow:0 6px 18px rgba(0,0,0,.55);}
#noteBtn small{display:block;font-size:11px;opacity:.7;}
#keys{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.keychip{background:var(--plate);color:var(--torch);border:1px solid #4a3a2b;padding:5px 10px;font-size:13px;border-radius:3px;}

#say{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,90vw);text-align:center;font-size:17px;line-height:1.7;color:#e9dcc0;text-shadow:0 2px 10px #000,0 0 2px #000;opacity:0;transition:opacity .6s;pointer-events:none;z-index:6;}
#say.on{opacity:1;}

#sms{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);width:min(360px,88vw);background:#1e2124;border-radius:16px;padding:10px 14px 12px;box-shadow:0 12px 30px rgba(0,0,0,.7);transition:transform .5s cubic-bezier(.2,.9,.3,1.2);z-index:8;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;pointer-events:none;}
#sms.on{transform:translate(-50%,0);}
#sms .from{font-size:12px;color:#9aa3ab;margin-bottom:3px;}
#sms .txt{font-size:15px;color:#eceff1;line-height:1.5;}

#nav{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px;z-index:5;}
#nav button{background:var(--plate);color:var(--plate-ink);border:1px solid #4a3a2b;padding:9px 0 10px;width:min(84px,22vw);font-size:15px;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 12px rgba(0,0,0,.6);}
#nav button.cur{color:var(--torch);border-color:var(--torch);}
#nav button.locked{opacity:.5;}

#hover{position:fixed;pointer-events:none;font-size:14px;color:var(--torch);text-shadow:0 1px 6px #000;transform:translate(14px,-8px);opacity:0;z-index:7;}
#fade{position:fixed;inset:0;background:#000;opacity:1;pointer-events:none;transition:opacity .4s;z-index:9;}

#modalWrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:10;padding:20px;}
#modalWrap.on{display:flex;}
#modal{background:var(--paper);color:var(--paper-ink);width:min(420px,100%);max-height:80%;overflow:auto;padding:24px 22px 18px;box-shadow:0 24px 70px rgba(0,0,0,.8);transform:rotate(-.4deg);}
#modal h2{margin:0 0 10px;font-size:21px;}
#modal p{margin:0 0 10px;font-size:16px;line-height:1.75;}
#modal .hand{font-family:"Nanum Pen Script",cursive;font-size:25px;line-height:1.45;white-space:pre-line;color:#2a3150;}
#modal .tag{display:inline-block;font-size:12px;padding:2px 7px;border:1px solid currentColor;margin-bottom:10px;opacity:.75;}
#modal .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
#modal .btns button{flex:1 1 auto;padding:11px 12px;font-size:15px;border:0;color:#efe8d6;background:#3a332a;}
#modal .btns .give{background:var(--moss);}
#modal .btns .trash{background:var(--rust);}
#modal .btns .plain{background:transparent;color:var(--paper-ink);border:1px solid rgba(43,38,31,.4);}
#modal ul{margin:0;padding-left:18px;line-height:1.9;}
#modal li.done{text-decoration:line-through;opacity:.55;}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.pad button{padding:14px 0;font-size:20px;background:#3d4441;color:#e7e2d4;border:0;}
.code{font-size:30px;letter-spacing:12px;text-align:center;background:#1d201f;color:#9fd0a8;padding:8px 0 6px;font-family:"Courier New",monospace;}
.shake{animation:sh .35s;}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

#title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 40%,#1a1612 0%,#050505 70%);}
#title h1{font-size:clamp(34px,9vw,58px);font-weight:700;margin:0 0 6px;letter-spacing:.06em;color:#e9dcc0;}
#title .sub{font-size:15px;color:#8f8370;margin-bottom:26px;}
#title .paper{background:var(--paper);color:var(--paper-ink);width:min(380px,100%);padding:22px 22px 18px;transform:rotate(-1deg);box-shadow:0 24px 70px rgba(0,0,0,.8);}
#title dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;line-height:1.6;}
#title dt{opacity:.6;}
#title dd{margin:0;}
#title .hand{font-family:"Nanum Pen Script",cursive;font-size:23px;color:#2a3150;}
#start{margin-top:26px;background:var(--torch);color:#241c12;border:0;padding:13px 30px;font-size:17px;font-weight:700;}
#title .help{margin-top:16px;font-size:13px;color:#7d7262;text-align:center;line-height:1.7;max-width:340px;}

#ending{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;}
#ending.on{display:flex;}
#ending p{font-size:18px;line-height:1.9;margin:0 0 6px;color:#e2d6bc;opacity:0;transition:opacity 1.6s;}
#ending p.on{opacity:1;}
#ending .smsline{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#1e2124;border-radius:14px;padding:9px 14px;font-size:15px;color:#eceff1;margin:6px 0;max-width:340px;text-align:left;}
#ending .hint{font-size:14px;color:#8f8370;margin-top:16px;}
#credits{display:none;flex-direction:column;align-items:center;gap:14px;}
#credits h3{font-size:28px;margin:0;color:#e9dcc0;}
#credits .by{font-size:15px;color:#a99c86;}
#credits svg{width:110px;height:auto;background:#000;}
#again{margin-top:18px;background:transparent;border:1px solid #6b5f4e;color:#d8c7a3;padding:10px 22px;font-size:15px;}
@media (prefers-reduced-motion: reduce){ #sms,#say,#fade,#ending p{transition:none;} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <button id="noteBtn">의뢰서<small>정리한 물건 0</small></button>
  <div id="keys"></div>
</div>
<div id="sms"><div class="from">수연</div><div class="txt"></div></div>
<div id="say"></div>
<nav id="nav"></nav>
<div id="hover"></div>
<div id="fade"></div>
<div id="modalWrap"><div id="modal"></div></div>

<div id="title">
  <h1>유품정리사의 밤</h1>
  <div class="sub">남겨진 물건에는 이유가 있다</div>
  <div class="paper">
    <dl>
      <dt>고인</dt><dd>김영배 (72)</dd>
      <dt>주소</dt><dd>은행나무아파트 3동 402호</dd>
      <dt>의뢰인</dt><dd>김수연 (딸)</dd>
      <dt>찾을 물건</dt><dd>통장 · 엄마 반지 · 남긴 편지</dd>
    </dl>
    <div class="hand" style="margin-top:12px">정리는 하룻밤 안에 부탁드립니다.</div>
  </div>
  <button id="start">의뢰 수락하기</button>
  <div class="help">화면을 끌어서 둘러보고 물건을 눌러 살펴보세요.<br>물건은 유족에게 전달하거나 폐기할 수 있어요.<br>소리를 켜고 하는 걸 추천해요.</div>
</div>

<div id="ending">
  <div id="endLines"></div>
  <div id="credits">
    <h3>유품정리사의 밤</h3>
    <svg viewBox="0 0 100 84" aria-label="manamiwu 로고"><circle cx="21" cy="19" r="15" fill="#fff"/><rect x="4" y="38" width="35" height="31" fill="#fff"/><polygon points="45,4 45,69 92,69" fill="#fff"/></svg>
    <div class="by">Created by manamiwu</div>
    <button id="again">처음부터 다시</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);

/* ---------------- 오디오 ---------------- */
let AC = null, master = null;
function initAudio(){
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
    const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=180;
    const g = AC.createGain(); g.gain.value=.045;
    [55,55.6,82.6].forEach(fr=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.connect(f);o.start();});
    const lfo = AC.createOscillator(); lfo.frequency.value=.07; const lg=AC.createGain(); lg.gain.value=70; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    f.connect(g); g.connect(master);
  }catch(e){ AC = null; }
}
function noise(dur, type, freq, vol, at){
  if(!AC) return;
  const t = AC.currentTime + (at||0);
  const len = Math.floor(AC.sampleRate*dur);
  const b = AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const s=AC.createBufferSource(); s.buffer=b;
  const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq;
  const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+.05);
}
function tone(freq, dur, type, vol, at, toFreq){
  if(!AC) return;
  const t = AC.currentTime + (at||0);
  const o=AC.createOscillator(); o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  if(toFreq) o.frequency.exponentialRampToValueAtTime(toFreq,t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
}
const sfx = {
  knock(n=3){ for(let i=0;i<n;i++){ noise(.09,'bandpass',190,.9,i*.34); tone(85,.18,'sine',.5,i*.34); } },
  thump(){ tone(70,.35,'sine',.6); noise(.12,'lowpass',300,.4); },
  sting(){ tone(48,1.6,'sine',.5); tone(1380,1.4,'triangle',.035,0,1720); noise(1.2,'bandpass',900,.06); },
  ding(){ tone(1046,.18,'sine',.18); tone(1568,.3,'sine',.14,.12); },
  rustle(){ noise(.35,'highpass',2200,.18); },
  click(){ noise(.04,'highpass',3000,.25); },
  bad(){ tone(140,.25,'square',.08); },
  unlock(){ noise(.05,'highpass',2500,.3); tone(900,.08,'square',.05,.08); noise(.06,'bandpass',1200,.3,.12); },
  creak(){ tone(220,1.1,'sawtooth',.05,0,140); },
  stat(d){ noise(d,'bandpass',1400,.13); }
};

/* ---------------- 렌더러 ---------------- */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.Fog(0x050505, 5, 15);
const camera = new THREE.PerspectiveCamera(62, 1, .05, 60);
camera.rotation.order = 'YXZ';
scene.add(camera);
const hemi = new THREE.HemisphereLight(0x8a9bb0, 0x2a2018, .2);
scene.add(hemi);
const torch = new THREE.SpotLight(0xffe8c8, 3.4, 20, .6, .55, .9);
torch.position.set(.15,-.12,0);
camera.add(torch);
const torchTarget = new THREE.Object3D(); scene.add(torchTarget); torch.target = torchTarget;

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h;
  camera.fov = w<h ? 74 : 62;
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

/* ---------------- 텍스처 ---------------- */
function ctex(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
}
function grain(g,w,h,a){ for(let i=0;i<w*h/30;i++){ g.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:255},0,${Math.random()*a})`; g.fillRect(Math.random()*w,Math.random()*h,2,2);} }
const PEN = '"Nanum Pen Script", cursive';
function floorTex(base,line){ const t=ctex(256,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);g.strokeStyle=line;g.lineWidth=2;for(let i=0;i<=w;i+=64){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke();}grain(g,w,h,.08);}); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4,4); return t; }
function wallTex(base,dot){ const t=ctex(128,128,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);g.fillStyle=dot;for(let y=8;y<h;y+=32)for(let x=8;x<w;x+=32){g.beginPath();g.ellipse(x+(y%64?16:0),y,5,3,0,0,7);g.fill();}grain(g,w,h,.06);}); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(6,2.5); return t; }
function tileTex(){ const t=ctex(128,128,(g,w,h)=>{g.fillStyle='#55534d';g.fillRect(0,0,w,h);g.strokeStyle='#36342f';g.lineWidth=3;for(let i=0;i<=w;i+=32){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke();}grain(g,w,h,.1);}); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(8,2); return t; }
let najeon,memoTex,drawTex,calTex,clockTex,marksTex;
function makeTextures(){
najeon = ctex(256,256,(g,w,h)=>{
  g.fillStyle='#22160f'; g.fillRect(0,0,w,h);
  const cols=['#cfe3e8','#e8d9ef','#f2ecd6','#d8efe2'];
  for(let i=0;i<70;i++){ const x=Math.random()*w,y=Math.random()*h; g.fillStyle=cols[i%4]; g.globalAlpha=.25+Math.random()*.5; g.beginPath(); g.ellipse(x,y,2+Math.random()*7,1.5+Math.random()*3,Math.random()*3,0,7); g.fill(); }
  g.globalAlpha=.75; g.strokeStyle='#e6eef0'; g.lineWidth=2;
  g.beginPath(); g.arc(w*.5,h*.42,40,0,7); g.stroke();
  for(let k=0;k<6;k++){ const a=k/6*Math.PI*2; g.fillStyle=cols[k%4]; g.beginPath(); g.ellipse(w*.5+Math.cos(a)*22,h*.42+Math.sin(a)*22,11,5,a,0,7); g.fill(); }
  g.globalAlpha=1;
});
memoTex = ctex(256,256,(g,w,h)=>{ g.fillStyle='#f0d86a'; g.fillRect(0,0,w,h); g.fillStyle='#24366a'; g.font=`46px ${PEN}`; g.fillText('금고 번호',30,70); g.fillText('= 우리 수연이',22,135); g.fillText('태어난 날',40,200); g.font=`30px ${PEN}`; g.fillText('(잊지 말 것)',70,240); });
drawTex = ctex(320,240,(g,w,h)=>{
  g.fillStyle='#f4f0e6'; g.fillRect(0,0,w,h); g.lineCap='round'; g.lineJoin='round';
  const cr=(c,lw)=>{g.strokeStyle=c;g.lineWidth=lw;};
  cr('#e0a01c',6); g.beginPath(); g.arc(270,45,22,0,7); g.stroke();
  cr('#b8462e',7); g.beginPath(); g.moveTo(40,110); g.lineTo(100,60); g.lineTo(160,110); g.closePath(); g.stroke();
  cr('#7a5232',6); g.strokeRect(52,110,96,80); cr('#3c78b8',5); g.strokeRect(70,130,26,24);
  cr('#2b2b2b',5);
  g.beginPath(); g.arc(205,105,14,0,7); g.moveTo(205,119); g.lineTo(205,165); g.moveTo(205,165); g.lineTo(190,200); g.moveTo(205,165); g.lineTo(220,200); g.moveTo(205,135); g.lineTo(235,150); g.stroke();
  g.beginPath(); g.arc(255,135,10,0,7); g.moveTo(255,145); g.lineTo(255,175); g.lineTo(245,200); g.moveTo(255,175); g.lineTo(265,200); g.moveTo(255,155); g.lineTo(235,150); g.stroke();
  cr('#4f9a4a',8); g.beginPath(); g.moveTo(10,215); g.lineTo(310,215); g.stroke();
  g.fillStyle='#d2477a'; g.font=`34px ${PEN}`; g.fillText('아빠랑 나',170,40);
});
calTex = ctex(256,340,(g,w,h)=>{
  g.fillStyle='#f2efe7'; g.fillRect(0,0,w,h); g.fillStyle='#a8352a'; g.fillRect(0,0,w,60);
  g.fillStyle='#fff'; g.font='bold 36px serif'; g.fillText('11월',90,44);
  g.fillStyle='#333'; g.font='18px serif';
  let d=1; for(let r=0;r<5;r++)for(let c=0;c<7;c++){ if(r===0&&c<5) continue; if(d>30) break; g.fillText(String(d),14+c*34,100+r*48); d++; }
  g.strokeStyle='#c22'; g.lineWidth=3; g.beginPath(); g.ellipse(14+6*34+8,94,18,16,0,0,7); g.stroke();
  g.fillStyle='#c22'; g.font=`26px ${PEN}`; g.fillText('병원',200,128);
});
clockTex = ctex(256,256,(g,w,h)=>{
  g.fillStyle='#ece6d6'; g.beginPath(); g.arc(128,128,124,0,7); g.fill();
  g.fillStyle='#222'; g.font='bold 26px serif'; g.textAlign='center'; g.textBaseline='middle';
  for(let i=1;i<=12;i++){ const a=i/12*Math.PI*2-Math.PI/2; g.fillText(String(i),128+Math.cos(a)*96,128+Math.sin(a)*96); }
  g.strokeStyle='#222'; g.lineCap='round';
  const hand=(deg,len,lw)=>{const a=deg*Math.PI/180-Math.PI/2; g.lineWidth=lw; g.beginPath(); g.moveTo(128,128); g.lineTo(128+Math.cos(a)*len,128+Math.sin(a)*len); g.stroke();};
  hand(96,58,8); hand(72,86,5);
});
marksTex = ctex(128,700,(g,w,h)=>{
  g.fillStyle='#b99a72'; g.fillRect(0,0,w,h); grain(g,w,h,.08);
  const ppm=700/1.9; g.strokeStyle='#4a4038'; g.fillStyle='#3a332d'; g.lineWidth=2; g.font=`24px ${PEN}`;
  [['5살',1.08],['6살',1.15],['7살',1.22],['8살',1.28],['9살',1.33],['10살',1.39]].forEach(([t,m])=>{ const y=h-m*ppm; g.beginPath(); g.moveTo(10,y); g.lineTo(60,y); g.stroke(); g.fillText('수연 '+t,62,y+7); });
  const y=h-1.66*ppm; g.setLineDash([6,5]); g.beginPath(); g.moveTo(10,y); g.lineTo(70,y); g.stroke(); g.setLineDash([]);
  g.font=`21px ${PEN}`; g.fillText('지금쯤',72,y-6); g.fillText('이만큼',72,y+16);
});
}

/* ---------------- 방 만들기 ---------------- */
const ZONES = [

  }
}
function getObj(id){ return interactables.find(o=>o.userData.id===id); }

/* ---------------- 연출 ---------------- */
let flickT=0;
function flicker(sec){ flickT=sec; }
setInterval(()=>{ if(!S.started||S.ended) return; if(Math.random()<.35) flicker(.5+Math.random()*.6); },14000);
setInterval(()=>{ if(!S.started||S.ended||S.busy) return; if(S.zone===2 && !S.smallOpen){ sfx.knock(3); if(!S.knockSaid){ S.knockSaid=true; say('오른쪽 방에서 노크 소리. 잠겨 있는 방이다.'); } } },17000);

/* ---------------- 물건 처리 ---------------- */
function openItem(id){
  const it=ITEMS[id];
  const tag = it.kind==='request' ? '<span class="tag">의뢰 물건</span>' : '';
  const body = it.letter ? `<p class="hand">${it.desc}</p>` : `<p>${it.desc}</p>`;
  modal(`${tag}<h2>${it.name}</h2>${body}`,[
    {label:'유족에게 전달', cls:'give', fn:()=>sortItem(id,'deliver')},
    {label:'폐기', cls:'trash', fn:()=>sortItem(id,'trash')},
    {label:'그대로 두기', cls:'plain'}
  ]);
}
function sortItem(id, where){
  const it=ITEMS[id];
  if(where==='trash' && it.kind==='request'){
    if(id==='letter'){ sfx.sting(); flicker(1.5); say('봉투를 쥔 손이 움직이지 않는다. 이건 버릴 수 없다.',4800); }
    else { sfx.bad(); say('의뢰받은 물건이다. 버릴 수 없다.'); }
    return;
  }
  it.status = where==='deliver' ? 'deliver' : 'trash';
  getObj(id).visible=false; S.sorted++; updateNote();
  sfx.rustle();
  if(where==='trash' && it.kind==='daughter' && it.returns===0) say('봉투에 넣었다. 묶는 동안 등 뒤가 서늘했다.');
  else say(where==='deliver' ? j(it.name,'을','를')+' 전달 상자에 넣었다.' : j(it.name,'을','를')+' 폐기 봉투에 넣었다.', 2600);
  if(['bankbook','ring','letter'].every(r=>ITEMS[r].status==='deliver')){
    setTimeout(()=>modal('<h2>의뢰받은 물건을 모두 담았다</h2><p>상자를 봉하고 나가면 정리가 끝난다. 아직 이 집에 남겨둔 게 있다면 지금 둘러봐도 된다.</p>',[
      {label:'상자 봉하기', cls:'give', fn:ending},
      {label:'조금 더 둘러보기', cls:'plain'}
    ]),900);
  }
}
function listOf(status){ const a=Object.keys(ITEMS).filter(id=>ITEMS[id].status===status).map(id=>ITEMS[id].name); return a.length? '<ul>'+a.map(n=>'<li>'+n+'</li>').join('')+'</ul>' : '<p>아직 비어 있다.</p>'; }

function keypad(){
  let code='';
  const draw=()=>{ $('#code').textContent=(code+'____').slice(0,4); };
  const html=`<h2>작은 금고</h2><p>네 자리 번호를 누르는 금고다.</p><div class="code" id="code">____</div><div class="pad" id="pad"></div>`;
  modal(html,[{label:'닫기',cls:'plain'}]);
  const pad=$('#pad');
  ['1','2','3','4','5','6','7','8','9','지움','0','확인'].forEach(k=>{
    const b=document.createElement('button'); b.textContent=k;
    b.onclick=()=>{
      sfx.click();
      if(k==='지움'){ code=code.slice(0,-1); }
      else if(k==='확인'){
        if(code==='0417'){ closeModal(); openSafe(); return; }
        sfx.bad(); const c=$('#code'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); code='';
      } else if(code.length<4){ code+=k; }
      draw();
    };
    pad.appendChild(b);
  });
}
function openSafe(){
  S.safeOpen=true; sfx.unlock(); WORLD.bankbook.visible=true; S.keys.add('작은방 열쇠'); renderKeys(); S.smallOpen=true; renderNav();
  modal('<h2>금고가 열렸다</h2><p>안에는 통장 하나와 작은 열쇠 하나. 열쇠에 붙은 이름표에는 "수연이 방".</p>',[{label:'열쇠 챙기기',cls:'give',fn:()=>{ say('작은방 열쇠를 챙겼다. 통장은 금고 위에 있다.'); }}]);
}
function openCloset(){
  S.closetOpen=true; sfx.creak(); WORLD.shelf.visible=true; WORLD.ring.visible=true;
  anims.push({o:WORLD.closetDoors[0],to:-1.35},{o:WORLD.closetDoors[1],to:1.35});
  say('장롱 문이 열리자 나프탈렌 냄새가 훅 끼쳤다. 선반에 작은 상자가 있다.',4600);
  setTimeout(()=>{ if(S.zone===2 && ITEMS.radio.status==='here' && !S.radioDone){ S.radioDone=true; sfx.stat(2.6); WORLD.radioBody.material.emissive=new THREE.Color(0x553311); say('라디오가 켜졌다. 플러그는 빠져 있는데.',4500); setTimeout(()=>{ WORLD.radioBody.material.emissive=new THREE.Color(0x000000); },2600); } },7000);
}
const anims=[];

function tap(id){
  if(ITEMS[id]){ if(ITEMS[id].status==='here') { sfx.click(); openItem(id); } return; }
  switch(id){
    case 'door': say('문 밖은 조용하다. 일이 끝나기 전엔 나갈 수 없다.'); break;
    case 'shoeCab':
      if(!S.shoeOpen){ S.shoeOpen=true; sfx.creak(); WORLD.shoeDoors.forEach(d=>d.visible=false); S.keys.add('장롱 열쇠'); renderKeys();
        modal('<h2>신발장</h2><p>신발 몇 켤레 뒤 안쪽 깊숙이 열쇠 꾸러미가 걸려 있다. 이름표에 "장롱".</p>',[{label:'챙기기',cls:'give'}]); }
      else say('신발 몇 켤레뿐이다. 전부 남자 신발이다.');
      break;
    case 'bag': sfx.rustle(); modal('<span class="tag">폐기 봉투</span><h2>버릴 물건</h2>'+listOf('trash')); break;
    case 'box': sfx.rustle(); modal('<span class="tag">유족 전달 상자</span><h2>보낼 물건</h2>'+listOf('deliver')); break;
    case 'fridge': say('냉장고는 비어 있다. 전원도 꺼져 있다.'); break;
    case 'memo': sfx.rustle(); modal('<span class="tag">냉장고 메모</span><p class="hand">금고 번호 = 우리 수연이 태어난 날\n(잊지 말 것)</p>'); break;
    case 'calendar': say('11월 달력. 2일에 동그라미와 "병원". 그 뒤로는 아무것도 적혀 있지 않다.',5000); break;
    case 'safe': if(!S.safeOpen) keypad(); else say('금고는 비어 있다.'); break;
    case 'closet': if(S.closetOpen) say('옷이 몇 벌 걸려 있다. 여자 옷도 한 벌 있다.'); else if(S.keys.has('장롱 열쇠')) openCloset(); else { sfx.bad(); say('자개장이 잠겨 있다. 열쇠 구멍이 작다.'); } break;
    case 'vanity': say('거울에 먼지가 앉아 있다. 그런데 손바닥 크기만큼만 닦여 있다.'); break;
    case 'frame': sfx.rustle(); S.frameSeen=true; modal('<span class="tag">엎어진 액자</span><p>뒤집어 보니 갓난아기 사진이다. 뒷면에 볼펜 글씨가 있다.</p><p class="hand">1994. 4. 17.\n우리 수연이 태어난 날</p>'); break;
    case 'clock': say('3시 12분에 멈춘 시계. 초침이 아주 가끔 한 칸씩 움직인다.'); break;
    case 'futon': say('개지 않은 이불. 한 사람 몫이다.'); break;
    case 'smallDoor': if(S.smallOpen) goZone(3); else { sfx.knock(2); say('잠겨 있다. 문고리가 차갑다.'); } break;
    case 'desk':
      if(!S.deskOpen){ S.deskOpen=true; sfx.click(); WORLD.letter.visible=true; say('서랍 안에 봉투 하나. 겉봉에 "수연이에게".',4500); }
      else say('연필과 지우개가 가지런히 놓여 있다.');
      break;
    case 'bed': say('작은 침대. 이불이 새것처럼 반듯하다. 누군가 계속 정리해 온 것 같다.'); break;
    case 'marks': modal('<span class="tag">키재기 선</span><p>문틀에 연필로 그은 선들. 수연 5살부터 10살까지. 거기서 멈췄다.</p><p>그 위로 한참 높은 곳에 점선이 하나 더 있다.</p><p class="hand">지금쯤 이만큼</p>'); break;
  }
}

/* ---------------- 입력 ---------------- */
const ray=new THREE.Raycaster(); const ndc=new THREE.Vector2(0,0);
let down=null, moved=0, last=null;
function setNdc(e){ ndc.x=e.clientX/innerWidth*2-1; ndc.y=-(e.clientY/innerHeight)*2+1; }
function idOf(o){ while(o){ if(o.userData&&o.userData.id) return o.userData.id; o=o.parent; } return null; }
function visibleChain(o){ while(o){ if(!o.visible) return false; o=o.parent; } return true; }
function pick(){
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects([groups[S.zone]],true);
  for(const h of hits){ if(!visibleChain(h.object)) continue; return h; }
  return null;
}
canvas.addEventListener('pointerdown',e=>{ if(S.busy) return; down={x:e.clientX,y:e.clientY}; last={x:e.clientX,y:e.clientY}; moved=0; setNdc(e); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{
  setNdc(e);
  if(down){ const dx=e.clientX-last.x, dy=e.clientY-last.y; last={x:e.clientX,y:e.clientY}; moved+=Math.abs(dx)+Math.abs(dy);
    yaw=Math.max(-1.0,Math.min(1.0,yaw+dx*.0045)); pitch=Math.max(-.55,Math.min(.45,pitch+dy*.0035)); }
  if(e.pointerType==='mouse' && !S.busy){ const h=pick(); const id=h&&idOf(h.object); const hv=$('#hover');
    if(id && !(ITEMS[id]&&ITEMS[id].status!=='here')){ hv.textContent=ITEMS[id]?ITEMS[id].name:(NAMES[id]||''); hv.style.left=e.clientX+'px'; hv.style.top=e.clientY+'px'; hv.style.opacity=1; canvas.style.cursor='pointer'; }
    else { hv.style.opacity=0; canvas.style.cursor='default'; } }
});
canvas.addEventListener('pointerup',e=>{ if(!down) return; const wasTap=moved<10; down=null; if(!wasTap||S.busy||S.ended) return; setNdc(e); const h=pick(); const id=h&&idOf(h.object); if(id) tap(id); });
addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#modalWrap').classList.contains('on')) closeModal(); });

/* ---------------- 엔딩 ---------------- */
function ending(){
  S.ended=true; closeModal(); S.busy=true;
  const kept = ['slipperPink','drawing','doll'].filter(id=>ITEMS[id].status==='deliver').length;
  const el=$('#ending'), L=$('#endLines'); L.innerHTML=''; el.classList.add('on');
  const lines = kept===3 ? [
    ['p','마지막 상자에 테이프를 붙였다.'],
    ['p','슬리퍼와 그림과 토끼 인형이 편지 위에 놓였다.'],
    ['p','집 안이 조용해졌다. 처음으로.'],
    ['p','작은방 문이 천천히 닫혔다. 잠기는 소리는 나지 않았다.'],
    ['s','수연: 그림이랑 슬리퍼… 아직 있었어요?'],
    ['s','수연: 내일 제가 직접 갈게요. 그 방은 그대로 둬주세요.'],
  ] : [
    ['p','의뢰받은 물건을 모두 상자에 담았다.'],
    ['p','현관을 나서는데 등 뒤에서 작은 소리가 들렸다.'],
    ['p','툭.'],
    ['p','아직 이 집에 전하지 못한 게 남아 있는 것 같다.'],
    ['s','수연: 감사합니다. 정리비는 내일 보내드릴게요.'],
    ['h',`이 집에 남은 이야기 ${kept} / 3`],
  ];
  let t=600;
  lines.forEach(([k,txt])=>{ const p=document.createElement('p'); p.textContent=txt; if(k==='s') p.className='smsline'; if(k==='h') p.className='hint'; L.appendChild(p);
    setTimeout(()=>{ p.classList.add('on'); if(k==='s') sfx.ding(); }, t); t+= k==='p'?2300:2000; });
  setTimeout(()=>{ L.style.transition='opacity 1.5s'; L.style.opacity=0; setTimeout(()=>{ L.style.display='none'; $('#credits').style.display='flex'; },1500); }, t+2500);
}
$('#again').onclick=()=>location.reload();

/* ---------------- 시작 ---------------- */
$('#start').onclick=async()=>{
  initAudio();
  $('#title').style.display='none';
  S.started=true; placeCam(); renderNav(); updateNote();
  $('#fade').style.opacity=0;
  setTimeout(()=>sms('아빠 집 정리 부탁드려요. 통장이랑 엄마 반지 그리고 혹시 남긴 편지가 있으면 그것도요. 저는 못 갈 것 같아요.'),1600);
  setTimeout(()=>say('주변을 둘러보자. 정리할 물건이 많다.'),900);
};

/* ---------------- 루프 ---------------- */
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  camera.rotation.y = -yaw; camera.rotation.x = -pitch;
  camera.position.y = 1.6 + Math.sin(t*1.3)*.008;
  ray.setFromCamera(ndc,camera);
  const h = S.started ? ray.intersectObjects([groups[S.zone]],true)[0] : null;
  if(h) torchTarget.position.copy(h.point); else torchTarget.position.copy(ray.ray.at(6,new THREE.Vector3()));
  if(flickT>0){ flickT-=dt; torch.intensity = Math.random()<.45 ? .3 : 3.4; hemi.intensity = .08; }
  else { torch.intensity = 3.4; hemi.intensity = .26; }
  for(let i=anims.length-1;i>=0;i--){ const a=anims[i]; a.o.rotation.y += (a.to-a.o.rotation.y)*Math.min(1,dt*2.2); if(Math.abs(a.to-a.o.rotation.y)<.01){ a.o.rotation.y=a.to; anims.splice(i,1);} }
  renderer.render(scene,camera);
}

(async()=>{
  try{ await Promise.race([Promise.all([document.fonts.load('40px "Nanum Pen Script"'),document.fonts.load('20px "Gowun Batang"')]), new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  makeTextures(); buildRooms(); placeCam(); loop();
})();
})();
</script>
