<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>안개섬의 나침반</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2330; --paper:#f1e6cc; --paper-edge:#c9b58a; --amber:#f2a541; --sea:#2f6f8f; --mist:#dfe9ee; --bg:#101822;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b1118; } }
:root[data-theme="dark"]{ --bg:#0b1118; }
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--paper)}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
#hearts{display:flex;flex-wrap:wrap;gap:3px;max-width:60vw}
#hearts svg{width:24px;height:22px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.45))}
#inv{display:flex;gap:12px;font-size:19px;text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.6)}
#inv span{display:flex;align-items:center;gap:4px}
#inv .hide{display:none}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 54px);transform:translateX(-50%);background:rgba(20,26,36,.82);padding:8px 16px;border-radius:20px;font-size:18px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6;white-space:nowrap}
#toast.on{opacity:1}
#dialog{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);width:min(640px,calc(100% - 24px));background:var(--paper);color:var(--ink);border:3px solid var(--paper-edge);border-radius:6px;box-shadow:0 6px 0 rgba(0,0,0,.25);padding:14px 18px 18px;font-family:"Gowun Batang",serif;font-size:18px;line-height:1.65;display:none;z-index:8;min-height:96px}
#dialog .who{font-family:"Do Hyeon",sans-serif;color:#8b5a2b;font-size:17px;margin-bottom:2px}
#dialog .more{position:absolute;right:14px;bottom:6px;font-size:14px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:9}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:10;padding:24px}
#title{background:radial-gradient(ellipse at 50% 60%,rgba(223,233,238,.25),rgba(16,24,34,.92) 70%)}
#title h1{font-family:"Gowun Batang",serif;font-weight:700;font-size:clamp(40px,9vw,76px);margin:0;letter-spacing:.04em;color:#f6f1e3;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 30px rgba(223,233,238,.45)}
#title .sub{font-family:"Gowun Batang",serif;font-size:clamp(15px,3.6vw,19px);opacity:.85;margin:14px 0 34px;max-width:28em;line-height:1.7}
.btn{font-family:"Do Hyeon",sans-serif;font-size:22px;background:var(--amber);color:#2a1a08;border:none;border-radius:999px;padding:12px 34px;margin:6px;cursor:pointer;box-shadow:0 4px 0 #a86a1d}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a86a1d}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 2px var(--paper)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
#title .help{margin-top:28px;font-size:16px;opacity:.7;line-height:1.6}
#over{background:rgba(40,8,8,.75);display:none}
#over h2{font-family:"Gowun Batang",serif;font-size:42px;margin:0 0 24px}
#credits{background:#000;display:none;opacity:0;transition:opacity 2s}
#credits h2{font-family:"Gowun Batang",serif;font-size:clamp(30px,7vw,52px);margin:0 0 10px;color:#f6f1e3}
#credits p{font-family:"Gowun Batang",serif;opacity:.8;margin:0 0 40px;font-size:18px}
#credits .by{font-size:20px;letter-spacing:.06em;margin-top:18px;color:#fff}
#credits svg{width:96px;height:96px}
/* touch */
#touch{position:fixed;inset:0;z-index:4;display:none;pointer-events:none}
#touch.on{display:block}
#stickzone{position:absolute;left:0;bottom:0;width:55%;height:60%;pointer-events:auto}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(241,230,204,.14);border:2px solid rgba(241,230,204,.35);left:40px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(241,230,204,.55)}
.tb{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#2a1a08;pointer-events:auto;box-shadow:0 4px 0 rgba(0,0,0,.3)}
#bA{width:78px;height:78px;right:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 60px);background:var(--amber)}
#bB{width:62px;height:62px;right:118px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);background:#e46a4f;color:#fff}
#bB.hide{display:none}
@media (prefers-reduced-motion: reduce){ #dialog .more{animation:none} }
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div id="hearts"></div>
  <div id="inv">
    <span id="iKey" title="열쇠">🗝️ <b id="nKey">0</b></span>
    <span id="iBomb" class="hide" title="불꽃 열매">🍎 <b id="nBomb">0</b></span>
    <span id="iShard" title="나침반 조각">🧭 <b id="nShard">0</b>/2</span>
  </div>
</div>
<div id="toast"></div>
<div id="dialog"><div class="who" id="who"></div><div id="dtext"></div><div class="more">▼</div></div>
<div id="fade"></div>

<div id="touch">
  <div id="stickzone"></div>
  <div id="joy"><div id="knob"></div></div>
  <div class="tb" id="bA">검</div>
  <div class="tb hide" id="bB">열매</div>
</div>

<div class="screen" id="title">
  <h1>안개섬의 나침반</h1>
  <div class="sub">부서진 나침반 때문에 섬은 짙은 안개에 갇혔다.<br>두 개의 조각을 찾아 제단에 되돌려 놓자.</div>
  <div>
    <button class="btn" id="bNew">새로 시작</button>
    <button class="btn ghost" id="bCont" style="display:none">이어하기</button>
  </div>
  <div class="help">방향키나 WASD로 걷고 Space로 칼을 휘두른다.<br>K로 불꽃 열매를 내려놓는다. 사람 앞에서 Space를 누르면 말을 건다.</div>
</div>

<div class="screen" id="over">
  <h2>쓰러졌다…</h2>
  <button class="btn" id="bRetry">다시 일어나기</button>
</div>

<div class="screen" id="credits">
  <h2>안개섬의 나침반</h2>
  <p>안개가 걷히고 배들이 돌아왔다.</p>
  <svg viewBox="0 0 100 100" aria-label="manamiwu">
    <rect width="100" height="100" fill="#000"/>
    <circle cx="24" cy="24" r="17" fill="#fff"/>
    <rect x="6" y="45" width="40" height="36" fill="#fff"/>
    <polygon points="50,7 50,81 90,81" fill="#fff"/>
  </svg>
  <div class="by">Created by manamiwu</div>
  <button class="btn ghost" id="bAgain" style="margin-top:40px">처음으로</button>
</div>

const THEMES = {
  over:{floor:'.', bg:0xcfdde4, fog:0xd6e2e8, fogD:0.028, ocean:0x2f6f8f, hemi:0.78, sun:0.85, lantern:0, grass:0x6fa356, sand:0xe0c68e, stone:0x8b8a78, wall:0x7d8270},

};

const SOLID = 'TRWB#XLAnY ';
const isSolidC = c => SOLID.indexOf(c) >= 0;

/* =================== STATE =================== */
const SAVE_KEY = 'mist-compass-v1';
let S;
function freshState(){
  return {map:'over',hp:6,maxHp:6,sword:false,bag:false,bombs:0,keys:0,shards:0,collected:{},bossDone:{},keyTaken:{},cleared:{},mods:[],ret:{},resp:null,intro:false,ended:false};
}
let WORLD = {};

function parseAll(){
  WORLD = {};
  for(const name in MAPS){
    const m = MAPS[name], th = THEMES[m.theme];
    const gw = m.cols*W, gh = m.rows*H;
    const grid = []; for(let y=0;y<gh;y++) grid.push(new Array(gw).fill(' '));
    const spawns = {}, items = [], npcs = [], keySpawns = {}; let start = null;
    for(const key in m.rooms){
      const [rx,ry] = key.split(',').map(Number); const rows = m.rooms[key];
      for(let y=0;y<H;y++) for(let x=0;x<W;x++){
        let c = rows[y][x]; const gx = rx*W+x, gy = ry*H+y;
        if('EFVG'.includes(c)){ (spawns[key]=spawns[key]||[]).push({type:c,gx,gz:gy}); c = th.floor; }
        else if(c==='P'){ start={x:gx+.5,z:gy+.5}; c = th.floor; }
        else if(c==='K'){ keySpawns[key]={gx,gz:gy}; c = th.floor; }
        else if('bwH'.includes(c)){ items.push({type:c,gx,gz:gy,id:name+':'+gx+','+gy}); c = th.floor; }
        else if('ON'.includes(c)){ npcs.push({kind:c,gx,gz:gy}); c='n'; }
        else if(c==='A'){ npcs.push({kind:'A',gx,gz:gy}); }
        grid[gy][gx] = c;
      }
    }
    WORLD[name] = {grid,gw,gh,spawns,items,npcs,keySpawns,start,theme:m.theme};
  }
  for(const md of S.mods){ const w = WORLD[md.map]; if(w && w.grid[md.gy]) w.grid[md.gy][md.gx] = md.c; }
}
function tile(gx,gz){ const w = WORLD[S.map]; if(gz<0||gz>=w.gh||gx<0||gx>=w.gw) return ' '; return w.grid[gz][gx]; }
function setTile(gx,gz,c){ WORLD[S.map].grid[gz][gx]=c; S.mods.push({map:S.map,gx,gy:gz,c}); }
const roomOfTile = (gx,gz) => Math.floor(gx/W)+','+Math.floor(gz/H);
const roomOfPos = (x,z) => roomOfTile(Math.floor(x),Math.floor(z));

/* =================== THREE SETUP =================== */
const renderer = new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(40,1,0.1,250);
const hemi = new T.HemisphereLight(0xe4f0ff,0x4a5a32,0.78); scene.add(hemi);
const sun = new T.DirectionalLight(0xfff1d6,0.85); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
const sc = sun.shadow.camera; sc.left=-13; sc.right=13; sc.top=13; sc.bottom=-13; sc.near=1; sc.far=70; sun.shadow.bias=-0.0008;
scene.add(sun); scene.add(sun.target);
const lantern = new T.PointLight(0xffb45e,0,9,1.4); scene.add(lantern);
const ocean = new T.Mesh(new T.PlaneGeometry(500,500), new T.MeshLambertMaterial({color:0x2f6f8f}));
ocean.rotation.x = -Math.PI/2; ocean.position.y = -0.14; scene.add(ocean);
scene.fog = new T.FogExp2(0xd6e2e8,0.028);

const L = c => new T.MeshLambertMaterial({color:c});
const dummy = new T.Object3D(), tmpCol = new T.Color(), ZERO = new T.Matrix4().makeScale(0,0,0);
const rnd = (x,y,s=0) => { const n = Math.sin(x*127.1+y*311.7+s*74.7)*43758.5453; return n-Math.floor(n); };

function canvasTex(draw,size=64){ const c=document.createElement('canvas'); c.width=c.height=size; draw(c.getContext('2d'),size); const t=new T.CanvasTexture(c); return t; }
const crackTex = canvasTex((g,s)=>{ g.fillStyle='#d8d8d8'; g.fillRect(0,0,s,s); g.strokeStyle='#2a2a2a'; g.lineWidth=3;
  g.beginPath(); g.moveTo(10,6); g.lineTo(24,22); g.lineTo(18,34); g.lineTo(34,46); g.lineTo(30,60);
  g.moveTo(24,22); g.lineTo(44,18); g.lineTo(56,28); g.moveTo(34,46); g.lineTo(50,44); g.stroke(); });
const lockTex = canvasTex((g,s)=>{ g.fillStyle='#8a5a32'; g.fillRect(0,0,s,s); g.fillStyle='#6b4325'; for(let i=0;i<4;i++) g.fillRect(i*16,0,2,s);
  g.fillStyle='#e8c25a'; g.fillRect(22,22,20,22); g.fillStyle='#2a1a0c'; g.beginPath(); g.arc(32,30,4,0,7); g.fill(); g.fillRect(30,30,4,10); });
const exitTex = canvasTex((g,s)=>{ for(let i=0;i<4;i++){ g.fillStyle = ['#efe4c4','#d9cba6','#bfb08a','#a4966f'][i]; g.fillRect(0,i*16,s,16);} });

/* geometries */

let mapGroup = null, instRefs = {}, npcObjs = [], altarObj = null;
function buildMap(){
  if(mapGroup){ scene.remove(mapGroup); mapGroup.traverse(o=>{ if(o.isMesh && o.userData.own){ o.geometry.dispose(); } }); }
  mapGroup = new T.Group(); scene.add(mapGroup); instRefs = {}; npcObjs = []; altarObj = null;
  const w = WORLD[S.map], th = THEMES[w.theme];
  const lists = {floor:[],trunk:[],canopy:[],canopy2:[],rock:[],water:[],wall:[],bush:[],crack:[],lock:[],hole:[],exit:[]};
  for(let gz=0; gz<w.gh; gz++) for(let gx=0; gx<w.gw; gx++){
    const c = w.grid[gz][gx]; if(c===' ') continue;
    const it = {x:gx+.5, z:gz+.5, gx, gz, c, key:gx+','+gz};
    if(c!=='W') lists.floor.push(it);
    if(c==='T'){ lists.trunk.push(it); lists.canopy.push(it); lists.canopy2.push(it); }
    else if(c==='R') lists.rock.push(it);
    else if(c==='W') lists.water.push(it);
    else if(c==='#') lists.wall.push(it);
    else if(c==='B') lists.bush.push(it);
    else if(c==='X') lists.crack.push(it);
    else if(c==='L') lists.lock.push(it);
    else if(c==='C'||c==='D') lists.hole.push(it);
    else if(c==='^') lists.exit.push(it);
  }
  const isOver = w.theme==='over';
  inst(G.floor, MAT.floor, lists.floor, (it,d,col)=>{
    const v = rnd(it.gx,it.gz)*0.08-0.04;
    let base;
    if(isOver){ base = (it.c==='S'||it.c==='Y') ? th.sand : (it.c==='#'||it.c==='D') ? th.stone : th.grass; }
    else base = th.stone;
    col.setHex(base).offsetHSL(0,0,v + (!isOver && (it.gx+it.gz)%2 ? -0.03 : 0));
  },{recv:true});
  inst(G.trunk, MAT.trunk, lists.trunk, (it,d,col)=>{ col.setHex(0x6b4a2f); });
  inst(G.canopy, MAT.canopy, lists.canopy, (it,d,col)=>{ const s=.9+rnd(it.gx,it.gz,1)*.25; d.scale.set(s,s,s); d.rotation.y=rnd(it.gx,it.gz,2)*6; col.setHex(0x3f7d3a).offsetHSL(rnd(it.gx,it.gz,3)*.05-.025,0,rnd(it.gx,it.gz,4)*.1-.05); },{cast:true});
  inst(G.canopy2, MAT.canopy, lists.canopy2, (it,d,col)=>{ const s=.85+rnd(it.gx,it.gz,1)*.3; d.scale.set(s,s,s); d.rotation.y=rnd(it.gx,it.gz,5)*6; col.setHex(0x4f9444).offsetHSL(0,0,rnd(it.gx,it.gz,6)*.08-.04); },{cast:true});
  inst(G.rock, MAT.rock, lists.rock, (it,d,col)=>{ d.position.y=.36; d.rotation.set(rnd(it.gx,it.gz,1)*3,rnd(it.gx,it.gz,2)*6,0); const s=.95+rnd(it.gx,it.gz,3)*.2; d.scale.set(s,s*.85,s); col.setHex(isOver?0x8d8577:th.wall).offsetHSL(0,0,rnd(it.gx,it.gz,4)*.08-.04); },{cast:true,recv:true});
  waterMesh = inst(G.water, MAT.water, lists.water, (it,d,col)=>{ col.setHex(0x3b86a8).offsetHSL(0,0,rnd(it.gx,it.gz)*.04); });
  inst(G.wall, MAT.wall, lists.wall, (it,d,col)=>{ col.setHex(isOver?0x8a8f7a:th.wall).offsetHSL(0,0,rnd(it.gx,it.gz)*.06-.03); },{cast:true,recv:true});
  inst(G.bush, MAT.bush, lists.bush, (it,d,col)=>{ d.rotation.y=rnd(it.gx,it.gz)*6; d.scale.set(1,.85,1); col.setHex(0x356e35).offsetHSL(0,0,rnd(it.gx,it.gz,1)*.08-.04); },{cast:true});
  inst(G.crack, MAT.crack, lists.crack, (it,d,col)=>{ col.setHex(isOver?0x9c9486:th.wall).offsetHSL(0,0,.06); },{cast:true,recv:true});
  inst(G.lock, MAT.lock, lists.lock, (it,d,col)=>{ col.setHex(0xffffff); },{cast:true});
  inst(G.hole, MAT.hole, lists.hole, ()=>{ tmpCol.setHex(0xffffff); });
  inst(G.hole, MAT.exit, lists.exit, ()=>{ tmpCol.setHex(0xffffff); });

  // props: NPCs, altar, boat
  for(const n of w.npcs){
    let g;
    if(n.kind==='A'){ g = makeAltar(); altarObj = g; }
    else g = makeNPC(n.kind);
    g.position.set(n.gx+.5,0,n.gz+.5); mapGroup.add(g);
    npcObjs.push({kind:n.kind, x:n.gx+.5, z:n.gz+.5, g});
  }
  for(let gz=0; gz<w.gh; gz++) for(let gx=0; gx<w.gw; gx++) if(w.grid[gz][gx]==='Y'){ const b = makeBoat(); b.position.set(gx+.5,0,gz+.5); mapGroup.add(b); }
  // theme
  scene.background = new T.Color(th.bg);
  scene.fog.color.setHex(th.fog); scene.fog.density = S.ended && isOver ? 0.004 : th.fogD;
  ocean.material.color.setHex(th.ocean);
  hemi.intensity = th.hemi; sun.intensity = th.sun; lantern.intensity = th.lantern;
  hemi.groundColor.setHex(isOver?0x4a5a32:0x1a1a22);
}
let waterMesh = null;
function inst(geo,mat,arr,setup,opts={}){
  if(!arr.length) return null;
  const m = new T.InstancedMesh(geo,mat,arr.length);
  arr.forEach((it,i)=>{
    dummy.position.set(it.x,0,it.z); dummy.rotation.set(0,0,0); dummy.scale.set(1,1,1); tmpCol.setHex(0xffffff);
    setup(it,dummy,tmpCol); dummy.updateMatrix(); m.setMatrixAt(i,dummy.matrix); m.setColorAt(i,tmpCol);
    (instRefs[it.key] = instRefs[it.key]||[]).push({m,i});
  });
  m.instanceMatrix.needsUpdate = true; if(m.instanceColor) m.instanceColor.needsUpdate = true;
  m.castShadow = !!opts.cast; m.receiveShadow = !!opts.recv; mapGroup.add(m); return m;
}
function hideTileInstances(gx,gz,keepFloor){
  const refs = instRefs[gx+','+gz]; if(!refs) return;

function makePickupMesh(type){

    const m = new T.Mesh(geo, new T.MeshLambertMaterial({color: type==='heart'?0xe24b4b:0xff7aa8, emissive: type==='heart'?0x3a0808:0x4a1830}));
    if(type==='container') m.scale.setScalar(1.6);
    g.add(m);
  } else if(type==='bomb'||type==='bag'){
    const n = type==='bag'?3:1;
    for(let i=0;i<n;i++){ const f = new T.Mesh(new T.SphereGeometry(.16,10,8), L(0xe0482e)); f.position.set(n>1?(i-1)*.22:0, n>1&&i===1?.12:0, 0); g.add(f);
      const lf = new T.Mesh(new T.ConeGeometry(.05,.12,5), L(0x3f8a2f)); lf.position.set(f.position.x,f.position.y+.18,0); g.add(lf); }
  } else if(type==='key'){
    const km = new T.MeshLambertMaterial({color:0xf0c040, emissive:0x3a2a00});
    const r = new T.Mesh(new T.TorusGeometry(.12,.04,6,14), km); r.position.y=.18; g.add(r);
    const s = new T.Mesh(new T.BoxGeometry(.05,.32,.05), km); g.add(s);
    const t = new T.Mesh(new T.BoxGeometry(.12,.05,.05), km); t.position.set(.06,-.12,0); g.add(t);
  } else if(type==='shard'){
    const m = new T.Mesh(new T.OctahedronGeometry(.26,0), new T.MeshLambertMaterial({color:0x7fe6ff, emissive:0x1f6a8a})); m.scale.y=1.4; g.add(m);
  } else if(type==='sword'){
    const b = new T.Mesh(new T.BoxGeometry(.08,.7,.03), new T.MeshLambertMaterial({color:0xdfe6ee, emissive:0x223344})); b.position.y=.1; g.add(b);

    const gr = new T.Mesh(new T.BoxGeometry(.07,.2,.07), L(0x5a3a1c)); gr.position.y=.58; g.add(gr);
  }
  return shadowAll(g);
}

function spawnRoom(room){
  const w = WORLD[S.map]; const isDun = S.map!=='over';
  const ck = S.map+':'+room;
  roomHadEnemies = false;
  const list = w.spawns[room] || [];
  const bossRoom = list.some(s=>s.type==='G');
  if(bossRoom && S.bossDone[S.map]){ spawnBossRewards(); }
  else if(!(isDun && S.cleared[ck])){
    for(const s of list){
      const x = s.gx+.5, z = s.gz+.5;
      if(Math.hypot(x-P.x,z-P.z) < 2.2 && s.type!=='G') continue;

      roomHadEnemies = true;
    }
  }
  const ks = w.keySpawns[room];
  if(ks && S.cleared[ck] && !S.keyTaken[ck]) spawnPickup('key',ks.gx+.5,ks.gz+.5,{id:'key:'+ck});
  if(isDun && !roomHadEnemies && list.length && !bossRoom) S.cleared[ck] = true;

function spawnBossRewards(){
  const [rx,ry] = curRoom.split(',').map(Number); const cx = rx*W+W/2, cz = ry*H+H/2;
  if(!S.collected[S.map+':shard']) spawnPickup('shard',cx,cz-1,{id:S.map+':shard'});
  if(!S.collected[S.map+':cont']) spawnPickup('container',cx-2,cz,{id:S.map+':cont'});
  const g = new T.Group();
  const ring = new T.Mesh(new T.TorusGeometry(.5,.07,8,24), new T.MeshBasicMaterial({color:0xbfe9ff})); ring.position.y=.7; g.add(ring);
  const col = new T.Mesh(new T.CylinderGeometry(.45,.45,2.4,16,1,true), new T.MeshBasicMaterial({color:0x9fdcff, transparent:true, opacity:.25, side:T.DoubleSide, depthWrite:false})); col.position.y=1.2; g.add(col);
  g.position.set(cx+2,0,cz); scene.add(g);
  portal = {x:cx+2,z:cz,g,ring};
}

function collides(x,z,r,solid){
  const x0=Math.floor(x-r), x1=Math.floor(x+r), z0=Math.floor(z-r), z1=Math.floor(z+r);
  for(let gz=z0; gz<=z1; gz++) for(let gx=x0; gx<=x1; gx++){
    if(!solid(gx,gz)) continue;
    const cx=Math.max(gx,Math.min(x,gx+1)), cz=Math.max(gz,Math.min(z,gz+1));
    const dx=x-cx, dz=z-cz; if(dx*dx+dz*dz < r*r-1e-6) return {gx,gz};
  }
  return null;
}
function moveEntity(e,dx,dz,r,solid){
  let hit = null;
  if(dx){ const h = collides(e.x+dx,e.z,r,solid); if(!h) e.x += dx; else { hit = h; const off = e.z-(h.gz+.5);
      if(Math.abs(off)>.28){ const s = Math.sign(off)*Math.abs(dx); if(!collides(e.x,e.z+s,r,solid)) e.z += s; } } }
  if(dz){ const h = collides(e.x,e.z+dz,r,solid); if(!h) e.z += dz; else { hit = hit||h; const off = e.x-(h.gx+.5);
      if(Math.abs(off)>.28){ const s = Math.sign(off)*Math.abs(dz); if(!collides(e.x+s,e.z,r,solid)) e.x += s; } } }
  return hit;
}

const eSolid = (gx,gz) => { const c = tile(gx,gz); return isSolidC(c) || c==='C' || c==='D' || c==='^' || roomOfTile(gx,gz)!==curRoom; };
const fSolid = (gx,gz) => tile(gx,gz)===' ' || tile(gx,gz)==='#' || roomOfTile(gx,gz)!==curRoom;

let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC = null; } } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,type='square',v=.06,f2=null,delay=0){ const a = ac(); if(!a) return; const t = a.currentTime+delay;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.03); }
function noise(d,v=.25){ const a = ac(); if(!a) return; const len = Math.floor(a.sampleRate*d); const buf = a.createBuffer(1,len,a.sampleRate); const ch = buf.getChannelData(0);
  for(let i=0;i<len;i++) ch[i] = (Math.random()*2-1)*Math.pow(1-i/len,2);
  const s = a.createBufferSource(); s.buffer = buf; const f = a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; const g = a.createGain(); g.gain.value=v;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(); }
const SFX = {
  swing:()=>tone(900,.09,'sawtooth',.025,280), hit:()=>tone(240,.08,'square',.05,110), hurt:()=>tone(320,.18,'square',.06,90),
  pick:()=>{ tone(880,.07,'triangle',.06); tone(1320,.12,'triangle',.06,null,.07); }, cut:()=>tone(1500,.05,'triangle',.03,700),
  key:()=>[660,880,1100,1320].forEach((f,i)=>tone(f,.1,'triangle',.05,null,i*.07)), door:()=>tone(150,.3,'square',.05,70),
  boom:()=>{ noise(.6,.35); tone(90,.4,'sine',.15,40); }, item:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.06,null,i*.12)),
  die:()=>tone(420,.3,'sawtooth',.04,60), secret:()=>[784,740,622,440,415,659,831,1047].forEach((f,i)=>tone(f,.12,'triangle',.05,null,i*.09)),
  shoot:()=>tone(500,.08,'square',.03,250), place:()=>tone(400,.06,'triangle',.05)
};

const view = {dist:20,visW:17,portrait:false};
let camFocus = {x:0,z:0};
function fit(){
  const a = innerWidth/innerHeight; camera.aspect = a; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
  const v = T.MathUtils.degToRad(camera.fov), h = 2*Math.atan(Math.tan(v/2)*a);
  view.portrait = a < 1.2;
  view.visW = view.portrait ? Math.max(8.5,Math.min(16.8, 8.5+(a-.45)*10)) : 16.8;
  const dW = (view.visW/2)/Math.tan(h/2), dH = (12.2/2)/Math.tan(v/2)*.85;
  view.dist = Math.max(dW,dH);
}
addEventListener('resize', fit);
function focusFor(room,px){
  const [rx,ry] = room.split(',').map(Number); let cx = rx*W+W/2; const cz = ry*H+H/2+.2;
  if(view.portrait){ const half = view.visW/2-.3; cx = Math.max(rx*W+half, Math.min(rx*W+W-half, px)); }
  return {x:cx,z:cz};
}
function placeCamera(){
  const ang = T.MathUtils.degToRad(58);
  const sx = (Math.random()-.5)*shake, sz = (Math.random()-.5)*shake;
  camera.position.set(camFocus.x+sx, view.dist*Math.sin(ang), camFocus.z+view.dist*Math.cos(ang)+sz);
  camera.lookAt(camFocus.x+sx,0,camFocus.z+sz);
  sun.position.set(camFocus.x-8,18,camFocus.z+6); sun.target.position.set(camFocus.x,0,camFocus.z);
}

function hurtPlayer(dmg,sx,sz){
  if(P.inv>0 || state!=='play') return;
  S.hp = Math.max(0,S.hp-dmg); P.inv = 1.1; const d = Math.hypot(P.x-sx,P.z-sz)||1;
  P.kb = .18; P.kbx = (P.x-sx)/d*7; P.kbz = (P.z-sz)/d*7; SFX.hurt(); shake = .35; hud();
  if(S.hp<=0){ state = 'over'; SFX.die(); hero.g.rotation.z = Math.PI/2; setTimeout(()=>{ hero.g.rotation.z = 0; $('over').style.display = 'flex'; },700); }
}
function damageEnemy(e,dmg,fx,fz){
  if(e.dead || e.hurt>.12) return;
  e.hp -= dmg; e.hurt = .32; const d = Math.hypot(e.x-fx,e.z-fz)||1;
  if(!e.boss){ e.kb = .15; e.kbx = (e.x-fx)/d*8; e.kbz = (e.z-fz)/d*8; }

}
function killEnemy(e){

  if(e.boss){ onBossDead(e); return; }

function updatePlayer(dt){
  P.inv = Math.max(0,P.inv-dt);
  let ix = 0, iz = 0;
  if(keys['arrowleft']||keys['a']) ix -= 1; if(keys['arrowright']||keys['d']) ix += 1;
  if(keys['arrowup']||keys['w']) iz -= 1; if(keys['arrowdown']||keys['s']) iz += 1;
  ix += joy.x; iz += joy.y;
  let len = Math.hypot(ix,iz); if(len>1){ ix/=len; iz/=len; len = 1; }
  if(len<.18){ ix = 0; iz = 0; len = 0; }
  if(P.kb>0){ P.kb -= dt; moveEntity(P,P.kbx*dt,P.kbz*dt,.3,pSolid); }
  else if(len){
    const sp = (P.swing>0 ? 1.6 : 4.2)*dt;
    moveEntity(P,ix*sp,iz*sp,.3,pSolid);
    if(P.swing<=0){ P.fx = ix/len; P.fz = iz/len; }
    P.walk += dt*12;
  } else P.walk = 0;
  // actions
  if(pressed.a){
    const n = nearestTalk();
    if(n){ talk(n); pressed.a = false; return; }
    if(S.sword) swing(); else if(P.bare<=0){ toast('맨손으로는 싸울 수 없다'); P.bare = 3; }
  }
  P.bare -= dt;
  if(pressed.b) placeBomb();
  // swing
  if(P.swing>0){
    P.swing -= dt; const k = 1-Math.max(0,P.swing)/.24;
    hero.piv.rotation.y = 1.25-2.5*k; hero.arc.material.opacity = .5*Math.sin(k*Math.PI);
    for(const e of enemies){ if(e.dead || P.hitSet.has(e)) continue;
      const dx = e.x-P.x, dz = e.z-P.z, d = Math.hypot(dx,dz);
      if(d < 1.2+e.r*.6 && (d<.6 || (dx*P.fx+dz*P.fz)/d > .15)){ P.hitSet.add(e); damageEnemy(e,1,P.x,P.z); } }
    if(P.swing<=0){ hero.piv.visible = false; hero.arc.material.opacity = 0; }
  }
  // locked doors
  if(len){ const tx = Math.floor(P.x+P.fx*.6), tz = Math.floor(P.z+P.fz*.6);
    if(tile(tx,tz)==='L'){ if(S.keys>0){ S.keys--; openDoor(tx,tz); hud(); save(); } else if(P.bare<=0){ toast('열쇠가 필요하다'); P.bare = 2.5; } } }
  // warps
  const c = tile(Math.floor(P.x),Math.floor(P.z));
  if(c==='C'||c==='D'||c==='^'){
    if(P.warpArmed){ P.warpArmed = false;
      if(S.map==='over'){ const rm = curRoom; const dn = rm==='0,0' ? 'dA' : 'dB';
        S.ret[dn] = {x:Math.floor(P.x)+.5, z:Math.floor(P.z)+1.5};
        const st = WORLD[dn]; warpTo(dn, W/2, H+8.3, ()=>toast(dn==='dA'?'숲의 옛 사원':'바위산 동굴')); }
      else { const r = S.ret[S.map]||WORLD.over.start; warpTo('over', r.x, r.z); }
      return; }
  } else P.warpArmed = true;
  // portal
  if(portal && Math.hypot(P.x-portal.x,P.z-portal.z)<.55){ const r = S.ret[S.map]||WORLD.over.start; portal = null; warpTo('over',r.x,r.z); return; }
  // pickups
  for(const p of pickups.slice()){ if(Math.hypot(p.x-P.x,p.z-P.z) < .6) collect(p); }
  // room change
  const rm = roomOfPos(P.x,P.z);
  if(rm!==curRoom) startTransition(rm);
}
function openDoor(gx,gz){
  const stack = [[gx,gz]]; SFX.door();
  while(stack.length){ const [x,z] = stack.pop(); if(tile(x,z)!=='L') continue; openTile(x,z); burst(x+.5,.6,z+.5,0x8a5a32,8,3,.1,.5);
    stack.push([x+1,z],[x-1,z],[x,z+1],[x,z-1]); }
}
function startTransition(rm){
  clearRoomEntities();
  const [ox,oy] = curRoom.split(',').map(Number), [nx,ny] = rm.split(',').map(Number);
  const dx = Math.sign(nx-ox), dz = Math.sign(ny-oy);
  trans = {t:0,dur:.55,from:{x:camFocus.x,z:camFocus.z},to:focusFor(rm,P.x+dx*1.2),dx,dz};
  curRoom = rm; state = 'trans';
}
function updateTransition(dt){
  trans.t += dt; const k = Math.min(1,trans.t/trans.dur), e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
  camFocus.x = trans.from.x+(trans.to.x-trans.from.x)*e; camFocus.z = trans.from.z+(trans.to.z-trans.from.z)*e;
  const sp = 1.2/trans.dur*dt; P.x += trans.dx*sp; P.z += trans.dz*sp; P.walk += dt*12;
  if(k>=1){ trans = null; state = 'play'; spawnRoom(curRoom); S.resp = {map:S.map,x:P.x,z:P.z}; save(); }
}
function aim(e){ const dx = P.x-e.x, dz = P.z-e.z, d = Math.hypot(dx,dz)||1; return {dx:dx/d, dz:dz/d, d}; }
function shoot(x,z,dx,dz,spd,color=0xb6e36a,y=.55,dmg=1){
  const m = new T.Mesh(G.proj, new T.MeshBasicMaterial({color})); m.position.set(x,y,z); scene.add(m);
  projs.push({x,z,y,vx:dx*spd,vz:dz*spd,m,life:4,dmg}); SFX.shoot();
}
function updateEnemies(dt){
  for(const e of enemies){
    if(e.dead) continue;
    e.t += dt;
    if(e.hurt>0){ e.hurt -= dt; const on = e.hurt>0 && Math.floor(e.hurt*24)%2===0; e.mats.forEach(m=>m.emissive.setHex(on?0xffffff:0)); }
    const a = aim(e);
    if(e.kb>0){ e.kb -= dt; moveEntity(e,e.kbx*dt,e.kbz*dt,e.r,e.fly?fSolid:eSolid); }
    else if(e.type==='E'){
      if(e.t>e.next){ e.next = e.t+.7+Math.random()*1.1;
        if(Math.random()<.4){ e.dx = Math.round(a.dx); e.dz = e.dx?0:Math.sign(a.dz); }
        else { const dirs = [[1,0],[-1,0],[0,1],[0,-1],[0,0]]; const d = dirs[Math.floor(Math.random()*5)]; e.dx = d[0]; e.dz = d[1]; } }
      if(moveEntity(e,e.dx*1.7*dt,e.dz*1.7*dt,e.r,eSolid)) e.next = e.t;
      e.g.children[0].scale.set(1+Math.sin(e.t*11)*.08,.75-Math.sin(e.t*11)*.08,1);
      if(e.dx||e.dz) e.ang = Math.atan2(e.dx,e.dz);
    }
    else if(e.type==='F'){
      e.ang = Math.atan2(a.dx,a.dz);
      if(e.t>e.next && a.d<10){ e.next = e.t+2.2+Math.random()*.6; shoot(e.x+a.dx*.3,e.z+a.dz*.3,a.dx,a.dz,4.6); }
    }
    else if(e.type==='V'){
      const s = Math.sin(e.t*3)*.8; const px = -a.dz*s, pz = a.dx*s;
      moveEntity(e,(a.dx+px)*2.1*dt,(a.dz+pz)*2.1*dt,e.r,fSolid);
      e.y = .55+Math.sin(e.t*7)*.12; e.ang = Math.atan2(a.dx,a.dz);
      e.g.userData.wings.forEach((w,i)=>w.rotation.z = (i?-1:1)*Math.sin(e.t*22)*.7);
    }
    else if(e.type==='GA'){
      e.stT -= dt;
      if(e.st==='idle'){ moveEntity(e,a.dx*1.1*dt,a.dz*1.1*dt,e.r,eSolid); e.ang = Math.atan2(a.dx,a.dz); if(e.stT<=0){ e.st='wind'; e.stT=.65; } }
      else if(e.st==='wind'){ e.g.position.x = e.x+(Math.random()-.5)*.12; e.ang = Math.atan2(a.dx,a.dz); if(e.stT<=0){ e.st='charge'; e.dx=a.dx; e.dz=a.dz; e.stT=2.5; } }
      else if(e.st==='charge'){ if(moveEntity(e,e.dx*8.5*dt,e.dz*8.5*dt,e.r,eSolid) || e.stT<=0){ e.st='stun'; e.stT=1.3; shake=.4; SFX.door(); burst(e.x+e.dx*.8,.4,e.z+e.dz*.8,0xcfc3a3,10,3,.12,.5); } }
      else if(e.st==='stun'){ e.g.rotation.z = Math.sin(e.t*30)*.06; if(e.stT<=0){ e.st='idle'; e.stT=2+Math.random()*1.5; e.g.rotation.z=0; } }
    }
    else if(e.type==='GB'){
      const [rx,ry] = curRoom.split(',').map(Number); const cx = rx*W+W/2, cz = ry*H+H/2;
      e.ph = (e.ph||0)+dt*.55; const tx = cx+Math.cos(e.ph)*3.6, tz = cz+Math.sin(e.ph*1.3)*2.2;
      e.x += (tx-e.x)*Math.min(1,dt*2); e.z += (tz-e.z)*Math.min(1,dt*2);
      e.y = 1.0+Math.sin(e.t*2)*.15; e.ang = Math.atan2(a.dx,a.dz);
      e.g.userData.ring.rotation.z += dt*1.5;
      if(e.t>e.next){ e.next = e.t+(e.hp<7?1.4:1.9); const base = Math.atan2(a.dz,a.dx);
        [-.32,0,.32].forEach(o=>shoot(e.x,e.z,Math.cos(base+o),Math.sin(base+o),4.4,0xc77dff,.9,1)); }
      e.sumT = (e.sumT||4)-dt;
      if(e.sumT<=0){ e.sumT = 7; if(enemies.filter(o=>!o.dead && o.type==='V').length<3){ for(let i=0;i<2;i++){ const b = spawnEnemy('V',e.x+(i?1:-1),e.z); b.y=.6; } } }
    }
    if(e.type!=='GA' || e.st!=='wind') e.g.position.x = e.x;
    e.g.position.z = e.z; e.g.position.y = e.y||0; e.g.rotation.y = e.ang;
    if(!e.dead && Math.hypot(P.x-e.x,P.z-e.z) < e.r+.28) hurtPlayer(e.dmg,e.x,e.z);
  }
  enemies = enemies.filter(e=>!e.dead);
}
function updateProjs(dt){
  for(const p of projs){
    p.x += p.vx*dt; p.z += p.vz*dt; p.life -= dt; p.m.position.set(p.x,p.y,p.z);
    const c = tile(Math.floor(p.x),Math.floor(p.z));
    if(c==='#'||c==='T'||c==='R'||c==='X'||c==='L'||c===' '||roomOfPos(p.x,p.z)!==curRoom){ p.life = 0; burst(p.x,p.y,p.z,0xb6e36a,4,2,.06,.25); }
    else if(Math.hypot(p.x-P.x,p.z-P.z) < .38){ p.life = 0; hurtPlayer(p.dmg,p.x-p.vx*.1,p.z-p.vz*.1); }
    if(p.life<=0) scene.remove(p.m);
  }
  projs = projs.filter(p=>p.life>0);
}
function updateMisc(dt,time){
  for(const b of bombs){ b.t -= dt; const s = 1.6+(b.t<.6 ? Math.sin(b.t*40)*.15 : 0); b.g.scale.setScalar(s);
    b.g.children[0].material.emissive.setHex(b.t<.6 && Math.floor(b.t*12)%2 ? 0xffffff : 0); if(b.t<=0) explode(b); }
  bombs = bombs.filter(b=>b.t>0);
  for(const p of pickups.slice()){ p.t += dt; p.g.position.y = .4+Math.sin(p.t*3)*.08; p.g.rotation.y += dt*1.8;
    if(p.life){ p.life -= dt; p.g.visible = p.life>2 || Math.floor(p.life*8)%2===0; if(p.life<=0){ scene.remove(p.g); pickups.splice(pickups.indexOf(p),1); } } }
  for(const q of parts){ q.life -= dt; const k = q.life/q.max;
    if(q.grow){ q.m.scale.setScalar(.3+(1-k)*q.grow); }
    else { q.vy -= q.grav ? 12*dt : 0; q.m.position.x += q.vx*dt; q.m.position.y = Math.max(.05,q.m.position.y+q.vy*dt); q.m.position.z += q.vz*dt; }
    q.m.material.opacity = Math.max(0,k); if(q.life<=0){ scene.remove(q.m); q.m.material.dispose(); } }
  parts = parts.filter(q=>q.life>0);
  if(portal){ portal.ring.rotation.y += dt*2; portal.g.children[1].material.opacity = .2+Math.sin(time*4)*.08; }
  for(const n of npcObjs){ if(n.kind==='A'){ if(S.ended || state==='ending') n.g.userData.needle.rotation.y += dt*(endT>0&&endT<3?6:0.6); continue; }
    const d = Math.hypot(P.x-n.x,P.z-n.z); if(d<4){ const t = Math.atan2(P.x-n.x,P.z-n.z); n.g.rotation.y += (t-n.g.rotation.y)*Math.min(1,dt*5); } }
  if(waterMesh) MAT.water.emissive.setRGB(.03+Math.sin(time*1.6)*.03,.06+Math.sin(time*1.6)*.03,.09);
  // hero visuals
  hero.g.position.set(P.x,0,P.z);
  hero.g.rotation.y = Math.atan2(P.fx,P.fz);
  hero.g.visible = !(P.inv>0 && Math.floor(P.inv*16)%2===0) || state==='over';
  const sw = Math.sin(P.walk);
  hero.feet[0].position.z = sw*.1; hero.feet[1].position.z = -sw*.1;
  hero.g.position.y = Math.abs(sw)*.04; hero.tail.rotation.x = Math.sin(time*6)*.2;
  lantern.position.set(P.x,1.6,P.z);
  shake *= Math.pow(.02,dt); if(shake<.01) shake = 0;
  if(toastT>0){ toastT -= dt; if(toastT<=0) $('toast').classList.remove('on'); }
  if(dlg.open && dlg.shown<dlg.text.length){ dlg.shown = Math.min(dlg.text.length,dlg.shown+dt*42); $('dtext').textContent = dlg.text.slice(0,Math.floor(dlg.shown)); }
  else if(dlg.open) $('dtext').textContent = dlg.text;
}
function updateEnding(dt){
  if(endT<=0) return;
  endT += dt;
  const k = Math.min(1,endT/4);
  scene.fog.density = THEMES.over.fogD*(1-k)+.004*k;
  const bg = new T.Color(0xcfdde4).lerp(new T.Color(0x9fd3f0),k); scene.background = bg; scene.fog.color.copy(bg);
  hemi.intensity = .78+k*.25; sun.intensity = .85+k*.3;
  if(endT>2 && endT-dt<=2) [523,659,784,1047,1319].forEach((f,i)=>tone(f,.5,'triangle',.05,null,i*.18));
  if(endT>5.5 && $('credits').style.display!=='flex'){ $('credits').style.display='flex'; requestAnimationFrame(()=>$('credits').style.opacity=1); state='credits'; }
}

/* =================== LOOP =================== */
fit();
let last = performance.now();
S = freshState(); parseAll(); buildMap(); { const st = WORLD.over.start; P.x = st.x; P.z = st.z; curRoom = roomOfPos(P.x,P.z); camFocus = focusFor(curRoom,P.x); }
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.05,(now-last)/1000); last = now; const time = now/1000;
  if(state==='dialog'){ if(pressed.a) advance(); }
  else if(state==='play'){ updatePlayer(dt); if(state==='play'||state==='trans'){ updateEnemies(dt); updateProjs(dt); } }
  else if(state==='trans') updateTransition(dt);
  else if(state==='ending') updateEnding(dt);
  else if(state==='title'){ camFocus.x = focusFor(curRoom,P.x).x+Math.sin(time*.15)*1.5; }
  if(state==='play' || state==='dialog' || state==='ending' || state==='credits' || state==='over') updateMisc(dt,time);
  else updateMisc(dt*(state==='trans'?1:1),time);
  if(state==='play' && !trans){ const f = focusFor(curRoom,P.x); camFocus.x += (f.x-camFocus.x)*Math.min(1,dt*6); camFocus.z += (f.z-camFocus.z)*Math.min(1,dt*6); }
  pressed.a = false; pressed.b = false;
  placeCamera();
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);
})();
</script>
