@media (hover:hover) and (pointer:fine){.key{display:inline}#kbhint{display:block}}

#start{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4vh,34px);
 padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));box-sizing:border-box;
 background:linear-gradient(180deg,rgba(8,20,48,.25) 0%,rgba(8,10,24,.55) 55%,rgba(5,5,12,.92) 100%);color:#fff;text-align:center}
#start.hide{display:none}

@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.choices{display:flex;flex-direction:column;gap:12px;width:min(320px,100%)}
.choice{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 18px;border-radius:18px;border:0;cursor:pointer;
 font:700 clamp(18px,4.8vw,22px) 'Fredoka',system-ui,sans-serif;transition:transform .12s}
.choice:active{transform:scale(.97)}
.choice:focus-visible{outline:3px solid #fff;outline-offset:3px}

.choice small{font-weight:600;font-size:.72em;opacity:.75}

/* ---------- 2D 오리지널 ---------- */
#orig{position:fixed;inset:0;z-index:15;display:none;background:#111}
#orig.show{display:block}
#orig iframe{width:100%;height:100%;border:0;display:block}
.homebtn{position:fixed;z-index:30;top:calc(8px + env(safe-area-inset-top,0px));right:10px;width:44px;height:44px;border-radius:50%;border:0;
 background:rgba(0,0,0,.55);color:#fff;font-size:20px;cursor:pointer;display:none}
.homebtn.show{display:block}
#mute{right:62px}
@media (prefers-reduced-motion: reduce){.title .cat{animation:none}}
@media (prefers-reduced-motion: reduce){#banner.go,.runner,.seg,.logo svg>*,.logo .word{animation-duration:.01s}}

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>😺 CMO 2026.7 BOSS HP3</title>
<style>
body{margin:0;background:#111;touch-action:manipulation}
.wrap{max-width:720px;margin:0 auto}
canvas{display:block;width:100%;height:auto;background:#6ec6ff;image-rendering:pixelated;opacity:1}
.pad{display:flex;gap:10px;padding:12px;background:rgba(255,255,255,.7);position:sticky;bottom:0}
.btn{flex:1;padding:14px 0;border-radius:14px;border:1px solid #777;background:#fff;font-size:18px}
.small{flex:.8}
</style>
</head>
<body>
<div class="wrap">
<canvas id="game" width="640" height="360"></canvas>
<div class="pad">
<button class="btn small" id="left">⬅️</button>
<button class="btn small" id="right">➡️</button>
<button class="btn" id="jump">⤴️ 점프</button>
<button class="btn small" id="restart">🔁</button>
</div>
</div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
const W=c.width,H=c.height;
const GROUND=300;
const MAX_HP=3,MAX_LIVES=3,IFRAME=900;
const TIGER_TIME=5000,ROCKET_TIME=9000;
const FONT="50px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";

const STAGES=[
 {id:"ground",name:"🌳 초원맵",w:1800,bg:"#6ec6ff",floor:"#4caf50",soil:"#7a4b24",enemy:"🐕",coin:"🪙",next:"🌿",grav:.6,jump:-13,speed:1.1},
 {id:"sky",name:"☁️ 하늘맵",w:1700,bg:"#1e88ff",floor:"#4caf50",soil:"#2e7d32",enemy:"🦆",coin:"✨",next:"🕳️",grav:.55,jump:-13,speed:1.35},
 {id:"cave",name:"🪨 동굴맵",w:1800,bg:"#1b1b1b",floor:"#4e342e",soil:"#3e2723",enemy:"🐍",coin:"💎",next:"🌋",grav:.6,jump:-13,speed:1.6},
 {id:"volcano",name:"🔥 화산맵",w:1900,bg:"#3b0a0a",floor:"#ff5722",soil:"#bf360c",enemy:"🕷️",coin:"❤️",next:"🚀",grav:.6,jump:-13,speed:1.9},
 {id:"moon",name:"🌙 달맵",w:1900,bg:"#05051f",floor:"#7e7e8a",soil:"#4a4a60",enemy:"👾",coin:"⭐",next:"🏰",grav:.3,jump:-18,speed:1.5},
 {id:"castle",name:"🏰 성맵",w:2200,bg:"#101018",floor:"#666",soil:"#333",enemy:"🦇",coin:"💠",next:"🚪",grav:.6,jump:-13,speed:1.55}
];

let si,stage,platforms,enemies,coins,items,boss;
let cat,hp,lives,score,camX,gameOver,clear,iFrameUntil,tigerUntil,rocketUntil,endingMode,endingStart;
let killCount,totalEnemyCount,genocideEnding;
const input={left:false,right:false,jump:false};

function bind(id,key){
 const el=document.getElementById(id);
 const on=e=>{e.preventDefault();input[key]=true};
 const off=e=>{e.preventDefault();input[key]=false};
 el.addEventListener("touchstart",on,{passive:false});
 el.addEventListener("touchend",off,{passive:false});
 el.addEventListener("touchcancel",off,{passive:false});
 el.addEventListener("mousedown",()=>input[key]=true);
 addEventListener("mouseup",()=>input[key]=false);
}
bind("left","left");
bind("right","right");
document.getElementById("jump").addEventListener("touchstart",e=>{e.preventDefault();input.jump=true},{passive:false});
document.getElementById("jump").addEventListener("mousedown",()=>input.jump=true);
document.getElementById("restart").onclick=reset;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function hardResetDrawState(){
 ctx.globalAlpha=1;
 ctx.filter="none";
 ctx.globalCompositeOperation="source-over";
 ctx.shadowColor="transparent";
 ctx.shadowBlur=0;
 ctx.shadowOffsetX=0;
 ctx.shadowOffsetY=0;
}


function makePlatforms(){
 let a=[];
 for(let x=180,i=0;x<stage.w-240;x+=280,i++){
  let y=[245,215,260,205,240,220][i%6];
  let ww=[150,130,170,120,180,160][i%6];
  let color=
    stage.id==="castle"?"#555":
    stage.id==="moon"?"#aaa":
    stage.id==="volcano"?"#222":
    stage.id==="sky"?"#61c9ff":
    stage.id==="cave"?"#5d4037":
    "#8d5a2b";
  a.push({x,y,w:ww,h:16,color});
 }
 return a;
}

function makeEnemies(){
 let a=[];
 for(let x=520,i=0;x<stage.w-350;x+=420,i++){
  a.push({x,y:GROUND-50,w:50,h:50,vx:(i%2?-1:1)*stage.speed,alive:true,homeX:x});
 }
 return a;
}

function makeCoins(){
 let a=[];
 for(let x=250,i=0;x<stage.w-250;x+=230,i++){
  a.push({x,y:[215,185,230,175][i%4],got:false});
 }
 return a;
}

function makeItems(){
 let a=[];
 if(stage.id==="ground") a.push({x:1100,y:170,w:40,h:40,type:"tiger",got:false});
 if(stage.id==="moon") a.push({x:950,y:180,w:40,h:40,type:"rocket",got:false});
 return a;
}

function loadStage(n){
 si=n;
 stage=STAGES[si];
 platforms=makePlatforms();
 enemies=makeEnemies();
 totalEnemyCount += enemies.length;
 coins=makeCoins();
 items=makeItems();
 boss=null;
 if(stage.id==="castle"){
  boss={x:stage.w-430,y:GROUND-58,w:58,h:58,hp:3,alive:true,vx:1.9,homeX:stage.w-430};
 }
 cat.x=60;
 cat.y=stage.id==="moon"?160:GROUND-50;
 cat.vx=0;cat.vy=0;cat.onGround=false;
 camX=0;
 tigerUntil=0;
 rocketUntil=0;
}

function reset(){
 cat={x:60,y:GROUND-50,w:50,h:50,vx:0,vy:0,onGround:false};
 hp=MAX_HP;
 lives=MAX_LIVES;
 score=0;
 killCount=0;
 totalEnemyCount=0;
 genocideEnding=false;
 gameOver=false;
 clear=false;
 endingMode=false;
 endingStart=0;
 iFrameUntil=0;
 tigerUntil=0;
 rocketUntil=0;
 camX=0;
 loadStage(0);
}

function damage(now){
 if(now<iFrameUntil)return;
 hp--;
 iFrameUntil=now+IFRAME;
 cat.vy=-6;
 if(hp<=0){
  lives--;
  if(lives<=0){
   gameOver=true;
  }else{
   hp=MAX_HP;
   cat.x=60;
   cat.y=stage.id==="moon"?160:GROUND-50;
   cat.vx=0;cat.vy=0;camX=0;
  }
 }
}

function resolve(){
 cat.onGround=false;
 if(cat.y+cat.h>=GROUND){
  cat.y=GROUND-cat.h;
  cat.vy=0;
  cat.onGround=true;
 }
 for(const p of platforms){
  const prev=(cat.y+cat.h)-cat.vy;
  const now=cat.y+cat.h;
  if(cat.vy>=0&&cat.x+cat.w>p.x&&cat.x<p.x+p.w&&prev<=p.y&&now>=p.y&&cat.y<p.y){
   cat.y=p.y-cat.h;
   cat.vy=0;
   cat.onGround=true;
  }
 }
}

function update(){
 if(gameOver||endingMode)return;

 const now=performance.now();
 const tiger=now<tigerUntil;
 const rocket=now<rocketUntil;
 const speed=tiger?5.5:3;
 const grav=rocket?0:stage.grav;
 const jump=rocket?-8:stage.jump;

 cat.vx=0;
 if(input.left)cat.vx=-speed;
 if(input.right)cat.vx=speed;

 if(input.jump){
  if(cat.onGround||rocket){
   cat.vy=jump;
   cat.onGround=false;
  }
  input.jump=false;
 }

 cat.vy+=grav;
 if(rocket&&cat.vy>1.5)cat.vy=1.5;
 cat.x+=cat.vx;
 cat.y+=cat.vy;
 cat.x=clamp(cat.x,0,stage.w-cat.w);

 resolve();
 camX=clamp(cat.x-W*.35,0,stage.w-W);

 for(const e of enemies){
  if(!e.alive)continue;
  e.x+=e.vx;
  if(e.x<e.homeX-70||e.x>e.homeX+70)e.vx*=-1;
 }

 if(boss&&boss.alive){
  boss.x+=boss.vx;
  if(boss.x<boss.homeX-90||boss.x>boss.homeX+90)boss.vx*=-1;
 }

 for(const k of coins){
  if(k.got)continue;
  const dx=cat.x+25-k.x;
  const dy=cat.y+25-k.y;
  if(dx*dx+dy*dy<24*24){
   k.got=true;
   score+=10;
  }
 }

 for(const it of items){
  if(it.got)continue;
  if(aabb(cat,it)){
   it.got=true;
   if(it.type==="tiger"){
    tigerUntil=now+TIGER_TIME;
    score+=500;
   }else{
    rocketUntil=now+ROCKET_TIME;
    score+=500;
   }
  }
 }

 for(const e of enemies){
  if(!e.alive||!aabb(cat,e))continue;
  const stomp=cat.vy>0&&cat.y+cat.h-cat.vy<=e.y+8;
  if(tiger||stomp){
   e.alive=false;
   killCount++;
   score+=100;
   cat.vy=-9;
  }else{
   damage(now);
  }
 }

 if(boss&&boss.alive&&aabb(cat,boss)){
  const stomp=cat.vy>0&&cat.y+cat.h-cat.vy<=boss.y+10;
  if(tiger||stomp){
   boss.hp--;
   cat.vy=-10;
   score+=150;
   if(boss.hp<=0){
    boss.alive=false;
    score+=1000;
   }
  }else{
   damage(now);
  }
 }

 if(stage.id==="castle"&&boss&&boss.alive&&cat.x>stage.w-160){
  cat.x=stage.w-160;
 }

 if(cat.x>stage.w-90){
  if(si<STAGES.length-1){
   loadStage(si+1);
  }else if(!boss||!boss.alive){
   clear=true;
   genocideEnding = killCount>=totalEnemyCount;
   endingMode=true;
   endingStart=performance.now();
  }
 }
}

function drawBackground(){
 hardResetDrawState();
 ctx.fillStyle=stage.bg;
 ctx.fillRect(0,0,W,H);

 if(stage.id==="ground"){
  ctx.font="34px sans-serif";
  ctx.fillText("☁️",120-camX*.15,75);
  ctx.fillText("☁️",440-camX*.15,95);
 }
 if(stage.id==="sky"){
  ctx.font="36px sans-serif";
  ctx.fillText("☁️",80-camX*.1,70);
  ctx.fillText("☁️",360-camX*.1,120);
  ctx.fillText("☁️",610-camX*.1,80);
 }
 if(stage.id==="cave"){
  ctx.fillStyle="#2c2c2c";
  ctx.fillRect(0,0,W,70);
  ctx.font="28px sans-serif";
  ctx.fillText("🪨",120-camX*.12,65);
  ctx.fillText("🪨",390-camX*.12,80);
 }
 if(stage.id==="volcano"){
  ctx.font="42px sans-serif";
  ctx.fillText("🌋",100-camX*.08,115);
  ctx.fillText("🌋",450-camX*.08,95);
 }
 if(stage.id==="moon"){
  ctx.font="46px sans-serif";
  ctx.fillText("🌕",470-camX*.06,80);
  ctx.font="24px sans-serif";
  ctx.fillText("⭐",120,60);
  ctx.fillText("🪐",270,110);
 }
 if(stage.id==="castle"){
  ctx.font="52px sans-serif";
  ctx.fillText("🏰",410-camX*.05,130);
  ctx.font="30px sans-serif";

function makePlatforms(){
 let a=[];
 for(let x=180,i=0;x<stage.w-240;x+=280,i++){
  a.push({x,y:[245,215,260,205,240,220][i%6],w:[150,130,170,120,180,160][i%6],h:16,color:stage.plat});
 }
 return a;
}
function makeEnemies(){
 let a=[];
 for(let x=520,i=0;x<stage.w-350;x+=420,i++){
  // 낮은 발판 바로 밑에 갇혀서 밟을 수 없는 몹은 발판 사이 빈틈으로 옮긴다
  const hx=reachable(x)?x:nearestGap(x);
  a.push({x:hx,y:GROUND-50,w:50,h:50,vx:(i%2?-1:1)*stage.speed,alive:true,homeX:hx,dieAt:0});
 }
 return a;
}
// 몹이 순찰하는 동안 발판에 가려지지 않고 드러나는 폭이 충분한지 검사
function exposed(x){
 let open=50;
 for(const p of platforms){const o=Math.min(x+50,p.x+p.w)-Math.max(x,p.x);if(o>0)open-=o}
 return open;
}
function reachable(home){
 let best=0;for(let x=home-70;x<=home+70;x+=5)best=Math.max(best,exposed(x));
 return best>=35;
}
function nearestGap(home){
 let best=home,bd=1e9;
 const ps=[...platforms].sort((a,b)=>a.x-b.x);
 for(let i=0;i<ps.length-1;i++){
  const g0=ps[i].x+ps[i].w,g1=ps[i+1].x;if(g1-g0<80)continue;
  const c=(g0+g1)/2-25;
  if(reachable(c)&&Math.abs(c-home)<bd){bd=Math.abs(c-home);best=c}
 }
 return best;
}
function makeCoins(){
 let a=[];
 for(let x=250,i=0;x<stage.w-250;x+=230,i++)a.push({x,y:[215,185,230,175][i%4],got:false});
 return a;
}
function makeItems(){
 let a=[];
 if(stage.id==="ground")a.push({x:1100,y:170,w:40,h:40,type:"tiger",got:false});
 if(stage.id==="moon")a.push({x:950,y:180,w:40,h:40,type:"rocket",got:false});
 return a;
}

function clearLevel(){

 scene.remove(level);
 level.traverse(o=>{

  if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose());
 });
 level=null;
}
function buildLevel(){
 clearLevel();clearParts();
 seed=7+si*131;

 scene.fog=new THREE.Fog(st.bg,st.fog[0],st.fog[1]);
 hemi.color.set(st.hemi[0]);hemi.groundColor.set(st.hemi[1]);hemi.intensity=st.hemi[2];

 const grass=box(L+40,.4,8,mat(st.floor));grass.position.set(L/2,-.2,-1);grass.castShadow=false;level.add(grass);
 const soil=box(L+40,4,8,mat(st.soil));soil.position.set(L/2,-2.4,-1);soil.castShadow=false;level.add(soil);

 for(const p of platforms){

 }
 for(const e of enemies){e.mesh=emojiSprite(st.enemy,1.15);e.blob=blob(.42);level.add(e.mesh,e.blob)}
 for(const k of coins){k.mesh=emojiSprite(st.coin,.55);k.mesh.position.set(k.x*S,(GROUND-k.y)*S,0);level.add(k.mesh)}
 for(const it of items){
  it.mesh=emojiSprite(it.type==="tiger"?"🐯":"🚀",.95);level.add(it.mesh);
  it.ring=new THREE.Mesh(new THREE.TorusGeometry(.6,.04,8,30),new THREE.MeshBasicMaterial({color:0xfff176}));level.add(it.ring);
 }
 bossM=null;
 if(boss){bossM=makeCat(0x7e57c2,0x311b92,{boss:true});bossM.g.scale.setScalar(1.16);level.add(bossM.g)}
 portal=new THREE.Group();

 portal.add(ps,pr);portal.userData.ring=pr;portal.position.set((st.w-50)*S,0,0);level.add(portal);

function loadStage(n){

 platforms=makePlatforms();enemies=makeEnemies();totalEnemyCount+=enemies.length;
 coins=makeCoins();items=makeItems();boss=null;
 if(stage.id==="castle")boss={x:stage.w-430,y:GROUND-58,w:58,h:58,hp:3,alive:true,vx:1.9,homeX:stage.w-430};
 cat.x=60;cat.y=stage.id==="moon"?160:GROUND-50;cat.vx=0;cat.vy=0;cat.onGround=false;cat.face=1;
 tigerUntil=0;rocketUntil=0;

}

function reset(){
 cat={x:60,y:GROUND-50,w:50,h:50,vx:0,vy:0,onGround:false,face:1};
 hp=MAX_HP;lives=MAX_LIVES;score=0;killCount=0;totalEnemyCount=0;genocideEnding=false;
 gameOver=false;clear=false;endingMode=false;endingStart=0;iFrameUntil=0;tigerUntil=0;rocketUntil=0;
 ov.className="";ov.innerHTML="";ov.dataset.mode="";endIdx=-1;
 loadStage(0);
}

function damage(now){
 if(now<iFrameUntil)return;
 hp--;iFrameUntil=now+IFRAME;cat.vy=-6;
 if(hp>0)SFX.play("hurt");
 burst((cat.x+25)*S,(GROUND-cat.y-25)*S,0xff5252,8,.7);
 if(hp<=0){
  lives--;
  if(lives<=0){gameOver=true;MUSIC.stop();SFX.play("gameOver")}
  else{SFX.play("lifeLost");hp=MAX_HP;cat.x=60;cat.y=stage.id==="moon"?160:GROUND-50;cat.vx=0;cat.vy=0;camSnap=true}
 }
}

function resolve(){
 cat.onGround=false;
 if(cat.y+cat.h>=GROUND){cat.y=GROUND-cat.h;cat.vy=0;cat.onGround=true}
 for(const p of platforms){
  const prev=(cat.y+cat.h)-cat.vy,nowY=cat.y+cat.h;
  if(cat.vy>=0&&cat.x+cat.w>p.x&&cat.x<p.x+p.w&&prev<=p.y&&nowY>=p.y&&cat.y<p.y){cat.y=p.y-cat.h;cat.vy=0;cat.onGround=true}
 }
}

// ================== 게임 로직 (원본과 동일, 60fps 고정) ==================
function update(){
 if(mode!=="3d"||gameOver||endingMode)return;
 const now=performance.now();
 const tiger=now<tigerUntil,rocket=now<rocketUntil;
 const speed=tiger?5.5:3,grav=rocket?0:stage.grav,jump=rocket?-8:stage.jump;

 cat.vx=0;
 if(input.left)cat.vx=-speed;
 if(input.right)cat.vx=speed;
 if(cat.vx>0)cat.face=1;else if(cat.vx<0)cat.face=-1;
 if(input.jump){if(cat.onGround||rocket){cat.vy=jump;cat.onGround=false;SFX.play(rocket?"boost":"jump")}input.jump=false}

 cat.vy+=grav;
 if(rocket&&cat.vy>1.5)cat.vy=1.5;
 cat.x+=cat.vx;cat.y+=cat.vy;
 cat.x=clamp(cat.x,0,stage.w-cat.w);
 resolve();

 for(const e of enemies){if(!e.alive)continue;e.x+=e.vx;if(e.x<e.homeX-70||e.x>e.homeX+70)e.vx*=-1}
 if(boss&&boss.alive){boss.x+=boss.vx;if(boss.x<boss.homeX-90||boss.x>boss.homeX+90)boss.vx*=-1}
 if(stage.id==="castle"){const want=boss&&boss.alive&&cat.x>boss.homeX-520?"boss":"castle";if(MUSIC.current!==want)MUSIC.play(want)}

 for(const k of coins){
  if(k.got)continue;
  const dx=cat.x+25-k.x,dy=cat.y+25-k.y;
  if(dx*dx+dy*dy<24*24){k.got=true;score+=10;SFX.play("coin");burst(k.x*S,(GROUND-k.y)*S,0xffd54f,6,.5)}
 }
 for(const it of items){
  if(it.got||!aabb(cat,it))continue;
  it.got=true;score+=500;
  if(it.type==="tiger")tigerUntil=now+TIGER_TIME;else rocketUntil=now+ROCKET_TIME;
  burst((it.x+20)*S,(GROUND-it.y-20)*S,0xfff176,16,1);SFX.play(it.type);
 }
 for(const e of enemies){
  if(!e.alive||!aabb(cat,e))continue;
  const stomp=cat.vy>0&&cat.y+cat.h-cat.vy<=e.y+8;
  if(tiger||stomp){
   e.alive=false;e.dieAt=now;killCount++;score+=100;cat.vy=-9;SFX.play("stomp");
   burst((e.x+25)*S,.4,0xffffff,12,.9);
  }else damage(now);
 }
 if(boss&&boss.alive&&aabb(cat,boss)){
  const stomp=cat.vy>0&&cat.y+cat.h-cat.vy<=boss.y+10;
  if(tiger||stomp){
   boss.hp--;cat.vy=-10;score+=150;SFX.play(boss.hp>0?"bossHit":"bossDown");
   burst((boss.x+29)*S,1,0xb388ff,14,1);
   if(boss.hp<=0){boss.alive=false;score+=1000;burst((boss.x+29)*S,.8,0xffc107,40,1.6)}
  }else damage(now);
 }
 if(stage.id==="castle"&&boss&&boss.alive&&cat.x>stage.w-160)cat.x=stage.w-160;

 if(cat.x>stage.w-90){
  if(si<STAGES.length-1){loadStage(si+1);SFX.play("stage")}
  else if(!boss||!boss.alive){
   clear=true;genocideEnding=killCount>=totalEnemyCount;endingMode=true;endingStart=performance.now();MUSIC.stop();SFX.play(genocideEnding?"sadClear":"clear");
   setTimeout(()=>{if(mode==="3d"&&endingMode)MUSIC.play(genocideEnding?"endingSad":"ending")},genocideEnding?2200:1600);
  }
 }
}

const SFX=(()=>{
 let ac=null,master=null,muted=false,noiseBuf=null;
 try{muted=localStorage.getItem("cmo-muted")==="1"}catch(e){}
 function init(){
  if(!ac){
   const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
   ac=new AC();master=ac.createGain();master.gain.value=.4;master.connect(ac.destination);
   noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
   const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(ac.state==="suspended")ac.resume();
 }
 function tone(f0,f1,dur,type="square",vol=.2,delay=0){
  if(!ac||muted)return;
  const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);
 }
 function noise(dur,vol=.25,freq=1000,delay=0,sweep=0){
  if(!ac||muted)return;
  const t=ac.currentTime+delay,src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  src.buffer=noiseBuf;f.type="bandpass";f.frequency.setValueAtTime(freq,t);f.Q.value=1.2;
  if(sweep)f.frequency.exponentialRampToValueAtTime(sweep,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f);f.connect(g);g.connect(master);src.start(t);src.stop(t+dur+.03);
 }
 const seq=(notes,step,type,vol,len)=>notes.forEach((f,i)=>f&&tone(f,null,len||step*1.1,type,vol,i*step));
 const P={
  select:()=>{tone(660,null,.06,"square",.12);tone(990,null,.1,"square",.12,.06)},
  jump:()=>tone(280,620,.16,"square",.13),
  boost:()=>{noise(.25,.22,500,0,2500);tone(200,500,.2,"sawtooth",.06)},

  tiger:()=>{seq([523,659,784,1047,1319],.07,"square",.14);noise(.4,.12,3000,.1)},
  rocket:()=>{seq([392,523,659,784],.07,"triangle",.18);noise(.6,.2,400,.1,3000)},
  hurt:()=>{tone(260,90,.3,"sawtooth",.2);noise(.12,.15,300)},
  lifeLost:()=>seq([523,440,370,294],.13,"sawtooth",.15),
  bossHit:()=>{tone(170,55,.35,"sawtooth",.25);noise(.25,.3,350)},
  bossDown:()=>{noise(.9,.35,250,0,80);tone(120,40,.8,"sawtooth",.2);seq([0,0,0,523,659,784,1047],.1,"triangle",.2,.3)},
  stage:()=>seq([659,784,988,1319],.09,"triangle",.18,.2),
  gameOver:()=>seq([392,330,262,196],.3,"triangle",.22,.45),
  clear:()=>seq([392,494,587,784,988],.18,"triangle",.14,.9),
  sadClear:()=>seq([440,415,392,370,349],.35,"triangle",.14,.6),
  blip:()=>tone(880,null,.08,"triangle",.08),
  logo:()=>{tone(523,null,.14,"triangle",.18,.2);tone(659,null,.14,"triangle",.18,.55);tone(784,null,.3,"triangle",.18,.9);tone(1047,null,.5,"sine",.12,1.5)}
 };
 return{
  init,
  play(n){init();if(P[n])P[n]()},
  toggle(){muted=!muted;try{localStorage.setItem("cmo-muted",muted?"1":"0")}catch(e){}return muted},
  get muted(){return muted},
  get ctx(){return ac},
  get out(){return master},
  get noiseBuffer(){return noiseBuf}
 };
})();

const MUSIC=(()=>{
 const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
 function midi(n){const m=/^([A-G])([#b]?)(-?\d)$/.exec(n);if(!m)throw new Error("bad note "+n);return (+m[3]+1)*12+NOTE[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0)}
 const toks=s=>s.replace(/\|/g," ").trim().split(/\s+/).filter(Boolean);
 function parseTrack(str){
  const tk=toks(str),at={};let last=null;
  tk.forEach((t,i)=>{
   if(t==="-"){if(last)last.len++}
   else if(t==="."){last=null}
   else{last={midi:midi(t),len:1};(at[i]=at[i]||[]).push(last)}
  });
  return{at,len:tk.length};
 }
 for(const k in SONGS){
  const s=SONGS[k];
  s.parsed=s.tracks.map(t=>Object.assign(parseTrack(t.notes),t));
  s.drumTk=s.drums?toks(s.drums):[];
 }
 let cur=null,step=0,nextTime=0,timer=null,bus=null;
 const hz=m=>440*Math.pow(2,(m-69)/12);
 function voice(ac,t,m,dur,wave,vol){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=wave;o.frequency.setValueAtTime(hz(m),t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);
  g.gain.setValueAtTime(vol,t+Math.max(.012,dur*.7));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.03);
 }
 function drum(ac,t,d,vol){
  if(d==="k"){
   const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
   g.gain.setValueAtTime(.35*vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(g);g.connect(bus);o.start(t);o.stop(t+.16);
  }else if(d==="s"||d==="h"){
   const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
   src.buffer=SFX.noiseBuffer;f.type=d==="s"?"bandpass":"highpass";f.frequency.value=d==="s"?1800:7000;
   const len=d==="s"?.1:.035;g.gain.setValueAtTime((d==="s"?.18:.07)*vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+len);
   src.connect(f);f.connect(g);g.connect(bus);src.start(t);src.stop(t+len+.02);
  }
 }
 function tick(){
  const ac=SFX.ctx;if(!ac||!cur)return;
  const s=SONGS[cur],sd=60/s.bpm/s.spb;
  if(nextTime<ac.currentTime-.2)nextTime=ac.currentTime+.05; // 탭 전환 등으로 밀리면 건너뛰기
  while(nextTime<ac.currentTime+.15){
   if(!SFX.muted){
    for(const tr of s.parsed){
     const evs=tr.at[step%tr.len];if(!evs)continue;
     for(const e of evs){
      const dur=e.len*sd*.92;
      voice(ac,nextTime,e.midi,dur,tr.wave,tr.vol);
      if(tr.double)voice(ac,nextTime,e.midi+tr.double,dur,"triangle",tr.vol*1.4);
     }
    }
    if(s.drumTk.length){const d=s.drumTk[step%s.drumTk.length];if(d!==".")drum(ac,nextTime,d,s.drumVol||1)}
   }
   step++;nextTime+=sd;
  }
 }
 function play(name){
  if(name===cur)return;
  cur=name;step=0;
  if(!name)return;
  SFX.init();const ac=SFX.ctx;if(!ac)return;
  if(!bus){bus=ac.createGain();bus.gain.value=.55;bus.connect(SFX.out)}
  nextTime=ac.currentTime+.08;
  if(!timer)timer=setInterval(tick,25);
 }
 function stop(){cur=null}
 return{play,stop,get current(){return cur}};
})();

let last=performance.now(),acc=0;const STEP=1000/60;
function loop(now){
 const dt=Math.min(100,now-last);last=now;acc+=dt;
 while(acc>=STEP){update();acc-=STEP}
 if(endingMode)drawEnding(now);
 else sync(now,dt/1000);
 renderer.render(scene,camera);
 requestAnimationFrame(loop);
}
// ================== 시작 화면 / 모드 전환 ==================
let mode="menu";
const startEl=$("start"),origEl=$("orig"),homeEl=$("home");
function goMenu(){
 // 엔딩을 본 뒤에는 페이지를 새로 불러와서 완전히 깨끗한 새 게임으로 시작
 if(clear){location.reload();return}
 mode="menu";MUSIC.play("menu");
 origEl.classList.remove("show");origEl.innerHTML=""; // 2D 게임 정지
 homeEl.classList.remove("show");muteEl.classList.add("show");
 startEl.classList.remove("hide");
 kb.back=kb.fwd=false;input.left=input.right=input.jump=false;
 reset();
 $("play3d").focus();
}
const muteEl=$("mute");
function drawMute(){muteEl.textContent=SFX.muted?"🔇":"🔊"}
muteEl.onclick=e=>{e.currentTarget.blur();SFX.toggle();drawMute();SFX.play("select");if(mode==="menu")MUSIC.play("menu")};
drawMute();
muteEl.classList.add("show");
// 브라우저는 사용자가 한 번 누르기 전엔 소리를 막으니, 시작 화면에서 첫 터치/키 입력 때 음악 시작
function menuMusic(e){
 if(mode!=="menu")return;
 if(e&&e.target&&e.target.closest&&e.target.closest(".choice,#mute"))return;
 MUSIC.play("menu");
}
addEventListener("pointerdown",menuMusic);
addEventListener("keydown",menuMusic);
addEventListener("keydown",e=>{if(mode==="menu"&&e.code==="KeyM"&&!e.repeat){SFX.toggle();drawMute()}});
function play3D(){
 SFX.play("select");
 mode="3d";startEl.classList.add("hide");homeEl.classList.add("show");muteEl.classList.add("show");
 reset();window.focus();
}
function play2D(){
 SFX.play("select");MUSIC.stop();muteEl.classList.remove("show");
 mode="2d";startEl.classList.add("hide");homeEl.classList.add("show");
 const f=document.createElement("iframe");f.title="CMO 2D 오리지널";
 f.srcdoc=$("orig2d").textContent.replace(/<\\\/script>/g,"<"+"/script>");
 origEl.appendChild(f);origEl.classList.add("show");
 setTimeout(()=>{try{f.focus()}catch(e){}},50);
}
$("play3d").onclick=play3D;
$("play2d").onclick=play2D;
homeEl.onclick=goMenu;

reset();
requestAnimationFrame(loop);
</script>
