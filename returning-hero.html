<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>돌아오는 용사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e1328;--night:#1a2142;--lamp:#f3b04f;--lamp-soft:rgba(243,176,79,.38);
  --text:#f3eee4;--muted:#aab1c9;--paper:#e6d9bd;--paper-ink:#3a2e26;--hurt:#b8323a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#0e1328;--text:#f3eee4}}
:root[data-theme="dark"]{--ink:#0e1328;--text:#f3eee4}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--text);
  font-family:'Gowun Dodum',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.serif{font-family:'Gowun Batang','Nanum Myeongjo','AppleMyungjo',serif}
canvas#gl{position:fixed;top:0;left:0;width:100%;height:100%;display:block}

#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#objective{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));
  max-width:min(68vw,380px);font-size:15px;line-height:1.5;padding:8px 14px 8px 30px;
  background:rgba(12,17,36,.6);border-radius:10px;opacity:0;transition:opacity .5s}
#objective::before{content:'';position:absolute;left:12px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;
  background:var(--lamp);box-shadow:0 0 10px 2px rgba(243,176,79,.7)}
#mapBtn{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));
  pointer-events:auto;display:none;background:rgba(12,17,36,.6);color:var(--text);border:1px solid var(--lamp-soft);
  border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
#prompt{position:absolute;left:50%;bottom:calc(30% );transform:translateX(-50%);font-size:16px;padding:8px 16px;
  background:rgba(12,17,36,.7);border-radius:999px;display:none;white-space:nowrap}
#prompt kbd{display:inline-block;min-width:22px;padding:1px 6px;margin-right:8px;border:1px solid var(--lamp);border-radius:5px;
  color:var(--lamp);font-family:inherit;font-size:13px;text-align:center}
#crosshair{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,255,255,.55)}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:15px;color:var(--muted);text-align:center;
  opacity:0;transition:opacity .5s;max-width:86vw}
#bars{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:none;text-align:center}
#hearts{font-size:18px;letter-spacing:4px;color:var(--lamp)}
#beaconWrap{margin-top:6px;font-size:13px;color:var(--muted)}
#beaconBar{width:min(60vw,260px);height:6px;border-radius:3px;background:rgba(255,255,255,.15);margin:4px auto 0;overflow:hidden}
#beaconFill{height:100%;width:0;background:var(--lamp)}
#taskBar{position:absolute;left:50%;bottom:calc(36% );transform:translateX(-50%);width:min(70vw,300px);display:none;text-align:center;font-size:14px}
#taskBar .track{height:8px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:8px;overflow:hidden}
#taskFill{height:100%;width:0;background:var(--lamp)}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:11;opacity:0;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(150,20,30,.55) 100%)}

#dialog{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;z-index:20;
  padding:0 12px calc(22px + env(safe-area-inset-bottom,0px))}
#dialog .box{width:min(94vw,720px);background:rgba(12,17,36,.88);border:1px solid var(--lamp-soft);border-radius:14px;padding:15px 20px 17px}
#dSpeaker{color:var(--lamp);font-size:14px;margin-bottom:6px}
#dText{font-size:18px;line-height:1.75;min-height:1.8em;white-space:pre-line}
#dChoices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
#dChoices button{font:inherit;font-size:16px;text-align:left;color:var(--text);background:rgba(243,176,79,.08);
  border:1px solid var(--lamp-soft);border-radius:10px;padding:10px 14px;cursor:pointer}
#dChoices button:hover,#dChoices button:focus-visible{background:rgba(243,176,79,.2);outline:none;border-color:var(--lamp)}
#dChoices button span{color:var(--lamp);margin-right:10px;font-size:13px}

#narr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:24;background:rgba(5,8,18,.5);padding:24px}
#narr.dark{background:#04060d}
#narr p{font-size:clamp(17px,2.3vw,22px);line-height:1.95;max-width:min(88vw,600px);text-align:center;margin:0;opacity:0;transition:opacity .6s}
.tapHint{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,.35)}

#card{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:26;background:#04060d;text-align:center;padding:24px}
#card h2{font-weight:400;font-size:clamp(26px,4.8vw,44px);margin:0;opacity:0;transition:opacity 1.2s}
#card p{color:var(--muted);margin:14px 0 0;font-size:15px;opacity:0;transition:opacity 1.2s .4s}

#fade{position:fixed;inset:0;background:#000;opacity:1;pointer-events:none;z-index:30}

#letter{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:27;background:rgba(4,6,13,.72);padding:20px}
#letter .paper{width:min(90vw,460px);background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:30px 32px 26px;
  box-shadow:0 20px 50px rgba(0,0,0,.5);transform:rotate(-.6deg)}
#letterBody{font-size:19px;line-height:2;white-space:pre-line;min-height:4em}
#letterFrom{text-align:right;margin-top:14px;font-size:15px;opacity:.75}

#mapov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:22;background:rgba(4,6,13,.75);padding:16px}
#mapov .wrap{position:relative;width:min(92vw,560px)}
#mapCanvas{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#mapClose{position:absolute;right:10px;top:10px;font:inherit;font-size:14px;background:rgba(58,46,38,.85);color:var(--paper);border:0;border-radius:8px;padding:6px 12px;cursor:pointer}

#touch{position:fixed;inset:0;z-index:12;pointer-events:none;display:none}
#joyBase{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:none}
#joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.3)}
.tbtn{position:absolute;pointer-events:auto;width:72px;height:72px;border-radius:50%;border:2px solid rgba(255,255,255,.35);
  background:rgba(12,17,36,.45);color:var(--text);font:inherit;font-size:14px}
#btnAtk{right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px))}
#btnUse{right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));border-color:var(--lamp);color:var(--lamp)}
#btnUse.ready{background:rgba(243,176,79,.25)}

#title{position:fixed;inset:0;z-index:28;display:flex;align-items:flex-end;padding:0 clamp(24px,7vw,96px) clamp(40px,10vh,110px);
  background:linear-gradient(to top,rgba(4,6,13,.9) 0%,rgba(4,6,13,.2) 55%,rgba(4,6,13,0) 100%)}
#title .inner{max-width:560px}
#title .small{color:var(--lamp);font-size:15px;margin-bottom:10px}
#title h1{font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(46px,9vw,92px);line-height:1.05;margin:0 0 18px;letter-spacing:-.01em}
#title .line{font-family:'Gowun Batang',serif;color:var(--muted);font-size:16px;line-height:1.8;margin:0 0 26px}
#title .btns{display:flex;gap:12px;flex-wrap:wrap}
#title button{font:inherit;font-size:16px;padding:12px 22px;border-radius:999px;cursor:pointer;border:1px solid var(--lamp);background:var(--lamp);color:#20160a}
#title button.ghost{background:transparent;color:var(--lamp)}
#title button:focus-visible{outline:2px solid #fff;outline-offset:3px}
#title .keys{margin-top:22px;color:rgba(255,255,255,.45);font-size:13px;line-height:1.7}

#credits{position:fixed;inset:0;z-index:29;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000;text-align:center;gap:18px;padding:24px}
#credits .t{font-family:'Gowun Batang',serif;font-size:clamp(20px,3.4vw,30px);opacity:0;transition:opacity 1.4s}
#credits .s{color:#8d93a8;font-size:14px;opacity:0;transition:opacity 1.4s .6s}
#credits svg{width:110px;opacity:0;transition:opacity 1.4s 1.2s}
#credits .by{font-size:15px;letter-spacing:.04em;opacity:0;transition:opacity 1.4s 1.6s}
#credits button{margin-top:16px;font:inherit;font-size:14px;padding:10px 18px;border-radius:999px;border:1px solid #555;background:transparent;color:#ccc;cursor:pointer;opacity:0;transition:opacity 1s 2.4s}
#credits.on .t,#credits.on .s,#credits.on svg,#credits.on .by,#credits.on button{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="objective"></div>
  <button id="mapBtn" type="button">지도</button>
  <div id="crosshair"></div>
  <div id="prompt"></div>
  <div id="toast"></div>
  <div id="bars"><div id="hearts"></div><div id="beaconWrap">봉화에 불을 붙이는 중<div id="beaconBar"><div id="beaconFill"></div></div></div></div>
  <div id="taskBar"><div id="taskLabel"></div><div class="track"><div id="taskFill"></div></div></div>
</div>
<div id="hurt"></div>

<div id="touch">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <button class="tbtn" id="btnUse" type="button">사용</button>
  <button class="tbtn" id="btnAtk" type="button">검</button>
</div>

<div id="dialog"><div class="box"><div id="dSpeaker"></div><div id="dText" class="serif"></div><div id="dChoices"></div></div></div>
<div id="narr"><p class="serif" id="narrP"></p><div class="tapHint">눌러서 계속</div></div>
<div id="card"><h2 class="serif" id="cardT"></h2><p id="cardS"></p></div>
<div id="letter"><div class="paper"><div id="letterBody" class="serif"></div><div id="letterFrom" class="serif"></div></div><div class="tapHint">눌러서 계속</div></div>
<div id="mapov"><div class="wrap"><canvas id="mapCanvas" width="560" height="700"></canvas><button id="mapClose" type="button">닫기</button></div></div>

<div id="credits">
  <div class="t">2장까지의 이야기가 끝났습니다</div>
  <div class="s">래키나의 지도에는 아직 빈 곳이 많다</div>
  <svg viewBox="0 0 76 62" aria-label="manamiwu 로고"><rect width="76" height="62" fill="#000"/><circle cx="17" cy="15" r="11" fill="#fff"/><rect x="4" y="30" width="27" height="24" fill="#fff"/><polygon points="35,4 35,54 70,54" fill="#fff"/></svg>
  <div class="by">Created by manamiwu</div>
  <button type="button" id="toTitle">처음 화면으로</button>
</div>

<div id="title">
  <div class="inner">
    <div class="small">래키나의 이야기</div>
    <h1>돌아오는 용사</h1>
    <p class="line">용사는 세상을 구한 다음에 뭐 할까.</p>
    <div class="btns">
      <button type="button" id="btnNew">처음부터 시작</button>
      <button type="button" id="btnCont" class="ghost" style="display:none">2장부터 이어하기</button>
    </div>
    <div class="keys" id="keysHint"></div>
  </div>
</div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const isTouch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};

/* ---------------- save ---------------- */
const SAVE_KEY='returning-hero-v1';
function loadSave(){try{return JSON.parse(localStorage.getItem(SAVE_KEY))||{};}catch(e){return {};}}
function writeSave(o){try{localStorage.setItem(SAVE_KEY,JSON.stringify(o));}catch(e){}}

/* ---------------- renderer ---------------- */
const canvas=$('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:!isTouch||devicePixelRatio<2});
renderer.setPixelRatio(Math.min(devicePixelRatio,isTouch?1.5:2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x161d38,20,140);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,700);
camera.rotation.order='YXZ';scene.add(camera);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

const M=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
const MF=(c,o={})=>new THREE.MeshPhongMaterial(Object.assign({color:c,flatShading:true,shininess:4},o));
function mesh(g,m,cast=true,recv=true){const x=new THREE.Mesh(g,m);x.castShadow=cast;x.receiveShadow=recv;return x;}

/* ---------------- lights & sky ---------------- */
const hemi=new THREE.HemisphereLight(0xcfd8ff,0x4a4036,.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d6,1);sun.castShadow=true;
sun.shadow.mapSize.set(isTouch?1024:2048,isTouch?1024:2048);
Object.assign(sun.shadow.camera,{left:-38,right:38,top:38,bottom:-38,near:1,far:220});sun.shadow.bias=-.0006;
scene.add(sun);scene.add(sun.target);
const skyU={top:{value:new THREE.Color(0x070b1c)},bot:{value:new THREE.Color(0x1b2447)}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(480,24,12),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,
 vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 top;uniform vec3 bot;varying vec3 vP;void main(){float h=clamp(vP.y*1.5+.12,0.,1.);gl_FragColor=vec4(mix(bot,top,pow(h,.75)),1.);}'}));
sky.renderOrder=-2;scene.add(sky);
const starGeo=new THREE.BufferGeometry();{const a=[];for(let i=0;i<700;i++){const th=rnd()*Math.PI*2,ph=Math.acos(rnd()*.92);a.push(Math.sin(ph)*Math.cos(th)*440,Math.cos(ph)*440,Math.sin(ph)*Math.sin(th)*440);}starGeo.setAttribute('position',new THREE.Float32BufferAttribute(a,3));}
const starMat=new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false,transparent:true,opacity:1,fog:false,depthWrite:false});
const stars=new THREE.Points(starGeo,starMat);stars.renderOrder=-1;scene.add(stars);
const moon=new THREE.Mesh(new THREE.SphereGeometry(9,16,12),new THREE.MeshBasicMaterial({color:0xf2ecd8,fog:false,transparent:true}));scene.add(moon);

const TIMES={
 day:{top:0x5f98cf,bot:0xd3e4ee,fog:0xcfdfe9,near:40,far:200,sun:1.05,sunC:0xfff0d6,hemi:.65,stars:0,moon:0,dir:[40,70,25]},
 winter:{top:0x7f95b3,bot:0xdfe5ec,fog:0xd6dde6,near:25,far:150,sun:.7,sunC:0xf2f4ff,hemi:.8,stars:0,moon:0,dir:[30,45,35]},
 dusk:{top:0x3c4470,bot:0xf0a074,fog:0xcf9478,near:25,far:160,sun:.75,sunC:0xffa86e,hemi:.45,stars:.25,moon:.3,dir:[90,14,-30]},
 night:{top:0x060a1a,bot:0x1a2346,fog:0x151c37,near:14,far:110,sun:.2,sunC:0x8fa4ff,hemi:.25,stars:1,moon:1,dir:[-40,60,30]},
 dawn:{top:0x5b6b9f,bot:0xf3c4a2,fog:0xdfb9a5,near:25,far:160,sun:.6,sunC:0xffd2a8,hemi:.5,stars:.1,moon:.2,dir:[-90,16,20]}
};
const cur={top:new THREE.Color(0x060a1a),bot:new THREE.Color(0x1a2346),fog:new THREE.Color(0x151c37),near:14,far:110,sun:.2,sunC:new THREE.Color(0x8fa4ff),hemi:.25,stars:1,moon:1,dir:new THREE.Vector3(-40,60,30)};
let timeName='night';
function applyTime(){skyU.top.value.copy(cur.top);skyU.bot.value.copy(cur.bot);scene.fog.color.copy(cur.fog);scene.fog.near=cur.near;scene.fog.far=cur.far;
 sun.intensity=cur.sun;sun.color.copy(cur.sunC);hemi.intensity=cur.hemi;starMat.opacity=cur.stars;moon.material.opacity=cur.moon;moon.visible=cur.moon>.02;stars.visible=cur.stars>.02;}
function setTime(name,ms=0){timeName=name;const T=TIMES[name];
 const from={top:cur.top.clone(),bot:cur.bot.clone(),fog:cur.fog.clone(),near:cur.near,far:cur.far,sun:cur.sun,sunC:cur.sunC.clone(),hemi:cur.hemi,stars:cur.stars,moon:cur.moon,dir:cur.dir.clone()};
 const to={top:new THREE.Color(T.top),bot:new THREE.Color(T.bot),fog:new THREE.Color(T.fog),sunC:new THREE.Color(T.sunC),dir:new THREE.Vector3(...T.dir)};
 const step=k=>{cur.top.copy(from.top).lerp(to.top,k);cur.bot.copy(from.bot).lerp(to.bot,k);cur.fog.copy(from.fog).lerp(to.fog,k);cur.sunC.copy(from.sunC).lerp(to.sunC,k);
  cur.near=lerp(from.near,T.near,k);cur.far=lerp(from.far,T.far,k);cur.sun=lerp(from.sun,T.sun,k);cur.hemi=lerp(from.hemi,T.hemi,k);cur.stars=lerp(from.stars,T.stars,k);cur.moon=lerp(from.moon,T.moon,k);cur.dir.copy(from.dir).lerp(to.dir,k);applyTime();};
 if(ms<=0){step(1);return Promise.resolve();}return tween(ms,step);}

/* ---------------- terrain ---------------- */
const VIL=[{x:0,z:0,r:52},{x:0,z:-165,r:58}];
function distSeg(px,pz,ax,az,bx,bz){const vx=bx-ax,vz=bz-az,wx=px-ax,wz=pz-az;const t=clamp((wx*vx+wz*vz)/(vx*vx+vz*vz),0,1);return Math.hypot(px-(ax+vx*t),pz-(az+vz*t));}
const FOREST_PATH=[[8,-165],[36,-168],[60,-171],[73,-176],[88,-189]];
function pathDist(x,z){let d=1e9;for(let i=0;i<FOREST_PATH.length-1;i++){const a=FOREST_PATH[i],b=FOREST_PATH[i+1];d=Math.min(d,distSeg(x,z,a[0],a[1],b[0],b[1]));}return d;}
function hRaw(x,z){return 1.5*Math.sin(x*.045)*Math.cos(z*.038)+.9*Math.sin(x*.11+z*.07)+.55*Math.cos(z*.13-x*.05);}
function H(x,z){
 let k=1;
 if(z<10&&z>-205)k=Math.min(k,smooth(5,16,Math.abs(x)));
 for(const v of VIL){k=Math.min(k,smooth(v.r*.62,v.r,Math.hypot(x-v.x,z-v.z)));}
 k=Math.min(k,.25+.75*smooth(3,10,pathDist(x,z)));
 if(Math.hypot(x-74,z+176)<9)k=Math.min(k,.25);
 let h=hRaw(x,z)*k;
 const b=Math.max(0,-60-x,x-122,z-46,-240-z);
 h+=b*b*.12+b*1.2+(b>0?Math.sin(x*.21)*Math.cos(z*.17)*b*.35:0);
 return h;
}
function roadAmt(x,z){
 let r=0;
 if(z<6&&z>-200)r=Math.max(r,1-smooth(2.2,4.2,Math.abs(x)));
 r=Math.max(r,1-smooth(6,10,Math.hypot(x,z+30)));
 r=Math.max(r,1-smooth(8,13,Math.hypot(x,z+165)));
 r=Math.max(r,(1-smooth(1.2,3,pathDist(x,z)))*.8);
 return r;
}
const TW=560,TD=440,TCX=28,TCZ=-100;
const tg=new THREE.PlaneGeometry(TW,TD,224,176);tg.rotateX(-Math.PI/2);tg.translate(TCX,0,TCZ);

const boxes=[],circles=[];
function addBox(x,z,w,d,rot=0){const sw=Math.abs(Math.sin(rot))>.5;const W=sw?d:w,D=sw?w:d;boxes.push({x0:x-W/2,x1:x+W/2,z0:z-D/2,z1:z+D/2});}
function addBoxXY(x0,x1,z0,z1){boxes.push({x0,x1,z0,z1});}
function collide(p){const R=.32;
 for(const b of boxes){if(p.x>b.x0-R&&p.x<b.x1+R&&p.z>b.z0-R&&p.z<b.z1+R){
  const a=p.x-(b.x0-R),bb=(b.x1+R)-p.x,c=p.z-(b.z0-R),d=(b.z1+R)-p.z;const m=Math.min(a,bb,c,d);
  if(m===a)p.x=b.x0-R;else if(m===bb)p.x=b.x1+R;else if(m===c)p.z=b.z0-R;else p.z=b.z1+R;}}
 for(const c of circles){if(c.off)continue;const dx=p.x-c.x,dz=p.z-c.z,d=Math.hypot(dx,dz),m=c.r+R;if(d<m&&d>1e-4){p.x=c.x+dx/d*m;p.z=c.z+dz/d*m;}}}

 return true;}

 await narr(['며칠 뒤 봉화가 다시 타올랐다.\n아니, 그날 밤이었다.','마을 담장 가까이 다가오던 그림자들이 숲으로 물러났다.','사람들은 오랜만에 창문을 열고 잠들었다.']);
 // trembling
 P.lockMove=false;shake=5;await wait(500);
 await narr(['싸움이 끝났는데, 손이 떨렸다.']);
 S.circles.push('villageA');
 obj('여관에서 쉰다',[13.6,-186]);
 await interact(14,-186,'여관에 들어간다',3);obj('');
 await fadeTo(1,1000);
 await narr(['그날 밤 래키나는 아빠에게 편지를 썼다.'],{dark:true});
 await letter('오늘은 괴물을 한 마리도 물리치지 못했어.\n감자만 나르고 손에 물집이 생겼어.\n생각했던 모험이랑 좀 달라.','— 래키나');
 await card('며칠 뒤','다음 마을');
 await narr(['답장은 다음 마을에서 받았다.'],{dark:true});
 await letter('감자는 몇 명이 먹었니?\n손은 깨끗이 씻고 약을 발라라.','— 아빠');
 await narr(['래키나는 편지를 읽고 피식 웃었다.','그러고는 자신이 지나온 마을을\n지도에 작은 동그라미로 표시했다.'],{dark:true});
 // map circle animation
 mapOpen=true;$('mapov').style.display='flex';$('mapClose').style.display='none';
 await tween(2200,k=>drawMap({id:'villageA',k}),x=>x);
 await wait(1600);await waitAdvance();
 $('mapov').style.display='none';mapOpen=false;$('mapClose').style.display='';
 writeSave({ch:2,done2:true});
 showCredits();
}

function showCredits(){const c=$('credits');c.style.display='flex';void c.offsetWidth;c.classList.add('on');$('objective').style.opacity=0;}
$('toTitle').addEventListener('click',()=>location.reload());

/* ---------------- title ---------------- */
function titleScene(){hideAllNPC();setSeason('winter');setTime('night');setWindows(true);lightLamp(true);
 placePlayer(-6,-15,0,2.4);P.yaw=yawTo(-3,-4);P.pitch=-.04;P.lockMove=true;setHeld(null);P.pos.y=H(-6,-15);
 fadeTo(0,1600);}
$('keysHint').textContent=isTouch?'왼쪽을 끌어 이동하고, 오른쪽을 끌어 둘러봅니다.':'WASD 이동 · 마우스 시점 · E 상호작용 · 클릭/F 공격 · M 지도 · Shift 달리기';
if(loadSave().ch===2)$('btnCont').style.display='inline-block';
async function begin(ch){audioInit();$('title').style.display='none';await fadeTo(1,700);
 if(ch===2){await chapter2();}else{await prologue();await chapter1();await chapter2();}}
$('btnNew').addEventListener('click',()=>begin(1));
$('btnCont').addEventListener('click',()=>begin(2));
applyTime();titleScene();loop();
</script>
