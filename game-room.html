<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>manamiwu 게임방</title>
<!-- 공유 미리보기: GitHub Pages 주소가 다르면 아래 두 주소만 바꿔 주세요 -->
<meta name="description" content="manamiwu가 직접 만든 게임 24개를 한곳에 모은 게임방">
<meta property="og:type" content="website">
<meta property="og:title" content="지훈이네 게임방">
<meta property="og:description" content="공포 · 모험 · 액션 · 병맛 · 감성, 직접 만든 게임 24개">
<meta property="og:url" content="https://hoonchoi0324-hihi.github.io/game-room.html">
<meta property="og:image" content="https://hoonchoi0324-hihi.github.io/game-room-share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 휴대용 게임기 홈 화면 — 상단 이어하기 띠, 장르 칩, 아이콘 타일 격자 */
:root{
  --bg:#191a33; --panel:#23254a; --line:#34376a;
  --fg:#f3efe6; --muted:#a9a8c8; --accent:#ffb84d; --accent-ink:#2a1c05;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,44px);margin:0;line-height:1.1;text-wrap:balance}
h1 b{color:var(--accent);font-weight:400}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:10px;flex-wrap:wrap}
.search{flex:1 1 220px;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--fg);
  border-radius:14px;padding:12px 14px;font:inherit}
.search::placeholder{color:var(--muted)}
.btn{font-family:var(--display);font-size:17px;border:0;border-radius:14px;padding:10px 18px;cursor:pointer;
  background:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(1.07)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:0 0 auto;font:inherit;font-size:14px;color:var(--muted);background:transparent;border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sec-title{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.recent{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.recent a{flex:0 0 auto;display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:16px;
  padding:8px 14px 8px 8px;color:var(--fg);text-decoration:none;font-size:14px}
.recent .ico{width:44px;height:44px;border-radius:12px;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
@media (max-width:420px){.grid{grid-template-columns:repeat(3,1fr);gap:16px 10px}}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--fg);min-width:0}
.ico{aspect-ratio:1;max-width:100%;border-radius:24%;display:grid;place-items:center;font-size:clamp(34px,9vw,56px);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.25);transition:transform .15s}
.tile:hover .ico{transform:translateY(-3px) rotate(-2deg)}
.tile:active .ico{transform:scale(.95)}
.name{font-family:var(--display);font-size:16px;line-height:1.25;text-wrap:balance}
.meta{color:var(--muted);font-size:12px;margin-top:-6px}
.new{position:absolute;top:-6px;left:-4px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);
  font-size:12px;border-radius:8px;padding:1px 7px}
.fav{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(25,26,51,.55);color:var(--fg);font-size:16px;line-height:1}
.fav[aria-pressed="true"]{color:var(--accent)}
.empty{color:var(--muted);padding:24px 0}
footer{color:var(--muted);font-size:12px;text-align:center}
#player{position:fixed;inset:0;z-index:50;background:#000}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
#home{position:absolute;z-index:2;left:50%;transform:translateX(-50%);top:calc(4px + env(safe-area-inset-top,0px));
  width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(25,26,51,.55);
  font-size:18px;cursor:pointer;opacity:.55;transition:opacity .2s}
#home:hover,#home:focus-visible{opacity:1}
body.playing{overflow:hidden}
@media (prefers-reduced-motion:reduce){.ico{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <small>made by manamiwu</small>
      <h1>지훈이네 <b>게임방</b></h1>
    </div>
    <span class="count" id="count"></span>
  </header>

  <div class="bar">
    <input class="search" id="q" type="search" placeholder="게임 이름으로 찾기" aria-label="게임 검색">
    <button class="btn" id="rand" type="button">🎲 아무거나 한 판</button>
  </div>

  <div class="chips" id="chips" role="toolbar" aria-label="장르"></div>

  <section id="recentBox" hidden>
    <h2 class="sec-title">이어서 하기</h2>
    <div class="recent" id="recent"></div>
  </section>

  <section style="display:flex;flex-direction:column;gap:14px">
    <h2 class="sec-title" id="gridTitle">전체 게임</h2>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>찾는 게임이 없어요. 다른 이름으로 검색해 보세요.</p>
  </section>

  <footer>게임이 모두 이 게임방 안에 들어 있어요 · ☆를 누르면 즐겨찾기</footer>
</div>

<div id="player" hidden>
  <iframe id="frame" title="게임" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
  <button id="home" type="button" aria-label="게임방으로 돌아가기">🏠</button>
</div>

<script>
const SLUG={"85aea326": "cmo-halloween-3d", "2ce65650": "cmo-halloween", "321ac4a1": "blanket-ghost", "ce14bda2": "breath-balloon", "b4f069f8": "speed-rush", "6d5490b0": "etheria", "05a0c528": "gaeguri-hero-2", "b635fa93": "gaeguri-hero", "30e1eb60": "fog-island-compass", "4792e2ff": "secret-ramen", "99fdc83e": "estate-cleaner", "f9f32547": "grandpa-rollax", "ce0f583e": "found-phone", "e9ca8b34": "grass-walk", "abd58a5e": "returning-hero", "240af1ee": "rekina", "573f6456": "wind-island", "74994ec7": "tiny-house", "36686a7d": "teddy", "1915e634": "swipe-minigames", "1af4701d": "lighthouse", "a4ce67e6": "museum", "9aaf34f1": "cmo", "60d921f7": "after-hours-arcade"};
const G=[
 ["85aea326-54c5-40da-ac83-112f025e87f4","CMO 할로윈 3D","액션","🎃","#ff8a3d","#6b2bd9","2026-10-19"],
 ["2ce65650-28f5-466d-b0a4-0e81defb052c","CMO 할로윈","액션","🦇","#f7a531","#3b1f5e","2026-10-18"],
 ["321ac4a1-e960-49e2-807a-aaf0b1a87d8c","이불 유령 민수","병맛","👻","#c9d6ff","#6f7cc7","2026-10-18"],
 ["ce14bda2-21fc-46f6-8d55-8ca91f88041f","숨결의 풍선","모험","🎈","#9ef0c8","#2a8f7a","2026-10-17"],
 ["b4f069f8-34dc-4607-a747-2f3b0aea44bd","질주 본능","액션","🏎️","#ffd84d","#e8463a","2026-10-11"],
 ["6d5490b0-568a-48bc-8a0b-cf878490fe0c","에테리아","모험","🗡️","#8fd3ff","#3a3fa8","2026-10-09"],
 ["05a0c528-d03b-4bac-aee4-e46ce9c89990","개구리용사 2","모험","🐸","#c8f26b","#3e8a3a","2026-10-07"],
 ["b635fa93-fa61-4ef9-b0e3-441428f948f1","개구리용사","모험","🐸","#e1f5a3","#5f9c2f","2026-10-07"],
 ["30e1eb60-cc08-40c6-95d6-a57077e649a4","안개섬의 나침반","모험","🧭","#d9e4ea","#56707f","2026-10-06"],
 ["4792e2ff-1e90-4c54-ae91-95d4f3e425c9","엄마 몰래 라면 끓이기","병맛","🍜","#ffe08a","#e86a2c","2026-10-04"],
 ["99fdc83e-b09b-4399-934f-ac6d635d2d38","유품정리사의 밤","공포","📦","#b8a387","#3a2d22","2026-10-03"],
 ["f9f32547-667c-4764-b243-2a9172efc98b","할아버지의 새로운 롤랙스","병맛","⌚","#ffe3b3","#c98a2b","2026-10-01"],
 ["ce0f583e-c82a-487a-a3ea-eca485ad0e34","02:47 주운 폰","공포","📱","#6b7a99","#141826","2026-10-01"],
 ["e9ca8b34-0f3f-42cf-b13e-d2a8e30252f7","풀길 산책","감성","🌿","#d3f2b5","#5aa36b","2026-10-01"],
 ["abd58a5e-e7c1-4496-87dc-eb3931df489c","돌아오는 용사","모험","🛡️","#ffd1dc","#b0476b","2026-10-01"],
 ["240af1ee-884f-44e2-85de-9ee972603d07","소녀 용사 래키나","모험","⚔️","#ffe0ea","#d4607f","2026-10-01"],
 ["573f6456-823a-4235-88be-edd1aa20ba43","바람이 멈춘 섬","모험","🏝️","#a8ecff","#2d8fb8","2026-10-01"],
 ["74994ec7-5d39-4fe9-933d-f59582500c86","5cm, 현관문까지","모험","🚪","#ffe6c2","#a8623a","2026-09-27"],
 ["36686a7d-8abd-44a9-bbca-3a7487328e52","장난감 대작전","액션","🧸","#ffcf9e","#b86a32","2026-09-27"],
 ["1915e634-2b79-4335-8b33-c252704f30c0","넘겨 한 판","미니게임","👆","#ffb3e6","#8a3dd1","2026-09-26"],
 ["1af4701d-b351-4e55-ae82-c453bb98ceea","마지막 등대지기","감성","🏮","#ffd27a","#1f3a6b","2026-09-26"],
 ["a4ce67e6-9b1c-4f5d-a34f-6a2ef318e88f","불 꺼진 박물관","공포","🔦","#e8d48a","#1c1b24","2026-09-26"],
 ["9aaf34f1-6afd-4a9f-87c7-9c5be5243c80","CMO","액션","😺","#ffe58a","#ff8fb1","2026-09-26"],
 ["60d921f7-ac4f-4ebe-a31a-0fc0de06a298","심야 오락실","공포","🕹️","#ff5f8f","#2a1240","2026-09-24"],
].map(([id,name,genre,emoji,c1,c2,date])=>({id,name,genre,emoji,c1,c2,date,url:SLUG[id.slice(0,8)]+".html"}));

const GENRES=["전체","즐겨찾기","공포","모험","액션","병맛","감성","미니게임"];
const TODAY=new Date("2026-10-19");
const isNew=d=>(TODAY-new Date(d))/864e5<=7;

const store={get(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let favs=new Set(store.get("mw-favs",[]));
let recent=store.get("mw-recent",[]);
let genre="전체", q="";

const $=id=>document.getElementById(id);
const icon=g=>`<div class="ico" style="background:linear-gradient(145deg,${g.c1},${g.c2})" aria-hidden="true">${g.emoji}</div>`;

function played(id){
  recent=[id,...recent.filter(x=>x!==id)].slice(0,6);
  store.set("mw-recent",recent); renderRecent();
}
function renderChips(){
  $("chips").innerHTML=GENRES.map(x=>`<button class="chip" type="button" aria-pressed="${x===genre}" data-g="${x}">${x==="즐겨찾기"?"★ ":""}${x}</button>`).join("");
}
function renderRecent(){
  const list=recent.map(id=>G.find(g=>g.id===id)).filter(Boolean);
  $("recentBox").hidden=!list.length;
  $("recent").innerHTML=list.map(g=>`<a href="${g.url}" data-id="${g.id}">${icon(g)}<span>${g.name}</span></a>`).join("");
}
function renderGrid(){
  const list=G.filter(g=>
    (genre==="전체"||(genre==="즐겨찾기"?favs.has(g.id):g.genre===genre)) &&
    (!q||g.name.replace(/\s/g,"").includes(q.replace(/\s/g,""))));
  $("grid").innerHTML=list.map(g=>`
    <a class="tile" href="${g.url}" data-id="${g.id}">
      ${icon(g)}
      ${isNew(g.date)?'<span class="new">NEW</span>':""}
      <button class="fav" type="button" data-fav="${g.id}" aria-pressed="${favs.has(g.id)}" aria-label="${g.name} 즐겨찾기">${favs.has(g.id)?"★":"☆"}</button>
      <span class="name">${g.name}</span>
      <span class="meta">${g.genre}</span>
    </a>`).join("");
  $("empty").hidden=!!list.length;
  $("gridTitle").textContent=genre==="전체"?"전체 게임":genre;
  $("count").textContent=`게임 ${G.length}개`;
}

$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;genre=b.dataset.g;renderChips();renderGrid()});
$("q").addEventListener("input",e=>{q=e.target.value.trim();renderGrid()});
document.addEventListener("click",e=>{
  const f=e.target.closest("[data-fav]");
  if(f){e.preventDefault();e.stopPropagation();const id=f.dataset.fav;
    favs.has(id)?favs.delete(id):favs.add(id);store.set("mw-favs",[...favs]);renderGrid();return}
  const a=e.target.closest("a[data-id]"); if(a){e.preventDefault();play(a.dataset.id)}
});
$("rand").addEventListener("click",()=>{
  play(G[Math.floor(Math.random()*G.length)].id);
});

/* 게임 실행: 게임방 안의 games 폴더에서 게임을 꺼내 전체 화면으로 띄워요 */
function play(id){
  const g=G.find(x=>x.id===id); if(!g)return;
  played(id);
  const f=$("frame"); f.src=g.url;
  $("player").hidden=false; document.body.classList.add("playing"); document.title=g.name;
  f.onload=()=>{try{f.contentWindow.focus()}catch(e){f.focus()}};
  try{history.pushState({game:id},"")}catch(e){}
}
function closeGame(fromPop){
  if($("player").hidden)return;
  $("frame").src="about:blank"; $("player").hidden=true; document.body.classList.remove("playing");
  document.title="manamiwu 게임방";
  if(!fromPop){try{history.back()}catch(e){}}
}
$("home").addEventListener("click",()=>closeGame(false));
addEventListener("popstate",()=>closeGame(true));

renderChips();renderRecent();renderGrid();
</script>
</body>
</html>
