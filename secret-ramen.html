<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>엄마 몰래 라면 끓이기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1a1d3b; --ink:#0d0f22; --ramen:#ff8a1f; --soup:#e2452b; --door:#ffd25a; --gas:#4fa3ff; --paper:#fff6e6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#0d0f22; } }
:root[data-theme="dark"]{ --ink:#0d0f22; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{height:100%;display:flex;flex-direction:column}
#stage{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#controls{display:flex;gap:10px;padding:12px 14px 16px;background:#2b2246}
button{font-family:inherit;font-size:19px;line-height:1.2;border:3px solid #120e22;border-radius:18px;padding:15px 10px;cursor:pointer;touch-action:manipulation;transition:transform .08s;box-shadow:0 5px 0 #120e22}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #120e22}
button:focus-visible{outline:3px solid var(--door);outline-offset:2px}
#act{flex:1;background:var(--paper);color:var(--night)}
#act.hold{background:#9fd3ff}
#act.danger{background:var(--soup);color:#fff;font-size:21px;animation:pulse .35s infinite alternate}
#act.off{background:#4a4378;color:#b9b2e0}
#lid{flex:0 0 34%;background:#e2b54a;color:var(--night)}
#lid.rattle{background:var(--soup);color:#fff;animation:jit .09s infinite}
@keyframes pulse{to{transform:scale(1.04)}}
@keyframes jit{0%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}100%{transform:translate(-1px,-1px)}}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(13,15,34,.6);padding:20px}
#ov[hidden]{display:none}
.card{max-width:340px;width:100%;background:var(--paper);color:#2b2246;border:4px solid #2b2246;box-shadow:8px 8px 0 #2b2246;border-radius:26px;padding:26px 22px 24px;text-align:center}
.card .clock{font-family:'Black Han Sans',sans-serif;font-size:15px;color:#6b70a3;letter-spacing:.04em}
.card h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:46px;line-height:1.04;margin:6px 0 14px;color:#ff5c6c;-webkit-text-stroke:2px #2b2246;paint-order:stroke fill}
.card h2{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:34px;line-height:1.1;margin:4px 0 12px;color:var(--soup)}
.card p{font-size:17px;line-height:1.55;margin:0 0 18px}
.card b{color:var(--soup);font-weight:400}
.card button{width:100%;background:#ffb04a;color:#2b2246;font-size:21px;border-color:#2b2246;box-shadow:0 5px 0 #2b2246}
.card .diffs{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.card button+button{margin-top:12px}
.card .diffs button+button{margin-top:0}
.card button.hard{background:#ff8f6b}
.card button.hell{background:#ff5c6c;color:#fff}
.card button.sub{background:#fff6e6;font-size:17px;padding:12px 10px}
.card .tip{font-size:14px;margin:6px 0 0;color:#6b70a3}
.credit{margin:6px 0 18px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;color:#6b70a3}
.credit svg{width:58px;height:58px;border-radius:8px}
@media (prefers-reduced-motion: reduce){#act.danger,#lid.rattle{animation:none}}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" aria-label="새벽 부엌 게임 화면"></canvas>
    <div id="ov"></div>
  </div>
  <div id="controls">
    <button id="act" class="off">…</button>
    <button id="lid" style="display:none">뚜껑 꾹!</button>
  </div>
</div>
<script>
(function(){
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const actB=document.getElementById('act'),lidB=document.getElementById('lid'),ov=document.getElementById('ov');
const W=400,H=640;let sc=1,ox=0,oy=0,dpr=1;
function resize(){const r=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);
  sc=Math.min(r.width/W,r.height/H);ox=(r.width-W*sc)/2;oy=(r.height-H*sc)/2;}
window.addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- audio ---------- */
let AC=null,NB=null,waterSrc=null;
function au(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();}
function nbuf(){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return NB}
function nHit(dur,f,q,g,type,f2){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=nbuf();
  const fl=AC.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;
  const ga=AC.createGain();ga.gain.setValueAtTime(g,t);ga.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(fl);fl.connect(ga);ga.connect(AC.destination);s.start(t);s.stop(t+dur+.05);}
function tone(f,dur,g,type,f2,delay){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),ga=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  ga.gain.setValueAtTime(g,t);ga.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(ga);ga.connect(AC.destination);o.start(t);o.stop(t+dur+.05);}
const SFX={
  click(){tone(2400,.03,.12,'square');nHit(.05,3200,2,.3)},
  rattle(){for(let i=0;i<4;i++){tone(rnd(700,1100),.06,.07,'triangle',null,i*.05);} nHit(.25,1400,3,.25)},
  rustle(){nHit(.14,4200,.8,.3,'highpass')},
  slurp(loud){nHit(loud?.5:.25,600,2,loud?.5:.2,'bandpass',2600)},
  plop(){tone(320,.25,.25,'sine',70)},
  sprinkle(){nHit(.3,6000,1,.08,'highpass')},
  glug(){tone(220,.09,.18,'sine',420)},
  press(){tone(180,.06,.1,'sine')},
  slap(){nHit(.35,1600,.4,1.2);tone(110,.25,.4,'sine',50)},
  step(){nHit(.08,500,1,.25);setTimeout(()=>nHit(.08,450,1,.25),380)},
  creak(){tone(160,.6,.05,'sawtooth',230)},
  bubble(){tone(rnd(500,900),.05,.025,'sine',1200)},
  win(){[523,659,784,1046].forEach((f,i)=>tone(f,.18,.12,'triangle',null,i*.12))}
};
function startWater(){if(!AC)return;stopWater();const s=AC.createBufferSource();s.buffer=nbuf();s.loop=true;
  const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=1700;fl.Q.value=.6;const ga=AC.createGain();ga.gain.value=.12;
  s.connect(fl);fl.connect(ga);ga.connect(AC.destination);s.start();waterSrc=s;}
function stopWater(){if(waterSrc){try{waterSrc.stop()}catch(e){}waterSrc=null}}

/* ---------- state ---------- */
const BOIL=7,COOK=6,LIMIT=60;
const DIFFS={
  normal:{name:'보통',mult:.3,decay:1.5,need:7,step:3,fireAdd:3,checkT:3.8,warn:1.6,rWin:1.1,gap:1,bag:420,fireP:.36,maxClick:4,slurp:.6,bites:10,sur:null},
  hard:{name:'어려움',mult:.42,decay:1,need:9,step:4,fireAdd:4,checkT:3.3,warn:1.1,rWin:.8,gap:.78,bag:330,fireP:.26,maxClick:5,slurp:.8,bites:14,sur:[16,24]},
  hell:{name:'지옥 (엄마 귀 밝음)',mult:.56,decay:.6,need:11,step:5,fireAdd:5,checkT:2.9,warn:.75,rWin:.6,gap:.62,bag:260,fireP:.18,maxClick:7,slurp:1,bites:18,sur:[10,16]}
};
let DK='normal',D=DIFFS.normal,BITES=10;
function loadClears(){try{return JSON.parse(localStorage.getItem('ramen-clears')||'{}')}catch(e){return{}}}
function saveClear(k){try{const c=loadClears();c[k]=true;localStorage.setItem('ramen-clears',JSON.stringify(c));}catch(e){}}
let S;
function reset(){S={scene:'play',stage:'water',water:0,holding:false,fire:false,lidOn:false,clicks:0,
  rattle:0,nextR:2,boilT:0,bagP:0,drag:0,dragSpd:0,dragging:false,lx:0,ly:0,lastRustle:-9,
  noodleIn:false,cookT:0,eaten:0,lastBite:-9,noise:0,awake:6,check:null,checks:0,t:0,
  kidX:170,fridge:0,door:0,doorLight:0,pops:[],steam:[],hint:'배고파서 깼다. 물부터 받자. 콸콸 틀면 엄마가 깬다.',
  shake:0,st:0,surT:D.sur?rnd(D.sur[0],D.sur[1]):0,toss:9,cardShown:false,say:null,sayT:0};}
reset();S.scene='title';

function pop(text,x,y,col,size){S.pops.push({text,x,y,col:col||'#fff6e6',size:size||26,t:0})}
function addNoise(v,label,x,y,col,size){S.noise=Math.max(S.noise,v);S.awake+=Math.max(0,v-10)*D.mult;
  if(label)pop(label,x,y,col,size||Math.round(18+v*.35));}
function say(text,d){S.say=text;S.sayT=d||1.8}

/* ---------- actions ---------- */
function finishWater(){S.stage='fire';S.hint='냄비를 불 위에 올렸다. 가스레인지야 한 번에 켜져라…';}
function onAct(){
  if(S.scene!=='play')return;
  const c=S.check;
  if(c){ if(c.phase==='check'){c.taps++;SFX.glug();pop('벌컥',rnd(320,370),rnd(420,460),'#9fd3ff',22);} return; }
  switch(S.stage){
    case 'water': if(!S.holding){S.holding=true;startWater();} break;
    case 'fire':
      S.clicks++;SFX.click();addNoise(36,'딸깍',252,rnd(330,350),'#fff6e6');
      if(Math.random()<D.fireP||S.clicks>=D.maxClick){S.fire=true;S.lidOn=true;S.stage='boil';S.boilT=0;S.nextR=3;
        S.hint='불 붙었다! 물 끓으면 뚜껑이 들썩인다. 들썩이면 바로 꾹!';}
      else if(S.clicks===2)S.hint='…왜 안 켜져. 한 번 더.';
      break;
    case 'noodle':
      if(!S.noodleIn){S.noodleIn=true;SFX.plop();addNoise(30,'풍덩',252,330,'#9fd3ff');S.hint='이제 스프.';}
      else{SFX.sprinkle();addNoise(14,'사르륵',252,330,'#ff8a1f');S.lidOn=true;S.stage='cook';S.cookT=0;S.nextR=1.4;
        S.hint='익는 동안 뚜껑이 더 자주 들썩인다. 집중!';}
      break;
    case 'cook':
      if(S.cookT>=COOK){S.fire=false;S.lidOn=false;S.rattle=0;SFX.click();addNoise(24,'딸깍',252,340);
        S.stage='eat';S.hint='냄비 뚜껑에 덜어서… 빨리 먹으면 후루룩 소리 커진다.';}
      break;
    case 'eat':{
      const gap=S.t-S.lastBite;S.lastBite=S.t;S.eaten++;
      if(gap<D.slurp){SFX.slurp(true);addNoise(56,'후루루룩!!',rnd(200,260),rnd(410,440),'#ff8a1f');}
      else{SFX.slurp(false);addNoise(15,'후룹',rnd(210,250),rnd(420,440),'#fff6e6',20);}
      if(S.eaten>=BITES){win();}
      break;}
  }
}
function onActUp(){
  if(S.scene==='play'&&S.stage==='water'&&S.holding){S.holding=false;stopWater();
    if(S.water>=.72)finishWater();else S.hint='아직 부족해. 다시 꾹.';}
}
function pressLid(){
  if(S.scene!=='play'||S.check||!S.lidOn)return;
  if(S.rattle>0){S.rattle=0;S.nextR=nextGap();SFX.press();pop('꾹',252,320,'#e2b54a',24);}
}
function nextGap(){return D.gap*(S.stage==='bag'?rnd(2.8,4.4):S.stage==='cook'?rnd(1.2,2.3):rnd(1.7,3.1))}
function startCheck(){S.holding=false;stopWater();S.dragging=false;S.rattle=0;
  S.check={phase:'warn',t:0,need:D.need+S.checks*D.step+(S.fire?D.fireAdd:0),taps:0};S.hint='헉… 안방에서 슬리퍼 소리…';SFX.step();}
function lose(){S.scene='lose';S.st=0;S.cardShown=false;stopWater();}
function win(){saveClear(DK);S.scene='win';S.st=0;S.cardShown=false;S.hint='완벽한 범죄.';}

actB.addEventListener('pointerdown',e=>{e.preventDefault();au();onAct();});
['pointerup','pointerleave','pointercancel'].forEach(n=>actB.addEventListener(n,onActUp));
actB.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();au();onAct();}});
actB.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')onActUp();});
lidB.addEventListener('pointerdown',e=>{e.preventDefault();au();pressLid();});
lidB.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();pressLid();}});

function toL(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/sc,y:(e.clientY-r.top-oy)/sc}}
cv.addEventListener('pointerdown',e=>{au();if(S.scene!=='play'||S.check)return;const p=toL(e);
  if(S.stage==='bag'){S.dragging=true;S.lx=p.x;S.ly=p.y;try{cv.setPointerCapture(e.pointerId)}catch(_){}}
  else if(p.x>214&&p.x<290&&p.y>300&&p.y<395)pressLid();});
cv.addEventListener('pointermove',e=>{if(!S.dragging)return;const p=toL(e);
  S.drag+=Math.abs(p.x-S.lx)+Math.abs(p.y-S.ly)*.3;S.lx=p.x;S.ly=p.y;});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{S.dragging=false}));

/* ---------- update ---------- */
function update(dt){
  S.t+=dt;
  S.pops.forEach(p=>{p.t+=dt;p.y-=28*dt});S.pops=S.pops.filter(p=>p.t<1.1);
  if(S.sayT>0){S.sayT-=dt;if(S.sayT<=0)S.say=null;}
  S.noise=Math.max(0,S.noise-70*dt);
  S.shake=Math.max(0,S.shake-dt*2);
  const c=S.check;

  if(S.scene==='play'){
    if(c){
      c.t+=dt;
      if(c.phase==='warn'){S.doorLight=Math.min(1,S.doorLight+dt*2);
        if(c.t>D.warn){c.phase='check';c.t=0;SFX.creak();say('너 지금 뭐해?',1.6);S.hint=`물 마시러 온 척! ${c.need}번 연타!`;}}
      else if(c.phase==='check'){
        if(c.taps>=c.need){c.phase='leave';c.t=0;S.awake=20;S.checks++;say('…빨리 자.',1.4);S.hint='휴… 엄마 다시 들어갔다. 계속하자.';}
        else if(c.t>D.checkT){say('너 이리 와.',1);lose();}
      } else if(c.phase==='leave'&&c.t>1.5){S.check=null;S.doorLight=0;}
    } else {
      if(S.stage==='water'&&S.holding){
        S.water+=dt/2.6;S.noise=Math.max(S.noise,38);S.awake+=(38-15)*.2*dt;
        if(S.t-S.toss>.5){S.toss=S.t;pop('콸콸',rnd(170,195),rnd(330,350),'#9fd3ff',18);}
        if(S.water>1){S.holding=false;stopWater();S.water=.95;addNoise(50,'철철!',165,350,'#9fd3ff');finishWater();}
      }
      const canRattle=S.fire&&S.lidOn&&(S.stage!=='boil'||S.boilT>2.5);
      if(canRattle){
        if(S.rattle>0){S.rattle-=dt;if(S.rattle<=0){SFX.rattle();addNoise(46,'달그락!',252,322,'#e2b54a');S.shake=.25;S.nextR=nextGap();}}
        else{S.nextR-=dt;if(S.nextR<=0)S.rattle=D.rWin;}
      }
      if(S.fire&&Math.random()<dt*4&&(S.stage!=='boil'||S.boilT>2))SFX.bubble();
      if(S.stage==='boil'){S.boilT+=dt;if(S.boilT>=BOIL){S.stage='bag';S.nextR=Math.max(S.nextR,1.5);
        S.hint='물 끓었다! 봉지 뜯을 차례. 바스락 소리 조심.';}}
      if(S.stage==='bag'){
        const spd=S.drag/Math.max(dt,.001);S.dragSpd=S.dragSpd*.8+spd*.2;S.bagP+=S.drag/1100;S.drag=0;
        if(!S.dragging)S.dragSpd*=.85;
        if(S.dragSpd>D.bag&&S.t-S.lastRustle>.18){S.lastRustle=S.t;SFX.rustle();
          addNoise(Math.min(70,22+(S.dragSpd-D.bag)*.06),'바스락!',rnd(110,290),rnd(170,230),'#ff8a1f');}
        if(S.bagP>=1){S.stage='noodle';S.lidOn=false;S.rattle=0;S.hint='뚜껑 열었다. 면 넣고 스프 넣자.';}
      }
      if(S.stage==='cook')S.cookT+=dt;
      S.awake=Math.max(0,S.awake-D.decay*dt);
      if(S.awake>=LIMIT)startCheck();
      else if(D.sur){S.surT-=dt;if(S.surT<=0){S.surT=rnd(D.sur[0],D.sur[1]);startCheck();}}
    }
  } else if(S.scene==='win'){
    S.st+=dt;
    if(S.st>1&&S.st-dt<=1)pop('끄억',230,440,'#fff6e6',24);
    if(S.st>2.8&&S.st-dt<=2.8){SFX.creak();}
    if(S.st>3.4&&S.st-dt<=3.4)say('…너도?',2.6);
    if(S.st>6&&!S.cardShown){S.cardShown=true;SFX.win();showWin();}
  } else if(S.scene==='lose'){
    S.st+=dt;
    if(S.st>.55&&S.st-dt<=.55){SFX.slap();S.shake=1;}
    if(S.st>1.8&&!S.cardShown){S.cardShown=true;showLose();}
  }

  // positions
  let tx=170;
  if(S.stage==='eat'||S.scene==='win')tx=228;
  const atFridge=c&&(c.phase==='check'||(c.phase==='leave'&&c.t<.8));
  if(atFridge)tx=345;
  S.kidX+=(tx-S.kidX)*Math.min(1,dt*7);
  S.fridge=lerp(S.fridge,atFridge?1:0,Math.min(1,dt*8));
  const doorOpen=(c&&(c.phase==='check'||(c.phase==='leave'&&c.t<.9)))||(S.scene==='win'&&S.st>2.8);
  S.door=lerp(S.door,doorOpen?1:0,Math.min(1,dt*5));
  if(S.scene==='win'&&S.st>2.4)S.doorLight=Math.min(1,S.doorLight+dt*2);

  // steam
  if(S.fire&&(S.stage!=='boil'||S.boilT>2)&&Math.random()<dt*14)
    S.steam.push({x:252+rnd(-18,18),y:335,t:0,r:rnd(5,10)});
  S.steam.forEach(s=>{s.t+=dt;s.y-=30*dt;s.x+=Math.sin(s.t*3+s.r)*10*dt;});S.steam=S.steam.filter(s=>s.t<1.6);
}

/* ---------- drawing (webtoon style) ---------- */
const OL='#2b2246',SKIN='#ffe0c7',HAIR='#4a2f2a',PJ='#8fb6ff';
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function circ(x,y,r){cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);}
function ell(x,y,rx,ry,rot){cx.beginPath();cx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);}
function ink(fill,lw,col){if(fill){cx.fillStyle=fill;cx.fill();}cx.lineWidth=lw||3;cx.strokeStyle=col||OL;cx.lineJoin='round';cx.lineCap='round';cx.stroke();}
function limb(pts,col,w){cx.lineCap='round';cx.lineJoin='round';cx.beginPath();pts.forEach(([x,y],i)=>i?cx.lineTo(x,y):cx.moveTo(x,y));

  cx.setTransform(dpr*sc,0,0,dpr*sc,dpr*(ox+sx*sc),dpr*(oy+sy*sc));
  cx.save();cx.beginPath();cx.rect(0,0,W,H);cx.clip();
  if(S.scene==='lose'){drawLose();}
  else{
    drawRoom();drawDoor();drawFridge();drawCounter();drawPot();drawSteam();drawKid(S.kidX);
    if(S.scene==='title'){cx.fillStyle='rgba(13,15,34,.35)';cx.fillRect(0,0,W,H);}
    else{if(S.stage==='bag'&&S.scene==='play'&&!S.check)drawBag();drawHUD();drawBubble();}
    drawPops();
  }
  frame();
  cx.restore();
}

/* ---------- UI ---------- */
let lastLabel='',lastCls='';
function syncUI(){
  let label='…',cls='off';
  if(S.scene==='play'){
    const c=S.check;
    if(c){label=c.phase==='check'?`물 마시러 왔어!! (${c.taps}/${c.need})`:c.phase==='warn'?'쉿… 누가 나온다':'…휴';cls=c.phase==='check'?'danger':'off';}
    else switch(S.stage){
      case 'water':label=S.holding?'콸콸… 손 떼면 멈춤':'꾹 누르고 있으면 물 받기';cls='hold';break;
      case 'fire':label='불 켜기 (딸깍)';cls='';break;
      case 'boil':label=`물 끓는 중… ${Math.ceil(BOIL-S.boilT)}`;break;
      case 'bag':label='화면의 봉지를 문지르는 중';break;
      case 'noodle':label=S.noodleIn?'스프 넣기':'면 넣기';cls='';break;
      case 'cook':label=S.cookT>=COOK?'불 끄기 (딸깍)':`익는 중… ${Math.ceil(COOK-S.cookT)}`;cls=S.cookT>=COOK?'':'off';break;
      case 'eat':label=`후루룩 (${S.eaten}/${BITES})`;cls='';break;
    }
  }
  if(label!==lastLabel){actB.textContent=label;lastLabel=label;}
  if(cls!==lastCls){actB.className=cls;lastCls=cls;}
  const showLid=S.scene==='play'&&S.fire&&S.lidOn&&!S.check;
  lidB.style.display=showLid?'':'none';
  lidB.classList.toggle('rattle',S.rattle>0);
  lidB.textContent=S.rattle>0?'달달달! 꾹!':'뚜껑 꾹!';
}

const LOGO=`<svg viewBox="0 0 66 58" aria-label="manamiwu 로고"><rect width="66" height="58" fill="#000"/><circle cx="20" cy="17" r="10" fill="#fff"/><rect x="8" y="30" width="24" height="20" fill="#fff"/><polygon points="36,7 36,50 58,50" fill="#fff"/></svg>`;
function card(html){ov.innerHTML=`<div class="card">${html}</div>`;ov.hidden=false;
  ov.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.d)start(b.dataset.d);else if(b.dataset.menu)showTitle();}));
  const f=ov.querySelector('button');if(f)setTimeout(()=>f.focus(),50);}
function diffBtns(){const c=loadClears();
  return `<button data-d="normal">보통${c.normal?' ✓':''}</button>
  <button data-d="hard" class="hard">어려움${c.hard?' ✓':''}</button>
  <button data-d="hell" class="hell">지옥 · 엄마 귀 밝음${c.hell?' ✓':''}</button>`;}
function showTitle(){card(`<div class="clock">AM 2:13</div><h1>엄마 몰래<br>라면 끓이기</h1>
  <p>배고파서 깼다. 안방엔 엄마가 잔다.<br>소리를 내면 엄마 게이지가 찬다.<br>엄마가 나오면 <b>물 마시러 온 척</b> 연타.</p>
  <div class="diffs">${diffBtns()}</div>
  <p class="tip">어려움부터는 엄마가 소리 없이도 <b>갑자기</b> 나온다.</p>`);}
function showLose(){const r=['라면은 압수됐다. 엄마가 먹었다.','내일 아침 반찬이 김치뿐이다.','"몇 시인 줄 알아?" 설교 40분 추가.'][Math.floor(Math.random()*3)];
  card(`<div class="clock">${D.name}</div><h2>등짝 스매싱</h2><p>${r}<br>엄마 확인 ${S.checks}번 버팀 · 면 ${S.eaten}/${BITES} 먹음</p>
  <button data-d="${DK}">다시 몰래</button><button data-menu="1" class="sub">난이도 바꾸기</button>`);}
function showWin(){const next=DK==='normal'?'hard':DK==='hard'?'hell':null;
  card(`<div class="clock">${D.name} 클리어</div><h2>완벽한 범죄(?)</h2><p>엄마도 배고팠다.<br>둘은 아무 말 없이<br>라면을 하나 더 끓였다.</p>
  <div class="credit">${LOGO}<span>Created by manamiwu</span></div>
  ${next?`<button data-d="${next}" class="${next}">다음: ${DIFFS[next].name} 도전</button>`:`<p><b>지옥 클리어. 엄마보다 귀가 밝은 자.</b></p>`}
  <button data-d="${DK}" class="sub">같은 난이도 한 번 더</button><button data-menu="1" class="sub">처음으로</button>`);}
function start(k){au();DK=k||DK;D=DIFFS[DK];BITES=D.bites;reset();ov.hidden=true;ov.innerHTML='';actB.focus();}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S.scene!=='title')update(dt);else{S.t+=dt;}
  syncUI();render();requestAnimationFrame(loop);}
showTitle();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{}).finally(()=>requestAnimationFrame(loop));
})();
</script>
</body>
</html>
