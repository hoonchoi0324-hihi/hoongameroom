<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one color handheld centered on a dark ground; color scene on top, RPG message window, red command buttons below. Single deliberate look. */
:root{
  --ground:#17221b;
  --shell:#8fcf4a;
  --shell-shade:#5e9a2c;
  --bezel:#2c2f45;
  --label:#1f2a4a;
  --btn:#d8323c;
  --btn-hi:#ee4a52;
  --btn-low:#7e1620;
  --btn-ink:#fff4f2;
  --win:#1c2140;
  --win-ink:#f4f6ff;
  --win-dim:#9aa6d8;
  --win-hi:#f7d44a;
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-text:"Nanum Gothic Coding","D2Coding","Malgun Gothic",monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--label);font-family:var(--f-text);-webkit-tap-highlight-color:transparent;user-select:none}
.wrap{min-height:100%;display:flex;justify-content:center;align-items:flex-start;padding-inline:16px;padding-block:18px}
.shell{width:100%;max-width:400px;background:var(--shell);border-radius:16px 16px 56px 16px;padding:18px 18px 28px;box-shadow:inset -6px -8px 0 var(--shell-shade),0 18px 40px rgba(0,0,0,.45)}
.bezel{background:var(--bezel);border-radius:10px 10px 32px 10px;padding:12px 14px 16px}
.bezel-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-family:var(--f-display);color:#c9cde6;font-size:11px;letter-spacing:.12em}
.bezel-top .rb{flex:1;height:3px;background:linear-gradient(90deg,#e0303c,#f7a030,#f7d44a,#6cc04a,#3c8ad8,#9a52c8)}
.power{width:8px;height:8px;border-radius:50%;background:#e8364f;box-shadow:0 0 6px #e8364f}
.lcd{position:relative;background:#000;overflow:hidden;border-radius:2px}
canvas{display:block;width:100%;aspect-ratio:160/112;image-rendering:pixelated;image-rendering:crisp-edges}
.lcd.shake{animation:shake .32s steps(2) 1}
@keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,0)}}
.hud{display:flex;justify-content:space-between;gap:6px;background:var(--win);color:var(--win-ink);font-family:var(--f-display);font-size:14px;padding:5px 8px;border:2px solid var(--win-ink);border-bottom:0;margin-top:6px;border-radius:4px 4px 0 0;font-variant-numeric:tabular-nums}
.hud b{font-weight:400;color:var(--win-hi)}
.msg{background:var(--win);color:var(--win-ink);font-size:13.5px;line-height:1.55;padding:8px 10px;min-height:6.4em;white-space:pre-wrap;word-break:keep-all;border:2px solid var(--win-ink);border-radius:0 0 4px 4px;cursor:pointer}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:#fff;padding:10px}
.overlay[hidden]{display:none!important}
.t-big{font-family:var(--f-display);font-size:clamp(34px,11vw,48px);line-height:1;color:#9be05a;text-shadow:3px 0 0 #1a1c2c,-3px 0 0 #1a1c2c,0 3px 0 #1a1c2c,0 -3px 0 #1a1c2c,4px 5px 0 #d8323c;margin-top:-34px}
.t-sub{font-family:var(--f-display);letter-spacing:.3em;font-size:12px;color:#fff;text-shadow:1px 1px 0 #1a1c2c}
.lcd-btn{font-family:var(--f-display);font-size:16px;background:var(--win-hi);color:var(--win);border:2px solid var(--win);padding:5px 14px;cursor:pointer;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.6}}
.ending{background:var(--win);overflow:auto;justify-content:flex-start;padding-top:14px}
.ending .t-sub{color:var(--win-hi)}
.ending p{margin:0;font-size:12.5px;line-height:1.6;max-width:30ch;color:var(--win-ink)}
.credit{font-family:var(--f-display);font-size:13px;color:var(--win-dim);display:flex;flex-direction:column;align-items:center;gap:6px}
.brand{display:flex;align-items:baseline;gap:8px;margin:12px 4px 14px;font-family:var(--f-display);color:var(--label)}
.brand strong{font-size:22px;font-weight:400;font-style:italic}
.brand span{font-size:12px;letter-spacing:.2em}
.cmds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px}
.cmd{font-family:var(--f-display);font-size:18px;color:var(--btn-ink);background:var(--btn);border:0;border-radius:999px;padding:10px 4px;box-shadow:0 4px 0 var(--btn-low);cursor:pointer;min-width:0}
.cmd:hover:not(:disabled){background:var(--btn-hi)}
.cmd:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--btn-low)}
.cmd:disabled{background:var(--shell-shade);color:#d9eec4;box-shadow:0 4px 0 #44751e;cursor:default}
.cmd.blank{visibility:hidden}
.cmd:focus-visible{outline:3px solid var(--label);outline-offset:2px}
.cmd small{font-size:11px;opacity:.85;margin-left:2px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.keyhint{font-size:11px;color:#2f5214}
.speaker{display:flex;gap:6px;transform:rotate(-28deg)}
.speaker i{width:5px;height:30px;border-radius:3px;background:var(--shell-shade);box-shadow:inset 1px 1px 2px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){.lcd.shake,.lcd-btn{animation:none}}

.code-box{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,255,255,.08);border:1px dashed var(--win-dim);padding:6px 10px}
.code-box b{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.12em;color:var(--win-hi);user-select:text}
.code-box small{font-size:11px;color:var(--win-dim)}
.mini-btn{font-family:var(--f-display);font-size:13px;background:transparent;color:var(--win-ink);border:1px solid var(--win-ink);padding:2px 10px;cursor:pointer}
</style>

<div class="wrap">
  <div class="shell">
    <div class="bezel">
      <div class="bezel-top"><span class="power" aria-hidden="true"></span><span class="rb"></span><span>개굴 COLOR</span></div>
      <div class="lcd" id="lcd">
        <canvas id="scr" width="160" height="112" aria-label="게임 화면"></canvas>

          <p>고마워, 개구리용사!</p>

          <div class="credit">
            <svg width="46" height="38" viewBox="0 0 46 38" aria-label="manamiwu 로고"><rect width="46" height="38" fill="#000"/><circle cx="12" cy="10" r="6" fill="#fff"/><rect x="5" y="18" width="14" height="13" fill="#fff"/><polygon points="22,4 22,31 40,31" fill="#fff"/></svg>
            <span>Created by manamiwu</span>
          </div>
          <button class="lcd-btn" id="againBtn">▶ 처음부터</button>
        </div>
      </div>
      <div class="hud" id="hud"></div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>

    <div class="brand"><strong>개구리용사</strong><span>POCKET QUEST</span></div>

    <div class="foot"><span class="keyhint">키보드 1–6 · Esc 뒤로</span><div class="speaker" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>
</div>

<script>
/* ---------- colors ---------- */
const K='#1a1c2c';
const CM={k:K,g:'#9be05a',G:'#5aa83a',h:'#d4f59a',w:'#ffffff',r:'#e0303c',R:'#8e1a2a',d:'#b4f4ff',D:'#3cb4e8',y:'#f7d44a',
  b:'#8a5a2b',B:'#5a3a1c',p:'#9a52c8',P:'#5a2a80',o:'#f08a30',O:'#b85a1c',s:'#b4bac4',S:'#6c7280',n:'#f59ab8',e:'#ff3a3a',
  m:'#d8f0ff',c:'#f2e6c8',t:'#4aa0a0',T:'#2a6a6a'};
const COL={sky:'#7ec8f0',sky2:'#b8e4f8',cloud:'#ffffff',grass:'#6cc04a',grass2:'#4a9a36',grass3:'#2f6e2a',dirt:'#d4ae74',dirt2:'#b08a52',
  wall:'#f2e6c8',wall2:'#d6c49a',roof:'#d8504a',roof2:'#9a2e36',roofB:'#4a78c8',roofB2:'#2e4f94',roofY:'#e8a030',roofY2:'#a8681c',glass:'#8fd8f8',
  water:'#3c8ad8',water2:'#2c6ab8',waterHi:'#d0f0ff',lily:'#3fa24a',
  stone:'#9a9fa8',stone2:'#6c717c',stone3:'#3e424c',leaf:'#2f7a3a',leaf2:'#1e5a2c',leaf3:'#14401f',
  swamp:'#4e5e3e',swamp2:'#3a4a2e',mud:'#5e4a2c',cave:'#3a2c40',cave2:'#241a2c',cave3:'#53405c',carpet:'#a02040',
  clam:'#e8a0c8',clam2:'#a85888',torch:'#ff9a2a',torch2:'#ffe070'};

const C=document.getElementById('scr'),g=C.getContext('2d');g.imageSmoothingEnabled=false;
const W=160,H=112;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- pixel helpers ---------- */
function px(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function ellipse(cx,cy,rx,ry,c){for(let y=-ry;y<=ry;y++){const w=Math.floor(rx*Math.sqrt(1-(y*y)/(ry*ry)));px(cx-w,cy+y,w*2+1,1,c)}}
function disc(cx,cy,r,c){ellipse(cx,cy,r,r,c)}
function dither(x,y,w,h,c,ph=0){g.fillStyle=c;for(let yy=0;yy<h;yy++)for(let xx=(yy+ph)%2;xx<w;xx+=2)g.fillRect(x+xx,y+yy,1,1)}
const R=n=>{const x=Math.sin(n*91.7)*43758.5;return x-Math.floor(x)};

/* ---------- frogs (hero + villagers): drawn from parts, outlined ---------- */
function drawFrog(x,y,s,o={},t=0){
  const P=[];const A=(a,b,w,h,c)=>P.push([a,b,w,h,c]);
  if(o.cape){A(2,10,16,15,CM.R);A(3,11,14,14,CM.r);A(0,17,4,8,CM.r);A(16,17,4,8,CM.r);A(1,20,1,5,CM.R);A(18,20,1,5,CM.R)}
  A(6,22,3,3,CM.G);A(11,22,3,3,CM.G);A(4,25,5,2,CM.G);A(11,25,5,2,CM.G);
  A(5,11,10,12,CM.g);A(7,13,6,8,CM.h);
  if(o.apron){A(6,15,8,7,o.apron);A(6,15,8,1,CM.w)}
  if(o.cape){A(5,11,10,2,CM.r);A(9,11,2,2,CM.y);A(5,19,10,1,CM.B);A(9,19,2,1,CM.y)}
  A(3,13,2,6,CM.g);A(3,19,2,2,CM.G);
  if(o.sword){A(15,13,2,3,CM.g);A(15,16,2,2,CM.G)}else{A(15,13,2,6,CM.g);A(15,19,2,2,CM.G)}
  if(o.cane){A(17,11,1,16,CM.b);A(15,11,3,1,CM.b)}
  A(3,4,14,7,CM.g);A(4,1,5,4,CM.g);A(11,1,5,4,CM.g);
  A(5,2,3,2,CM.w);A(12,2,3,2,CM.w);A(6,3,1,1,K);A(13,3,1,1,K);
  A(6,8,8,1,CM.G);A(4,7,2,1,CM.n);A(14,7,2,1,CM.n);
  if(o.beard)A(7,9,6,3,CM.w);
  if(o.bow){A(12,0,2,2,CM.n);A(15,0,2,2,CM.n);A(14,1,1,1,CM.r)}
  if(o.sword){A(15,15,5,1,CM.y);A(17,16,2,3,CM.B);A(17,19,2,1,CM.y);A(17,3,2,12,CM.d);A(18,3,1,12,CM.D);A(17,1,2,2,CM.d)}
  for(const p of P)px(x+p[0]*s-1,y+p[1]*s-1,p[2]*s+2,p[3]*s+2,K);
  for(const p of P)px(x+p[0]*s,y+p[1]*s,p[2]*s,p[3]*s,p[4]);
  if(o.sword&&!RM){const k=Math.floor(t/180)%8;if(k<4)px(x+17*s,y+(4+k*3)*s,s,s,CM.w)}
}

};
function drawSprite(name,x,y,s,flash){
  SPR[name].forEach((h,r)=>{const full=h+[...h].reverse().join('');
    for(let c=0;c<16;c++){const ch=full[c];if(ch==='.')continue;px(x+c*s,y+r*s,s,s,flash?'#fff':CM[ch])}});
}

/* ---------- scene parts ---------- */
function house(x,y,w,h,roof,roof2){
  px(x-1,y-1,w+2,h+2,K);px(x,y,w,h,COL.wall);px(x,y+h-2,w,2,COL.wall2);
  const rh=Math.ceil(w/2)+1;
  for(let i=0;i<rh;i++){const ww=w+6-2*i;if(ww<=0)break;px(x-3+i-1,y-1-i,ww+2,1,K);px(x-3+i,y-1-i,ww,1,i<2?roof2:roof)}
  const dw=Math.max(3,Math.floor(w/4));px(x+Math.floor(w/2)-Math.floor(dw/2),y+h-Math.max(5,Math.floor(h*.55)),dw,Math.max(5,Math.floor(h*.55)),COL.dirt2);
  if(w>=12){px(x+2,y+3,3,3,COL.glass);px(x+w-5,y+3,3,3,COL.glass)}
}
function chest(x,y){px(x-1,y-1,18,13,K);px(x,y,16,11,'#a8682a');px(x,y,16,4,'#7a4a1c');px(x,y+4,16,1,CM.y);px(x+3,y,2,11,CM.y);px(x+11,y,2,11,CM.y);px(x+7,y+5,2,3,K)}

const HERO=new Image();HERO.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACQAAAAaCAYAAADfcP5FAAACIElEQVR4nM1Xv0sjQRT+Vu0EG4m4GitjwDaIWEpK11gIgiIB/4Gz2v5Ib3Fc/oGAiIKQIjGWYhlC2DaQsI0mqxxcE7hS5oq4z5nNzO7OaoIfDHnz3vz49s17byYG9MAkOkPDHgmdwazRL4wprXTdX2fMXmnN4/bwRmufOQ1CPAEwxnA/OCCyMnsFJ7rLY0Z7xjsMY/TRjX6Bmsw+NUKTgvaRyeJIZa+09Al9Ow8lJuQHb5icBNpHxuMrifhI7CE/VobXNQxKvzC8rgn6qROaFLQq9TT2iRqoJNHdyZGcbTpCn9frkop1ZOViXviNg2zTCVbwWB4OyzJWLubx4/JBSjDL6d12CetbP0M3uljJwfYchghPfSqo3XYJbruElJkhGQCOqsdjY22Pjo8hxFsyQqETeKTMDFJmZkyW4Xx3EwCksaYiRESiJsWFla5TwdxYMwEIgc4kTYwh19rD29/X2BsurJ5iOLgS+jzKxTx6zy/YWDPRe34BABze/VGuV91fYj6hxDUmSKLRL9At/5EQnfcM7aC6vxS2nGEAYK61RxreQ4E6IuCoeoyz7X9KO/d8BTCKod+PHQqH2cVlrDfuiQgvkHdkR1Z7+pBtz6EM8snwl2rwHrPSdT/dSccTAuCTIkJzXIdxjAV0d3JETOEV4cNk84GRxxVep/rEB7WyYGWbTuIYsz0HtieovqQwGrKFgm8gxZvICLTIjXQw8T+K/wFUX9Byak9+SQAAAABJRU5ErkJggg==';

/* ---------- scenes ---------- */
const SCENE={
 village(t,showHero=true){
  px(0,0,W,40,COL.sky);px(0,30,W,12,COL.sky2);clouds(t);
  ellipse(30,44,52,10,COL.grass2);ellipse(122,46,62,12,COL.grass2);
  px(0,42,W,H-42,COL.grass);

/* ---------- sound ---------- */
let ac=null;
function beep(f,d=.08,type='square',delay=0,vol=.06){if(!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v).connect(ac.destination);o.start(t);o.stop(t+d+.02)}
const SFX={
 tap:()=>beep(880,.04),
 hit:()=>{beep(220,.06);beep(110,.1,'square',.05)},
 hurt:()=>{beep(140,.15,'sawtooth');beep(90,.2,'sawtooth',.08)},
 magic:()=>[523,659,784,1046].forEach((f,i)=>beep(f,.07,'triangle',i*.05)),
 heal:()=>[392,523,659].forEach((f,i)=>beep(f,.1,'triangle',i*.08)),
 item:()=>[659,880].forEach((f,i)=>beep(f,.08,'square',i*.07)),
 lvup:()=>[523,659,784,659,784,1046].forEach((f,i)=>beep(f,.09,'square',i*.08)),
 enc:()=>[196,247,196,247].forEach((f,i)=>beep(f,.06,'square',i*.06)),
 win:()=>[784,784,1046].forEach((f,i)=>beep(f,.12,'square',i*.12))
};

/* ---------- message window ---------- */
const msgEl=$('msg');let typeTimer=null,typeDone=null;
function say(text){
  clearInterval(typeTimer);if(typeDone)typeDone();
  return new Promise(res=>{
    if(RM){msgEl.textContent=text;res();return}
    let i=0;msgEl.textContent='';
    typeDone=()=>{clearInterval(typeTimer);msgEl.textContent=text;typeDone=null;res()};
    typeTimer=setInterval(()=>{i+=2;msgEl.textContent=text.slice(0,i);if(i>=text.length)typeDone&&typeDone()},18);
  });
}
msgEl.addEventListener('click',()=>typeDone&&typeDone());

/* ---------- HUD & commands ---------- */
function hud(){$('hud').innerHTML=`<span><b>LV</b> ${st.lv}</span><span><b>HP</b> ${st.hp}/${st.maxhp}</span><span><b>MP</b> ${st.mp}/${st.maxmp}</span><span><b>G</b> ${st.gold}</span>`}
let busy=false,curCmds=[],sub=null;
function setCmds(list){
  curCmds=list.slice(0,6);while(curCmds.length<6)curCmds.push(null);
  const box=$('cmds');box.innerHTML='';
  curCmds.forEach((it,i)=>{const b=document.createElement('button');b.className='cmd';b.id='cmd'+i;
    if(!it){b.classList.add('blank');b.disabled=true;b.tabIndex=-1}
    else{b.innerHTML=it.label;b.disabled=busy||!!it.off;b.onclick=()=>run(it.fn)}
    box.appendChild(b)});
}
async function run(fn){if(busy)return;SFX.tap();busy=true;refreshDisabled();try{await fn()}finally{busy=false;if(st.mode!=='title'&&st.mode!=='end')(sub||mainCmds)();hud()}}
function refreshDisabled(){document.querySelectorAll('.cmd').forEach((b,i)=>{if(curCmds[i])b.disabled=busy||!!curCmds[i].off})}
function back(){sub=null}
function mainCmds(){
  if(st.mode==='battle')setCmds([
    {label:'공격',fn:attack},{label:'마법',fn:()=>{sub=magicMenu}},{label:'도구',fn:()=>{sub=itemMenu}},
    {label:'방어',fn:defend},{label:'도망',fn:flee,off:st.enemy&&st.enemy.boss},{label:'상태',fn:status}]);
  else setCmds([
    {label:'보기',fn:look},{label:'이동',fn:()=>{sub=moveMenu}},{label:'열기',fn:openAct},
    {label:'도구',fn:()=>{sub=itemMenu}},{label:'마법',fn:()=>{sub=magicMenu}},{label:'상태',fn:status}]);
}
function moveMenu(){setCmds([...LOC[st.loc].exits().map(k=>({label:LOC[k].name,fn:()=>{sub=null;return go(k)}})),{label:'뒤로',fn:back}])}
function itemMenu(){
  const list=Object.keys(ITEMS).filter(k=>st.items[k]>0).map(k=>({label:`${ITEMS[k].name}<small>×${st.items[k]}</small>`,fn:()=>useItem(k),off:k==='key'}));
  if(!list.length){sub=null;say('가방이 텅 비었다.');mainCmds();return}
  setCmds([...list,{label:'뒤로',fn:back}]);
}
function magicMenu(){
  const list=SPELLS.filter(s=>st.lv>=s.lv).map(s=>({label:`${s.name}<small>${s.mp}</small>`,fn:()=>cast(s),off:st.mode!=='battle'&&s.type==='atk'}));
  setCmds([...list,{label:'뒤로',fn:back}]);
}

  {label:'뒤로',fn:back}])}
async function buy(k,p){if(st.gold<p)return say('골드가 모자란다.');st.gold-=p;st.items[k]++;SFX.item();return say(`${josa(ITEMS[k].name,'을','를')} 샀다. (남은 골드 ${st.gold}G)`)}
async function status(){sub=null;return say(`레벨 ${st.lv}   경험치 ${st.xp}/${needXp(st.lv)}\n공격 ${st.atk}   방어 ${st.def}   골드 ${st.gold}G\n장비: ${st.equip.join(', ')}\n지금 위치: ${LOC[st.loc].name}`)}
async function useItem(k){
  sub=null;const it=st.items;
  if(k==='fly'){it.fly--;const h=Math.min(12,st.maxhp-st.hp);st.hp+=h;SFX.heal();hud();await say(`파리를 날름 먹었다! HP ${h} 회복.`)}
  else if(k==='herb'){it.herb--;const h=Math.min(25,st.maxhp-st.hp),m=Math.min(5,st.maxmp-st.mp);st.hp+=h;st.mp+=m;SFX.heal();hud();await say(`약초버섯을 먹었다! HP ${h} · MP ${m} 회복.`)}
  if(st.mode==='battle'){await sleep(400);await enemyTurn()}
}

/* ---------- battle ---------- */
let fx={flash:0,slash:0,bubbles:0},defending=false;
async function battle(k){
  const e=EN[k];st.enemy={key:k,...e,maxhp:e.hp,turn:0};st.mode='battle';sub=null;defending=false;SFX.enc();
  await say(`${josa(e.name,'이','가')} 나타났다!`);
}
async function attack(){
  const e=st.enemy;const crit=Math.random()<.1;
  let d=Math.max(1,st.atk+rnd(0,3)-e.def);if(crit)d=Math.floor(d*1.8);
  fx.slash=Date.now();SFX.hit();await sleep(150);fx.flash=Date.now();
  e.hp=Math.max(0,e.hp-d);
  await say(`개구리용사의 다이아 검 공격!${crit?' 회심의 일격!':''}\n${e.name}에게 ${d}의 피해!`);
  await afterPlayer();
}
async function cast(s){
  sub=null;
  if(st.mp<s.mp)return say('MP가 부족하다.');
  st.mp-=s.mp;hud();
  if(s.type==='heal'){const h=Math.min(s.pow+st.lv*2,st.maxhp-st.hp);st.hp+=h;SFX.heal();hud();await say(`${s.name}! 맑은 개굴 소리가 울려 퍼진다.\nHP ${h} 회복.`);
    if(st.mode==='battle'){await sleep(400);await enemyTurn()}return}
  const e=st.enemy;fx.bubbles=Date.now();SFX.magic();await sleep(350);fx.flash=Date.now();
  const d=Math.max(1,s.pow+st.lv+rnd(0,4)-Math.floor(e.def/2));e.hp=Math.max(0,e.hp-d);
  await say(`${s.name}!\n${e.name}에게 ${d}의 피해!`);
  await afterPlayer();
}
async function defend(){defending=true;await say('빨간 망토로 몸을 감싸고 방어 자세를 취했다.');await sleep(300);await enemyTurn()}
async function flee(){
  if(Math.random()<.6){st.mode='explore';st.enemy=null;await say('폴짝폴짝! 무사히 도망쳤다.');return}
  await say('도망치려 했지만 막혔다!');await sleep(300);await enemyTurn();
}
async function afterPlayer(){hud();if(st.enemy.hp<=0)return win();await sleep(450);await enemyTurn()}
async function enemyTurn(){
  const e=st.enemy;if(!e)return;e.turn++;
  const special=e.key==='snake'&&e.turn%3===0;
  let d=Math.max(1,e.atk+rnd(0,2)-st.def);if(special)d=Math.floor(d*1.7);if(defending)d=Math.ceil(d/2);defending=false;
  st.hp=Math.max(0,st.hp-d);SFX.hurt();
  const lcd=$('lcd');if(!RM){lcd.classList.remove('shake');void lcd.offsetWidth;lcd.classList.add('shake')}
  hud();
  const verb={mosq:'윙윙 찔렀다',beetle:'몸통 박치기를 했다',mush:'독가루를 뿌렸다',bat:'날카롭게 물었다',golem:'진흙 주먹을 휘둘렀다',cray:'집게로 꼬집었다',snake:'꼬리를 휘둘렀다'}[e.key];
  await say(special?`스르륵의 독 이빨!\n${d}의 피해를 입었다!`:`${josa(e.name,'이','가')} ${verb}!\n${d}의 피해를 입었다.`);
  if(st.hp<=0)return lose();
}
async function win(){
  const e=st.enemy;st.mode='explore';st.enemy=null;SFX.win();
  if(e.key==='snake'){st.flags.bossDown=1;await say('뱀왕 스르륵을 쓰러뜨렸다!\n막혀 있던 물길이 콸콸 터져 나온다!');await sleep(2200);return ending()}
  st.xp+=e.xp;st.gold+=e.g;
  await say(`${josa(e.name,'을','를')} 물리쳤다!\n경험치 ${e.xp} · ${e.g}G를 얻었다.`);
  if(e.key==='cray'){st.flags.cray=1;await sleep(900);await say('가재대장이 연못 속으로 도망쳤다. 이제 조개를 [열기] 할 수 있다!')}
  while(st.xp>=needXp(st.lv)){
    st.lv++;st.maxhp+=8;st.maxmp+=3;st.atk+=2;st.def+=1;st.hp=st.maxhp;st.mp=st.maxmp;hud();await sleep(900);SFX.lvup();
    const learn=SPELLS.find(s=>s.lv===st.lv);
    await say(`레벨 업! 개구리용사는 레벨 ${st.lv}이 되었다.\n최대 HP +8 · 최대 MP +3 · 공격 +2 · 방어 +1${learn?`\n새 마법 「${learn.name}」을 배웠다!`:''}`);
  }
}
async function lose(){
  await sleep(500);await say('개굴... 개구리용사의 눈앞이 깜깜해졌다.');await sleep(1400);
  st.mode='explore';st.enemy=null;st.loc='village';st.hp=st.maxhp;st.mp=st.maxmp;st.gold=Math.floor(st.gold/2);hud();
  await say('정신을 차려 보니 개구리 마을이었다. 장로 개구리가 돌봐 주었다.\n(골드가 절반으로 줄었다)');
}
function ending(){$('carryCode').textContent=makeCode(st.lv,st.gold);st.mode='end';$('ending').hidden=false;setCmds([]);$('againBtn').focus()}


/* ---------- 전편 이어하기 코드 ---------- */
const B36='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function makeCode(lv,gold){lv=Math.max(1,Math.min(30,lv));gold=Math.max(0,Math.min(999,gold));
  let n=lv*1000+gold,s='';for(let i=0;i<4;i++){s=B36[n%36]+s;n=Math.floor(n/36)}
  return 'GAE-'+s+B36[(lv*31+gold*7+13)%36];}
function readCode(c){c=(c||'').toUpperCase().replace(/[^0-9A-Z]/g,'');if(c.startsWith('GAE'))c=c.slice(3);if(c.length!==5)return null;
  let n=0;for(let i=0;i<4;i++){const v=B36.indexOf(c[i]);if(v<0)return null;n=n*36+v}
  const lv=Math.floor(n/1000),gold=n%1000;if(lv<1||lv>30)return null;
  if(B36[(lv*31+gold*7+13)%36]!==c[4])return null;return{lv,gold};}

$('copyCode').onclick=()=>{const t=$('carryCode').textContent,b=$('copyCode');
  const ok=()=>{b.textContent='복사됨!';setTimeout(()=>b.textContent='코드 복사',1500)};
  try{navigator.clipboard.writeText(t).then(ok,()=>{selCode();b.textContent='길게 눌러 복사'})}catch(_){selCode()}};
function selCode(){const r=document.createRange();r.selectNodeContents($('carryCode'));const s=getSelection();s.removeAllRanges();s.addRange(r)}
/* ---------- render loop ---------- */
function frame(t){
  const battling=st.mode==='battle'&&st.enemy;
  if(st.mode==='title'){SCENE.village(t,true);g.fillStyle='rgba(16,20,48,.45)';g.fillRect(0,0,W,H)}
  else if(battling){
    noHero=true;SCENE[st.loc](t,false);noHero=false;
    g.fillStyle='rgba(12,12,32,.6)';g.fillRect(0,0,W,H);
    const e=st.enemy,s=e.sc,size=16*s,bob=RM?0:Math.round(Math.sin(t/260)*2);
    const now=Date.now(),flash=now-fx.flash<220&&Math.floor((now-fx.flash)/55)%2===0;
    const x=(W-size)/2,y=H-size-10+bob;
    if(e.key!=='snake')ellipse(W/2,H-9,size/2.6,3,'rgba(0,0,0,.6)');
    if(e.key==='snake'){const bs=2,bw=BOSS.width*bs,bh=BOSS.height*bs,bx=(W-bw)/2,by=H-bh-4+bob;
      if(BOSS.complete){if(flash)g.filter='brightness(8)';g.drawImage(BOSS,bx,by,bw,bh);g.filter='none'}}
    else drawSprite(e.spr,x,y,s,flash);
    if(now-fx.slash<220){for(let i=0;i<6;i++)px(x+size*.2+i*6+((now-fx.slash)/8),y+size*.2+i*6,6,2,CM.d)}
    if(now-fx.bubbles<500){const p=(now-fx.bubbles)/500;for(let i=0;i<6;i++)disc(x+size/2+Math.cos(i)*size*.4*(1-p),y+size/2+Math.sin(i*1.7)*size*.4*(1-p),2+(i%2),COL.waterHi)}
    px(39,3,82,8,K);px(40,4,80,6,'#3a1020');px(40,4,80*(e.hp/e.maxhp),6,CM.e);
  }
  else SCENE[st.loc](t);
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
function begin(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(_){}
  $('title').hidden=true;$('ending').hidden=true;
  st=fresh();st.mode='explore';hud();sub=null;mainCmds();
  say('개구리 마을. 늪의 물이 끊긴 지 사흘째...\n장로 개구리가 개구리용사를 찾고 있다.\n[보기]를 눌러 보자.');
}
$('startBtn').onclick=begin;
$('againBtn').onclick=()=>{$('ending').hidden=true;$('title').hidden=false;st=fresh();hud();setCmds([]);say('')};
document.addEventListener('keydown',e=>{
  if(e.key>='1'&&e.key<='6'){const b=$('cmd'+(+e.key-1));if(b&&!b.disabled)b.click()}
  else if(e.key==='Escape'&&sub&&!busy){sub=null;mainCmds()}
  else if(e.key==='Enter'&&typeDone){typeDone()}
});
function start(data){
  if(data&&data.st){st=data.st;if(!st.equip.includes('다이아 검'))st.equip.unshift('다이아 검','빨간 망토');if(st.loc==='village'||LOC[st.loc]){}
    $('title').hidden=st.mode!=='title';$('ending').hidden=st.mode!=='end';if(st.mode!=='title'&&st.mode!=='end')mainCmds()}
  else setCmds([]);
  hud();if(st.mode==='title')msgEl.textContent='늪의 물이 끊긴 개구리 마을을 구하라!';
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(()=>({st}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
