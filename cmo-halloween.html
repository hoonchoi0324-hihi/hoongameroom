<title>CMO 할로윈</title>
<style>

<script>
'use strict';
/* ================= 기본 설정 ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dk=document.createElement('canvas'),dctx=dk.getContext('2d');
const T=40,R=14,WH=R*T,G=2200,JUMP=820,SPD=270;
const EF='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
let DPR=1,SC=1,VW=0,VH=0;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.floor(innerWidth*DPR);cv.height=Math.floor(innerHeight*DPR);
  SC=Math.min(cv.height/(WH-40),cv.width/(13*T));VW=cv.width/SC;VH=cv.height/SC;dk.width=cv.width;dk.height=cv.height;}
addEventListener('resize',resize);resize();
if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)document.body.classList.add('touch');

const LV=[
 {name:'1. 밤의 호박밭',sub:'호박들이 눈을 떴다',len:115,sky:['#1b0c30','#5a2140'],gr:'#2a1810',top:'#d8641f',dark:.38,pool:['pumpkin','pumpkin','bat'],deco:['🌾','🌽','🪵','🍂','🌾'],bdeco:['🌳','🏚️','🌾']},
 {name:'2. 안개 낀 공동묘지',sub:'무덤 아래에서 무언가 기어 나온다',len:130,sky:['#0b1220','#2b3648'],gr:'#1c2026',top:'#56685a',dark:.52,pool:['zombie','ghost','pumpkin','zombie'],deco:['🪦','🪦','⚰️','🥀','🦴'],bdeco:['🪦','⛪','🌳'],fog:1},
 {name:'3. 속삭이는 숲',sub:'나무 사이로 거미줄이 흔들린다',len:140,sky:['#04100a','#173828'],gr:'#141c16',top:'#3a5628',dark:.62,pool:['bat','spider','ghost','zombie'],deco:['🍄','🕸️','🪵','🌿','🍂'],bdeco:['🌲','🌲','🌳'],fog:1},
 {name:'4. 버려진 저택',sub:'누군가 아직 이 집에 살고 있다',len:145,sky:['#110606','#3a1212'],gr:'#26160f',top:'#6b3a22',dark:.72,pool:['ghost','spider','skull','bat'],deco:['🕯️','🕸️','🪑','🧸','🖼️'],bdeco:['🏚️','🕸️','🪟'],scare:1},
 {name:'5. 지하 납골당',sub:'뼈들이 달그락거린다',len:150,sky:['#040404','#18120e'],gr:'#272220',top:'#76664c',dark:.84,pool:['skull','zombie','spider','ghost'],deco:['🦴','⚰️','🕯️','🪨','🦴'],bdeco:['⚰️','🗿','🕯️'],scare:1,fog:1},
 {name:'6. 마녀의 성',sub:'성 꼭대기에서 고양이가 웃는다',len:140,boss:1,sky:['#12041a','#4c0a2c'],gr:'#1a0f20',top:'#7a2a8a',dark:.74,pool:['bat','ghost','skull','pumpkin'],deco:['🕯️','🧹','🔮','🕸️','🕯️'],bdeco:['🏰','🏰','🌙']}
];

/* ================= 변신 ================= */
const PW={
 wolf:{item:'🌕',name:'🐺 늑대 고양이',desc:'닿기만 해도 괴물 처치 · 빨라짐',t:9,col:'#ff5a3a'},
 witch:{item:'🧹',name:'🧙 마녀 고양이',desc:'공중에서 계속 점프 = 하늘을 날아요',t:10,col:'#c070ff'},
 ghost:{item:'🔮',name:'👻 유령 고양이',desc:'공격이 안 통하고 천천히 떨어져요',t:10,col:'#bfe6ff'}
};
/* ================= 오디오 ================= */
let AC=null,master=null,muted=false,ambTimer=null;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=muted?0:.55;master.connect(AC.destination);startAmb();}
function tone(f,d,type='square',v=.12,slide=0,delay=0){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}
function noise(d,v=.25,fr=900,delay=0){if(!AC)return;const t=AC.currentTime+delay,n=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,n,AC.sampleRate),a=buf.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=buf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fr;
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);}
function startAmb(){
  const g=AC.createGain();g.gain.value=.045;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=320;f.connect(g);g.connect(master);
  [55,55.6,82.4].forEach(fr=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.connect(f);o.start();});
  const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.12;lg.gain.value=160;l.connect(lg);lg.connect(f.frequency);l.start();
  const scale=[440,493.9,523.3,587.3,659.3,698.5,830.6,880];let idx=0;
  ambTimer=setInterval(()=>{if(!AC||muted)return;idx=Math.max(0,Math.min(7,idx+((Math.random()*5)|0)-2));
    const f0=scale[idx]*(Math.random()<.3?.5:1);tone(f0,1.6,'triangle',.035);tone(f0*2,1.2,'sine',.012,0,.01);},1150);}
const SFX={
 jump(){tone(380,.13,'square',.06,1.9)},
 stomp(){tone(240,.16,'square',.11,.35);noise(.12,.18,1200)},
 candy(){tone(1320,.07,'sine',.08,1.3);tone(1760,.1,'sine',.07,1.2,.05)},
 hurt(){tone(420,.55,'sawtooth',.13,.18);noise(.3,.12,600)},
 thunder(){noise(1.6,.45,350);noise(.4,.3,2000)},
 scream(){tone(820,.7,'sawtooth',.16,1.7);tone(870,.7,'sawtooth',.12,1.5);noise(.6,.3,3000)},
 thud(){tone(70,.35,'sine',.3,.5);noise(.25,.25,300)},
 boss(){tone(110,.9,'sawtooth',.15,.5);tone(116,.9,'sawtooth',.12,.45)},
 fire(){noise(.25,.15,1800);tone(300,.2,'triangle',.06,.5)},
 bhit(){tone(160,.35,'square',.16,.4);noise(.2,.22,900)},
 cp(){[523,659,784].forEach((f,i)=>tone(f,.25,'triangle',.08,0,i*.09))},
 win(){[392,494,587,784,988].forEach((f,i)=>tone(f,.3,'square',.06,0,i*.11))},
 morph(){[392,523,659,784,1046,1318].forEach((f,i)=>tone(f,.18,'triangle',.08,0,i*.06));noise(.3,.1,4000)},
 unmorph(){[784,659,523,392].forEach((f,i)=>tone(f,.15,'triangle',.06,0,i*.07))},
 retro(){[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.11,'square',.07,0,i*.08))},
 pew(){tone(1400,.12,'square',.05,.4)},
 laugh(){for(let i=0;i<5;i++)tone(300-i*20,.12,'sawtooth',.09,1.4,i*.13)}
};
function sfx(n){if(AC&&!muted)SFX[n]();}

/* ================= 이모지 캐시 ================= */
const EC={};
function emc(ch,px){px=Math.max(6,Math.round(px));const k=ch+px;let c=EC[k];if(!c){c=document.createElement('canvas');const p=Math.ceil(px*1.35);c.width=c.height=p;
  const g=c.getContext('2d');g.font=px+'px '+EF;g.textAlign='center';g.textBaseline='middle';g.fillText(ch,p/2,p/2+px*.07);EC[k]=c;}return c;}
// 월드 좌표에 그리기(현재 변환 scale=SC 기준)
function em(ch,x,y,s,flip=false,a=1,rot=0){const c=emc(ch,s*SC),w=c.width/SC;ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);if(rot)ctx.rotate(rot);if(flip)ctx.scale(-1,1);ctx.drawImage(c,-w/2,-w/2,w,w);ctx.restore();}
// 화면 픽셀 좌표에 그리기
function ems(ch,x,y,px,a=1,rot=0,flip=false){const c=emc(ch,px);ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);if(rot)ctx.rotate(rot);if(flip)ctx.scale(-1,1);ctx.drawImage(c,-c.width/2,-c.height/2);ctx.restore();}
function txt(s,x,y,px,col='#fff',al='center',w='700',a=1,glow=null){ctx.save();ctx.globalAlpha*=a;ctx.font=`${w} ${px}px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif`;
  ctx.textAlign=al;ctx.textBaseline='middle';if(glow){ctx.shadowColor=glow;ctx.shadowBlur=px*.6;}ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore();}

/* ================= 상태 ================= */
let S='title',lvl=0,lives=9,candy=0,Lv=null,P=null,boss=null,fires=[],parts=[],kills=[],totals=[];
let tmr=0,shake=0,camX=0,camY=0,scare=0,flash=0,thunderT=8,msg=null,endT=0,trueEnd=false,credT=0,gT=0;
const K={l:0,r:0,j:0};let jumpQ=false;
let buddy=null,buddyOn=false,stars=[];

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ================= 맵 생성 ================= */
function mkEn(type,tx,gt){
  const e={type,alive:true,x:tx*T+5,y:0,w:30,h:30,vx:0,vy:0,ph:Math.random()*6,st:0,tm:Math.random(),on:false};
  switch(type){
    case'pumpkin':e.ch='🎃';e.y=gt*T-30;e.vx=-55;e.glow=1;break;
    case'zombie':e.ch='🧟';e.h=34;e.y=gt*T-34;e.vx=-36;break;
    case'ghost':e.ch='👻';e.bx=e.x;e.by=(gt-2.3)*T;e.y=e.by;break;
    case'bat':e.ch='🦇';e.bx=e.x;e.by=(gt-4)*T;e.y=e.by;break;
    case'spider':e.ch='🕷️';e.ay=Math.max(0,gt-7)*T;e.hy=e.ay+50;e.y=e.hy;e.gy=gt*T-30;break;
    case'skull':e.ch='💀';e.y=gt*T-30;break;
  }
  return e;
}
function build(i){
  const C=LV[i],r=rng(777+i*131),W=C.len,g=[];for(let y=0;y<R;y++)g.push(new Uint8Array(W));
  const ens=[],items=[],decoF=[],decoB=[];let gt=11,x=0,cp=null,ax=0,firstHigh=null;
  const col=(x,top)=>{for(let y=top;y<R;y++)g[y][x]=1;};
  const plat=(x0,n,row)=>{for(let k=0;k<n;k++)g[row][x0+k]=2;};
  const pick=a=>a[(r()*a.length)|0];
  const item=(tx,ty)=>items.push({x:tx*T+20,y:ty*T+20,got:false,ch:r()<.5?'🍬':'🍭',ph:r()*6});
  const PWS=['wolf','witch','ghost'];const power=(tx,ty,pw)=>items.push({x:tx*T+20,y:ty*T+20,got:false,pw,ch:PW[pw].item,ph:r()*6});
  const diff=i/5;
  for(;x<8;x++)col(x,gt);
  const end=C.boss?W-30:W-14;
  while(x<end){
    const p=r();
    if(!cp&&x>W*.45){for(let k=0;k<5;k++)col(x+k,gt);cp={tx:x+2,gt,on:false};power(x+3,gt-2,pick(PWS));x+=5;continue;}
    if(p<.32){const n=5+((r()*4)|0);for(let k=0;k<n;k++)col(x+k,gt);
      ens.push(mkEn(pick(C.pool),x+2+((r()*(n-3))|0),gt));
      if(n>=7&&diff>.3&&r()<.4)ens.push(mkEn(pick(C.pool),x+n-2,gt));
      if(r()<.55)for(let k=1;k<n-1;k+=2)item(x+k,gt-2);x+=n;}
    else if(p<.46){gt=Math.max(8,Math.min(11,gt+(r()<.5?-1:1)));const n=3+((r()*3)|0);for(let k=0;k<n;k++)col(x+k,gt);x+=n;}
    else if(p<.63){const gw=2+(r()<.25+diff*.5?1:0);for(let k=0;k<gw;k++)item(x+k,gt-3);x+=gw;for(let k=0;k<3;k++)col(x+k,gt);x+=3;}
    else if(p<.79){plat(x+2,3,gt-2);item(x+3,gt-3);if(r()<.4+diff*.4)ens.push(mkEn('bat',x+3,gt));x+=7;for(let k=0;k<3;k++)col(x+k,gt);x+=3;}
    else{const n=8;for(let k=0;k<n;k++)col(x+k,gt);plat(x+2,4,gt-3);if(!firstHigh)firstHigh={tx:x+4,gt};for(let k=0;k<4;k++){if(k===1&&r()<.35)power(x+3,gt-4,pick(PWS));else item(x+2+k,gt-4);}
      if(r()<.6){const pool=C.pool.filter(t=>t!=='spider');ens.push(mkEn(pick(pool),x+6,gt));}x+=n;}
  }
  if(C.boss){gt=11;ax=x;power(ax-1,gt-2,'wolf');for(;x<W;x++)col(x,gt);plat(W-21,3,8);plat(W-14,3,8);}
  else for(;x<W;x++)col(x,gt);
  // 장식
  for(let tx=1;tx<W-6;tx++){let top=-1;for(let y=0;y<R;y++)if(g[y][tx]===1){top=y;break;}
    if(top>0&&g[top-1][tx]===0&&r()<.13)decoF.push({ch:pick(C.deco),x:tx*T+20,y:top*T-15,s:26+r()*8});}
  for(let wx=60;wx<W*T*.6+900;wx+=140+r()*220)decoB.push({ch:pick(C.bdeco),x:wx,s:70+r()*60});
  const doorX=(W-4)*T;
  return {W,g,ens,items,decoF,decoB,cp,ax,gate:false,start:{x:2*T,y:10*T-30},
    door:{x:doorX,y:11*T-54,show:!C.boss},tvPos:firstHigh?{x:firstHigh.tx*T,y:(firstHigh.gt-6)*T+20}:(cp?{x:cp.tx*T+20,y:(cp.gt-5)*T+20}:null),tv:null,scareX:C.scare?Math.floor(W*(.55+r()*.2))*T:1e9,scared:false};
}
function mkBoss(L){return{x:(L.W-8)*T,y:11*T-84,w:90,h:84,vx:0,vy:0,hp:6,max:6,inv:0,t:0,act:1.5,face:-1,alive:true,awake:false,on:false,sx:(L.W-8)*T};}

/* ================= 충돌 ================= */
function solid(tx,ty){if(tx<0||tx>=Lv.W)return true;if(ty<0||ty>=R)return false;return Lv.g[ty][tx]>0;}
function moveX(e,dx){e.x+=dx;const t0=Math.floor(e.y/T),t1=Math.floor((e.y+e.h-.01)/T);
  if(dx>0){const tx=Math.floor((e.x+e.w)/T);for(let ty=t0;ty<=t1;ty++)if(solid(tx,ty)){e.x=tx*T-e.w-.001;return true;}}
  else if(dx<0){const tx=Math.floor(e.x/T);for(let ty=t0;ty<=t1;ty++)if(solid(tx,ty)){e.x=(tx+1)*T+.001;return true;}}
  return false;}
function moveY(e,dy){e.y+=dy;e.on=false;const t0=Math.floor(e.x/T),t1=Math.floor((e.x+e.w-.01)/T);
  if(dy>0){const ty=Math.floor((e.y+e.h)/T);for(let tx=t0;tx<=t1;tx++)if(solid(tx,ty)){e.y=ty*T-e.h;e.vy=0;e.on=true;return true;}}
  else if(dy<0){const ty=Math.floor(e.y/T);for(let tx=t0;tx<=t1;tx++)if(solid(tx,ty)){e.y=(ty+1)*T;e.vy=0;return true;}}
  return false;}
function ov(a,b,m=4){return a.x<b.x+b.w-m&&a.x+a.w>b.x+m&&a.y<b.y+b.h-m&&a.y+a.h>b.y+m;}

/* ================= 진행 ================= */
function newGame(){buddyOn=false;buddy=null;lvl=0;lives=9;candy=0;kills=[];totals=[];loadLevel(0);}
function loadLevel(i){lvl=i;Lv=build(i);P={x:Lv.start.x,y:Lv.start.y,w:26,h:30,vx:0,vy:0,on:false,face:1,coy:0,buf:0,inv:0,rot:0,walk:0,form:null,ft:0};
  boss=LV[i].boss?mkBoss(Lv):null;fires=[];stars=[];
  Lv.tv=(!buddyOn&&i<=2&&Lv.tvPos)?{x:Lv.tvPos.x,y:Lv.tvPos.y,got:false}:null;
  buddy=buddyOn?{x:P.x-30,y:P.y-40,t:0,cd:1.5}:null;parts=[];kills[i]=0;totals[i]=Lv.ens.length+(boss?1:0);
  S='intro';tmr=2.3;camX=0;scare=0;flash=0;thunderT=6+Math.random()*6;msg=null;}
function burst(x,y,n,chs,sp=260){for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,v=sp*(.3+Math.random()*.7);
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,l:.8+Math.random()*.5,ml:1.2,ch:chs?chs[(Math.random()*chs.length)|0]:null,c:'#ff8a2a',s:chs?22:4,rot:Math.random()*6});}}
function killEn(e){e.alive=false;if(!e.sum)kills[lvl]++;burst(e.x+15,e.y+15,10,null,220);parts.push({x:e.x+15,y:e.y+15,vx:0,vy:-200,l:.7,ml:.7,ch:e.ch,s:30,fade:1,rot:0});sfx('stomp');}
function hurt(force){if(S!=='play')return;if(!force&&P.inv>0)return;lives--;sfx('hurt');S='dying';tmr=1.1;P.vy=-560;P.vx=0;shake=.35;burst(P.x+13,P.y+15,8,['💢','✨']);}
function respawn(){const c=Lv.cp&&Lv.cp.on?Lv.cp:null;P.x=c?c.tx*T:Lv.start.x;P.y=c?c.gt*T-31:Lv.start.y;P.vx=P.vy=0;P.inv=1.6;P.rot=0;P.form=null;P.ft=0;S='play';if(buddy){buddy.x=P.x-30;buddy.y=P.y-40;}stars=[];
  if(boss&&Lv.gate){for(let y=0;y<11;y++)Lv.g[y][Lv.ax]=0;Lv.gate=false;if(boss.alive){boss.awake=false;boss.x=boss.sx;boss.y=11*T-boss.h;boss.vx=boss.vy=0;boss.act=1.5;}

function restart(){if(['play','intro','dying'].includes(S)&&lives>0)loadLevel(lvl);}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.55;document.getElementById('bm').textContent=muted?'🔇':'🔊';}
// 한글 자판(ㅁ/ㅇ)이어도 동작하도록 물리 키(e.code) 기준으로 처리
function keyOf(e){const c=e.code||'';
  if(c==='KeyA'||c==='ArrowLeft')return'l';if(c==='KeyD'||c==='ArrowRight')return'r';
  if(c==='Space'||c==='KeyW'||c==='ArrowUp')return'j';if(c==='Enter'||c==='NumpadEnter')return'enter';
  if(c==='KeyR')return'restart';if(c==='KeyM')return'mute';
  const k=(e.key||'').toLowerCase();
  if(k==='a'||k==='ㅁ'||k==='arrowleft')return'l';if(k==='d'||k==='ㅇ'||k==='arrowright')return'r';
  if(k===' '||k==='w'||k==='ㅈ'||k==='arrowup')return'j';if(k==='enter')return'enter';if(k==='r'||k==='ㄱ')return'restart';if(k==='m'||k==='ㅡ')return'mute';return null;}
addEventListener('keydown',e=>{const k=keyOf(e);if(!k)return;e.preventDefault();if(e.repeat)return;initAudio();
  if(k==='l')K.l=1;else if(k==='r')K.r=1;else if(k==='j')jumpDown();else if(k==='enter')tap();else if(k==='restart')restart();else if(k==='mute')toggleMute();});
addEventListener('keyup',e=>{const k=keyOf(e);if(k==='l')K.l=0;else if(k==='r')K.r=0;else if(k==='j')jumpUp();});
cv.tabIndex=0;cv.style.outline='none';
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{window.focus();cv.focus();}catch(_){}tap();});
addEventListener('load',()=>{try{window.focus();cv.focus();}catch(_){}});
function bind(id,on,off){const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();try{b.setPointerCapture(e.pointerId);}catch(_){}b.classList.add('on');try{window.focus();}catch(_){}initAudio();on();});
  const up=()=>{if(!b.classList.contains('on'))return;b.classList.remove('on');off&&off();};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);}
bind('bl',()=>K.l=1,()=>K.l=0);bind('bri',()=>K.r=1,()=>K.r=0);bind('bj',jumpDown,jumpUp);bind('br',restart);bind('bm',toggleMute);
addEventListener('blur',()=>{K.l=K.r=K.j=0;});
addEventListener('contextmenu',e=>e.preventDefault());

/* ================= 루프 ================= */
let last=performance.now();
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;
  while(dt>0){const s=Math.min(dt,1/60);update(s);dt-=s;}
  if(S==='title')drawTitle();
  else if(S==='over'){drawWorld();drawOver();}
  else if(S==='ending')drawEnding();
  else if(S==='credits')drawCredits();
  else{drawWorld();drawHUD();drawOverlay();}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__dbg={get S(){return S},get lvl(){return lvl},get Lv(){return Lv},get P(){return P},get boss(){return boss},loadLevel,K,kills,totals,setS:v=>S=v};
</script>
